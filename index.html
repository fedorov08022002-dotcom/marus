ель. Интернет, госпрограммы и западные заимствования — позднейшие факторы, не первичные.","ref":91},{"q":"Какие элементы включает имидж политического деятеля?","options":["только программу партии и идеологические взгляды","визуальный образ, речь, поведение, ценности, репутацию, образ в СМИ","только биографию и профессиональные достижения","только медиаприсутствие и рейтинги"],"correct":1,"expl":"Имидж политика — комплекс: внешний (визуальный) образ, речь и коммуникация, поведение, ценности и убеждения, репутация и биография, образ в СМИ. Сводить только к программе, биографии или медиа — упрощение.","ref":99},{"q":"Целью политической коммуникации является:","options":["максимизация явки на выборы","воздействие на аудиторию для формирования мнения и поддержки власти","распространение партийной идеологии","повышение политической грамотности граждан"],"correct":1,"expl":"Цель политической коммуникации — целенаправленное воздействие на аудиторию (электорат) для формирования мнения, поддержки власти и влияния на политпроцесс. Явка, идеология и грамотность — частные задачи, не общая цель.","ref":100},{"q":"Кто считается «отцом» современного PR как индустрии?","options":["Айви Ли","Эдвард Бернейс","Томас Джефферсон","Гарольд Лассуэлл"],"correct":1,"expl":"Эдвард Бернейс считается «отцом» современного PR как индустрии и дисциплины, систематизировавшим методы в XX веке (книга «Кристаллизация общественного мнения», 1923). Термин же ввёл Джефферсон. Айви Ли — другой пионер (этика, открытость).","ref":96},{"q":"Кто создавал рекламу в стиле «реклам-конструктор» в СССР?","options":["Дзига Вертов и Эль Лисицкий","Владимир Маяковский (слоганы) и Александр Родченко (графика)","Александр Дейнека и Густав Клуцис","Анастас Микоян и Сергей Эйзенштейн"],"correct":1,"expl":"Маяковский (рифмованные слоганы) и Родченко (графика конструктивизма) в начале 1920-х открыли совместное агентство «Реклам-конструктор». Работали для Моссельпрома, ГУМа. Дейнека, Клуцис, Вертов, Лисицкий — другие конструктивисты, но не этот проект.","ref":93},{"q":"Что использовалось в Российской империи как прототип PR?","options":["профессиональные PR-агентства западного типа","выставки, фирменный стиль, спонсорство театров и музеев, связи с элитами","системный политический PR с медиатренингом","массовые информационные кампании через радио"],"correct":1,"expl":"Прототипы PR в Российской империи: печатная реклама, выставки, фирменный стиль, спонсорство, связи с элитами, лоббизм в Госдуме. Профессиональные агентства, медиатренинг и радио — это уже XX век и позже.","ref":92},{"q":"Какой принцип политического PR в государственных органах является ключевым?","options":["защита репутации главы ведомства","прозрачность и гласность — регулярное информирование граждан","максимальная медиа-активность","соответствие политике правящей партии"],"correct":1,"expl":"Среди ключевых принципов работы госструктур — именно прозрачность и гласность: регулярное информирование граждан о деятельности. Защита репутации главы, медиа-активность и партийность противоречат принципам политического PR в госорганах.","ref":97},{"q":"Что относится к направлениям работы PR-специалистов в политике?","options":["только избирательные кампании","имиджмейкинг, медиарилейшнз, кризисные коммуникации, GR, digital, работа с мнением","только GR-лоббизм в органах власти","только подготовка речей и выступлений"],"correct":1,"expl":"Направления политического PR: имиджмейкинг, медиарилейшнз, стратегическое планирование, кризисные коммуникации, работа с общественным мнением, digital, лоббизм/GR, организация мероприятий. Сводить к одному — упрощение.","ref":103},{"q":"На какую аудиторию были рассчитаны ролики банка «Империал»?","options":["молодёжь, ищущую современный банк","зрелую обеспеченную аудиторию, ценящую традиции и надёжность","студентов и начинающих предпринимателей","корпоративных клиентов и юридических лиц"],"correct":1,"expl":"Ролики Бекмамбетова были рассчитаны именно на зрелую, обеспеченную аудиторию, ценящую исторические традиции, надёжность и престиж. Не молодёжь, не студенты, не B2B — а взрослые состоявшиеся клиенты.","ref":95},{"q":"В каком документе Джефферсон употребил термин «public relations»?","options":["в Декларации независимости","в черновике «Седьмого обращения к Конгрессу» (1807)","в Конституции США","в личной переписке"],"correct":1,"expl":"Джефферсон употребил выражение «public relations» в черновике «Седьмого обращения к Конгрессу» (1807), заменив им формулировку «состояние мысли» (state of thought). Не в Декларации, не в Конституции, не в переписке.","ref":96},{"q":"Какой слоган создали Маяковский и Родченко для Моссельпрома?","options":["«Лучше пейте в Моссельпроме!»","«Нигде, кроме как в Моссельпроме!»","«Только в Моссельпроме!»","«Моссельпром — выбор советского человека!»"],"correct":1,"expl":"Самый известный слоган — «Нигде, кроме как в Моссельпроме!». Он стал классикой советской рекламной графики. Прочие варианты — придуманные дистракторы, стилистически правдоподобные, но не реальные.","ref":93},{"q":"Что инициировал Анастас Микоян в пищевой промышленности?","options":["открытие сети ресторанов «Прага»","массовое производство мороженого, «докторской» колбасы, соков, кукурузных хлопьев","национализацию частных пищевых предприятий","импорт продуктов из США и Европы"],"correct":1,"expl":"Микоян инициировал массовое производство мороженого, «докторской» колбасы, соков, кукурузных хлопьев (после поездки в США в 1936 г.). Также курировал «Книгу о вкусной и здоровой пище». Не рестораны, национализация и импорт.","ref":94},{"q":"Что НЕ является принципом политического PR в госорганах?","options":["приоритет общественного интереса","служение интересам отдельных чиновников и политических партий","двусторонний диалог с гражданами","достоверность информации"],"correct":1,"expl":"Деятельность PR-служб в органах власти НЕ должна служить интересам отдельных чиновников и партий, а должна способствовать развитию демократии и открытости. Приоритет общественного интереса, диалог и достоверность — это и есть принципы.","ref":97}]},{"category":"PR-кампании и тексты","questions":[{"q":"С чего начинается построение PR-кампании?","options":["с подбора подрядчиков и согласования бюджета","с определения задач и целей","с выбора каналов коммуникации","с создания креативной концепции"],"correct":1,"expl":"Этапы PR-кампании: 1) определение целей и задач (измеримых), 2) определение аудитории, 3) выбор темы, 4) выбор каналов, 5) планирование бюджета. Без чёткой цели остальные шаги бессмысленны.","ref":101},{"q":"Какой принцип структуры используют в PR-текстах для СМИ?","options":["хронологический — события в порядке развития","«перевёрнутая пирамида» — сначала самое главное","нарративный — построение истории с интригой","классический — введение, развитие, кульминация, развязка"],"correct":1,"expl":"PR-тексты для СМИ строятся именно по принципу «перевёрнутой пирамиды»: сначала самое важное, затем подробности и справка. Это позволяет журналисту легко переработать материал и сохранить суть, даже если урежет конец.","ref":102},{"q":"Что относится к жанрам PR-текстов для СМИ?","options":["роман, повесть, эссе","пресс-релиз, бэкграундер, факт-лист, пресс-кит, заявление","новость, репортаж, обзор","рекламная статья, баннер, лонгрид"],"correct":1,"expl":"Жанры PR-текстов: пресс-релиз, пресс-анонс, пост-релиз, бэкграундер, факт-лист, пресс-кит, заявление для СМИ, экспертный комментарий, интервью. Художественные и журналистские жанры — другие категории; реклама — иной тип.","ref":102},{"q":"При подготовке коммуникационной кампании в первую очередь:","options":["считают предполагаемую прибыль и ROI","определяют целевую аудиторию","нанимают подрядчиков и креативное агентство","анализируют кампании конкурентов"],"correct":1,"expl":"По Келлеру, первые пять шагов: определение ЦА, постановка целей, разработка сообщения, выбор каналов, определение бюджета. Начинают с аудитории. ROI и подрядчики — позже; анализ конкурентов — параллельная задача.","ref":70},{"q":"Что такое политические коммуникации по сущности?","options":["реклама партий перед выборами","система обмена информацией между субъектами политики для формирования мнения и легитимации власти","работа PR-отделов государственных ведомств","распространение партийной идеологии через СМИ"],"correct":1,"expl":"Политические коммуникации — широкая система обмена информацией между властью, обществом, партиями, СМИ для формирования мнения и легитимации власти. Реклама, госPR и идеология — частные проявления, а не сущность.","ref":103},{"q":"Что такое лидер общественного мнения?","options":["официальное должностное лицо","человек, чьё мнение значительно влияет на взгляды широкой аудитории","самый цитируемый эксперт в отрасли","владелец крупной медиа-площадки"],"correct":1,"expl":"Лидер мнений (opinion leader) — человек (эксперт, блогер, активист), чьё мнение влияет на взгляды и поведение аудитории благодаря доверию и узнаваемости. Это не должность, не цитируемость и не владение медиа.","ref":81},{"q":"Чем PR-текст для СМИ отличается от рекламы?","options":["он короче","содержит новость и факты, общественно значимую информацию, а не просто хвалит организацию","он бесплатный","он создаётся журналистами"],"correct":1,"expl":"PR-текст должен содержать новость, факт, общественно значимую информацию — иначе СМИ его не возьмут. Реклама же напрямую хвалит и побуждает к покупке. Краткость, стоимость и авторство — производные различия.","ref":102},{"q":"Какой стиль характерен для PR-текстов для СМИ?","options":["эмоциональный, рекламный","нейтральный, удобный для журналистской переработки","художественный, образный","разговорный, неформальный"],"correct":1,"expl":"PR-текст для СМИ пишется нейтральным стилем, удобным для журналистской переработки в новость или статью. Эмоциональный — для рекламы; художественный — для прозы; разговорный — для соцсетей.","ref":102},{"q":"Какие первые пять шагов разработки коммуникаций (по Келлеру)?","options":["бюджет → анализ → план → исполнение → отчёт","определение ЦА → цели → сообщение → каналы → бюджет","концепция → согласование → подрядчики → запуск → KPI","исследование → стратегия → тактика → реализация → оценка"],"correct":1,"expl":"По Келлеру: определение ЦА → цели коммуникации → разработка сообщения → выбор каналов → определение бюджета. Это первые 5 шагов; затем — комплекс ИМК, оценка результатов, управление процессом.","ref":70}]},{"category":"Репутация и стратегии","questions":[{"q":"Что такое репутационный менеджмент?","options":["управление сотрудниками PR-отдела","управление формированием и корректировкой репутации компании, доведение её до ЦА","юридическая защита деловой репутации в судах","автоматический мониторинг упоминаний бренда"],"correct":1,"expl":"Репутационный менеджмент — управление процессом формирования и корректировки репутационных и имиджевых характеристик и доведения их до ЦА. Это шире, чем мониторинг или юридическая защита — это управленческая дисциплина.","ref":66},{"q":"Какие инструменты входят в репутационный менеджмент в сети?","options":["только работа со СМИ и пресс-релизы","ORM, SERM, SMM, SEO","только мониторинг отзывов на отзовиках","только реклама и платное размещение"],"correct":1,"expl":"Стратегии репутационного менеджмента в сети — это именно ORM (вся онлайн-репутация), SERM (поисковая выдача), SMM (соцсети), SEO (оптимизация). Работа со СМИ — отдельное направление (медиарилейшнз), мониторинг и реклама — лишь часть.","ref":66},{"q":"Что стоит делать с обоснованными негативными отзывами?","options":["игнорировать, ждать, пока тема забудется","оперативно и вежливо реагировать, признать проблему, предложить решение","удалять с площадок через юридические запросы","публично спорить с автором, доказывая его неправоту"],"correct":1,"expl":"С обоснованным негативом нужно: реагировать оперативно (в часы), вежливо, по структуре, признать проблему, предложить решение, отвечать публично там же. Игнорирование, удаление и спор — антипаттерны, усиливающие проблему.","ref":69},{"q":"Какое понятие описывает образ организации в сознании общественности?","options":["репутация — на основе реальных действий","имидж — целенаправленно формируемый образ","бренд — комплекс характеристик","рейтинг — числовая оценка"],"correct":1,"expl":"Имидж — это именно целенаправленно формируемый образ в сознании общественности; заявленная (идеальная) позиция (по Чумикову), в отличие от репутации как воспринятой позиции. Бренд шире; рейтинг — измеримый показатель.","ref":68},{"q":"Разработка комплекса мер для достижения целей с эффективным использованием ресурсов — это:","options":["оперативное управление","стратегическое планирование","тактическое планирование","финансовое управление"],"correct":1,"expl":"Это именно стратегическое планирование деятельности предприятия — определение последовательности достижения целей с учётом эффективного использования ресурсов каждым подразделением. Оперативное и тактическое — короткий горизонт; финансовое — узкая функция.","ref":75},{"q":"Как в модели социальной ответственности формулируется роль прессы?","options":["полная свобода без обязательств перед обществом","сочетание свободы СМИ с ответственностью перед обществом","полное подчинение государственным интересам","инструмент развлечения аудитории"],"correct":1,"expl":"Модель социальной ответственности (Сиберт, Шрамм, Питерсон) развивает либертарианскую: свобода СМИ должна СОЧЕТАТЬСЯ с ответственностью перед обществом. Полная свобода — либертарианская модель; госконтроль — авторитарная.","ref":80}]},{"category":"Внутренний PR и фандрайзинг","questions":[{"q":"Что такое внутрикорпоративный PR?","options":["работа PR-отдела с внешними партнёрами","система коммуникаций внутри организации для климата и корпоративной культуры","HR-функция по подбору и обучению персонала","PR-сопровождение топ-менеджеров"],"correct":1,"expl":"Внутрикорпоративный PR — именно система коммуникаций ВНУТРИ организации для благоприятного климата, укрепления корпкультуры и взаимодействия руководства с сотрудниками. Не внешние партнёры, не HR и не личный PR руководителей.","ref":110},{"q":"Что означает термин «фандрайзинг»?","options":["управление инвестиционными портфелями","деятельность по привлечению финансовых и иных ресурсов для проектов","выпуск ценных бумаг для финансирования","распределение бюджета между подразделениями"],"correct":1,"expl":"Фандрайзинг — деятельность по привлечению и аккумулированию ресурсов (денег, товаров, услуг, времени) для проектов, НКО, мероприятий, стартапов. Источники: доноры, спонсоры, гранты, государство, краудфандинг. Не инвестиции и не бюджетирование.","ref":112},{"q":"С какой целью проводится пресс-конференция?","options":["для прямой продажи продуктов журналистам","для официального информирования СМИ и ответов на вопросы журналистов","для публичных дебатов между конкурентами","для презентации годового отчёта инвесторам"],"correct":1,"expl":"Пресс-конференция — форма коллективного интервью для официального донесения значимой информации до СМИ и ответов на вопросы журналистов. Это не продажи, не дебаты и не презентация инвесторам (для этого — investor relations).","ref":113},{"q":"Что относится к константам фирменного/корпоративного стиля?","options":["миссия, ценности, стратегические цели","логотип, фирменные цвета, шрифты, слоган","ассортимент, цены, каналы сбыта","руководство, сотрудники, корпоративная культура"],"correct":1,"expl":"Константы фирменного стиля — это визуальные неизменные элементы: товарный знак/логотип, фирменные цвета, шрифты, слоган, фирменный блок, маскот, гайдлайн. Прочие списки — содержание бренда (миссия), маркетинг-микс или внутренняя среда.","ref":114},{"q":"Какие каналы относятся к внутрифирменному информированию?","options":["наружная реклама и билборды","корпоративные издания, интранет, email, собрания, корпмероприятия","рекламные кампании в СМИ","социальные сети с открытым доступом"],"correct":1,"expl":"Каналы внутреннего PR: корпоративные издания, корпоративный сайт/интранет, email и мессенджеры, собрания, корпмероприятия, корпоративное радио/видео, доски объявлений. Внешние каналы (наружка, СМИ, открытые соцсети) — не для внутреннего информирования.","ref":110}]}];

// === STATE ===
const STORAGE_KEY = 'gia2026_progress_v2';
let state = {
  tab: 'learn',
  current: 0,
  mode: 'all',
  category: 'все',
  search: '',
  filtered: [],
  showHint: false,
  showAnswer: false,
  statuses: {},
  // Test mode
  testView: 'list',  // 'list' | 'quiz' | 'results'
  activeTheme: null,
  testIdx: 0,
  testAnswers: [],   // {opt: number, correct: bool}
  quizQuestions: [], // подготовленный набор вопросов для текущего теста
  testScores: {},    // { themeName: {best: %, attempts: N, lastDate} }
};

try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  if (saved.statuses) state.statuses = saved.statuses;
  if (saved.current !== undefined) state.current = saved.current;
  if (saved.mode) state.mode = saved.mode;
  if (saved.category) state.category = saved.category;
  if (saved.tab) state.tab = saved.tab;
  if (saved.testScores) state.testScores = saved.testScores;
} catch(e) {}

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      statuses: state.statuses,
      current: state.current,
      mode: state.mode,
      category: state.category,
      tab: state.tab,
      testScores: state.testScores,
    }));
  } catch(e) {}
}

function getStatus(qNum) { return state.statuses[qNum] || 'new'; }
function setStatus(qNum, status) { state.statuses[qNum] = status; saveProgress(); }

function getCategories() {
  const set = new Set(['все']);
  QUESTIONS.forEach(q => set.add(q.category));
  return Array.from(set);
}

function filterQuestions() {
  let list = QUESTIONS.slice();
  if (state.category !== 'все') list = list.filter(q => q.category === state.category);
  if (state.search) {
    const s = state.search.toLowerCase();
    list = list.filter(q =>
      q.title.toLowerCase().includes(s) ||
      q.answer.toLowerCase().includes(s) ||
      String(q.num).includes(s)
    );
  }
  if (state.mode === 'learn') list = list.filter(q => getStatus(q.num) !== 'known');
  else if (state.mode === 'random') list = list.slice().sort(() => Math.random() - 0.5);
  state.filtered = list;
  if (state.current >= list.length) state.current = 0;
}

// === RENDER PROGRESS ===
function renderProgress() {
  if (state.tab === 'learn') {
    const total = QUESTIONS.length;
    let k=0, p=0, u=0;
    Object.values(state.statuses).forEach(s => {
      if (s==='known') k++;
      else if (s==='partial') p++;
      else if (s==='unknown') u++;
    });
    const pct = Math.round(((k + p*0.5) / total) * 100);
    document.getElementById('progressPct').textContent = pct + '%';
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('cntKnown').textContent = k;
    document.getElementById('cntPartial').textContent = p;
    document.getElementById('cntUnknown').textContent = u;
  } else {
    const totalThemes = TEST_THEMES.length;
    // Считаем только пройденные ТЕМЫ (без экзамена) для прогресс-бара
    let doneThemes = 0;
    TEST_THEMES.forEach(t => { if (state.testScores[t.category]) doneThemes++; });
    const pct = Math.round(doneThemes / totalThemes * 100);
    document.getElementById('progressPct').textContent = pct + '%';
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('testDone').textContent = doneThemes;
    let avg = 0, n = 0;
    Object.values(state.testScores).forEach(sc => { avg += sc.best; n++; });
    document.getElementById('testAvg').textContent = n > 0 ? Math.round(avg/n) + '%' : '—';
  }
}

function renderCategories() {
  const cats = getCategories();
  const wrap = document.getElementById('categoryPills');
  wrap.innerHTML = '';
  cats.forEach(cat => {
    const el = document.createElement('div');
    el.className = 'pill' + (state.category === cat ? ' active' : '');
    el.textContent = cat;
    el.onclick = () => {
      state.category = cat;
      state.current = 0;
      saveProgress();
      renderAll();
    };
    wrap.appendChild(el);
  });
}

function renderList() {
  const wrap = document.getElementById('qList');
  wrap.innerHTML = '';
  if (state.filtered.length === 0) {
    wrap.innerHTML = '<div style="color:var(--ink-faint);padding:20px 8px;font-size:13px">Ничего не найдено</div>';
    return;
  }
  state.filtered.forEach((q, idx) => {
    const div = document.createElement('div');
    div.className = 'q-item' + (idx === state.current ? ' current' : '');
    const status = getStatus(q.num);
    div.innerHTML = `
      <div class="q-num">${q.num}</div>
      <div class="q-title">${escapeHtml(q.title)}</div>
      <div class="q-status ${status}"></div>
    `;
    div.onclick = () => {
      state.current = idx;
      state.showHint = false;
      state.showAnswer = false;
      saveProgress();
      renderContent();
      renderList();
      closeSidebarOnMobile();
      window.scrollTo({top:0, behavior:'smooth'});
    };
    wrap.appendChild(div);
    if (idx === state.current) {
      setTimeout(() => div.scrollIntoView({block:'nearest', behavior:'smooth'}), 50);
    }
  });
}

// === LEARN CONTENT ===
function renderLearnContent() {
  const main = document.getElementById('content');
  if (state.filtered.length === 0) {
    main.innerHTML = `<div class="empty"><h2>Ничего не найдено</h2><p>Измените фильтры или поиск.</p></div>`;
    return;
  }
  const q = state.filtered[state.current];
  const status = getStatus(q.num);
  const statusLabels = {known:'выучено', partial:'частично знаю', unknown:'не знаю', new:'новый'};

  let html = `
    <div class="crumb">
      <span class="cat">${escapeHtml(q.category)}</span>
      <span class="num">№ ${q.num} из 120</span>
    </div>
    <h1 class="q-heading">${escapeHtml(q.title)}</h1>
    <div class="current-status">
      Статус: <span class="badge ${status}">${statusLabels[status]}</span>
    </div>
    <div class="actions">
      <button class="btn ghost" id="btnHint">${state.showHint ? '🔽 Скрыть подсказку' : '💡 Показать подсказку'}</button>
      <button class="btn primary" id="btnAnswer">${state.showAnswer ? '🔽 Скрыть ответ' : '📖 Показать полный ответ'}</button>
    </div>
  `;

  if (state.showHint) {
    html += `<div class="hint-card"><div class="hint-text">${escapeHtml(q.hint)}</div></div>`;
  }

  if (state.showAnswer) {
    html += `
      <div class="ornament"><div class="line"></div><div class="dot"></div><div class="label">Развёрнутый ответ</div><div class="dot"></div><div class="line"></div></div>
      <div class="answer-card"><div class="answer-text">${escapeHtml(q.answer)}</div></div>
      <div class="assessment">
        <div class="assessment-label">Как ты знаешь этот вопрос?</div>
        <div class="assess-buttons">
          <button class="assess-btn unknown ${status==='unknown'?'active':''}" data-st="unknown"><span class="ic">✗</span><span>Не знал</span></button>
          <button class="assess-btn partial ${status==='partial'?'active':''}" data-st="partial"><span class="ic">~</span><span>Частично</span></button>
          <button class="assess-btn known ${status==='known'?'active':''}" data-st="known"><span class="ic">✓</span><span>Знаю уверенно</span></button>
        </div>
      </div>
    `;
  }

  html += `
    <div class="nav-row">
      <button class="nav-btn" id="btnPrev" ${state.current === 0 ? 'disabled' : ''}><span class="arrow">←</span> Предыдущий</button>
      <div class="nav-info">${state.current + 1} / ${state.filtered.length}</div>
      <button class="nav-btn" id="btnNext" ${state.current === state.filtered.length - 1 ? 'disabled' : ''}>Следующий <span class="arrow">→</span></button>
    </div>
  `;

  main.innerHTML = html;

  document.getElementById('btnHint').onclick = () => { state.showHint = !state.showHint; renderLearnContent(); };
  document.getElementById('btnAnswer').onclick = () => { state.showAnswer = !state.showAnswer; renderLearnContent(); };
  const prev = document.getElementById('btnPrev');
  if (prev) prev.onclick = () => navigate(-1);
  const next = document.getElementById('btnNext');
  if (next) next.onclick = () => navigate(1);

  document.querySelectorAll('.assess-btn').forEach(btn => {
    btn.onclick = () => {
      setStatus(q.num, btn.dataset.st);
      renderAll();
      if (state.current < state.filtered.length - 1) setTimeout(() => navigate(1), 300);
    };
  });
}

function navigate(delta) {
  const next = state.current + delta;
  if (next < 0 || next >= state.filtered.length) return;
  state.current = next;
  state.showHint = false;
  state.showAnswer = false;
  saveProgress();
  renderLearnContent();
  renderList();
  updateMobileUI();
  animateContent(delta > 0 ? 'right' : 'left');
  window.scrollTo({top:0, behavior:'smooth'});
}

// === TEST CONTENT ===
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let totalTestQuestions = 0;
TEST_THEMES.forEach(t => totalTestQuestions += t.questions.length);

function startQuiz(themeIdx, count) {
  // themeIdx === -1 → экзамен по всем темам
  let pool;
  if (themeIdx === -1) {
    pool = [];
    TEST_THEMES.forEach(t => t.questions.forEach(q => pool.push(Object.assign({_cat: t.category}, q))));
  } else {
    const theme = TEST_THEMES[themeIdx];
    pool = theme.questions.map(q => Object.assign({_cat: theme.category}, q));
  }
  pool = shuffle(pool);
  if (count && count < pool.length) pool = pool.slice(0, count);
  state.quizQuestions = pool;
  state.activeTheme = themeIdx;
  state.testView = 'quiz';
  state.testIdx = 0;
  state.testAnswers = [];
  saveProgress();
  renderContent();
  animateContent('fade');
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderTestList() {
  const main = document.getElementById('content');
  let html = `
    <h1 class="q-heading">Тестовый режим</h1>
    <div class="test-intro">
      <p>Всего в банке <strong>${totalTestQuestions}</strong> вопросов по <strong>${TEST_THEMES.length}</strong> темам. Выберите тему — и пройдите тест с вариантами ответов. После каждого ответа появляется объяснение со ссылкой на нужный вопрос в учёбе. Вопросы и варианты перемешиваются при каждой попытке.</p>
    </div>
    <div class="exam-banner" id="examAll">
      <div class="exam-text">
        <div class="exam-title">🎓 Экзамен по всем темам</div>
        <div class="exam-sub">20 случайных вопросов из всех разделов — как на настоящем ГИА</div>
      </div>
      <div class="exam-go">Начать →</div>
    </div>
    <div class="ornament"><div class="line"></div><div class="dot"></div><div class="label">Или выберите тему</div><div class="dot"></div><div class="line"></div></div>
    <div class="theme-grid">
  `;
  TEST_THEMES.forEach((theme, idx) => {
    const sc = state.testScores[theme.category];
    const scoreLabel = sc ? `${sc.best}%` : '—';
    const scoreClass = sc ? (sc.best >= 80 ? 'green' : sc.best >= 50 ? 'amber' : 'red') : '';
    const scoreInk = sc ? (sc.best >= 80 ? 'accent-dark' : sc.best >= 50 ? 'ochre' : 'red') : '';
    html += `
      <div class="theme-card" data-idx="${idx}">
        <div class="t-cat">${escapeHtml(theme.category)}</div>
        <div class="t-meta">
          <span>${theme.questions.length} ${plural(theme.questions.length, 'вопрос','вопроса','вопросов')}</span>
          ${sc ? `<span class="t-score" style="background: var(--${scoreClass}-soft); color: var(--${scoreInk})">Лучший: ${scoreLabel}</span>` : ''}
        </div>
      </div>
    `;
  });
  html += `</div>`;
  main.innerHTML = html;

  document.getElementById('examAll').onclick = () => startQuiz(-1, 20);

  document.querySelectorAll('.theme-card').forEach(card => {
    card.onclick = () => {
      const idx = parseInt(card.dataset.idx);
      const theme = TEST_THEMES[idx];
      // Если вопросов много — предложить выбор длины
      if (theme.questions.length > 10) {
        state.testView = 'length';
        state.activeTheme = idx;
        showLengthChooser(idx);
      } else {
        startQuiz(idx, null);
      }
    };
  });
  updateMobileUI();
}

function showLengthChooser(idx) {
  const theme = TEST_THEMES[idx];
  const n = theme.questions.length;
  const main = document.getElementById('content');
  main.innerHTML = `
    <div class="crumb"><span class="cat">${escapeHtml(theme.category)}</span><span class="num">${n} вопросов в теме</span></div>
    <h1 class="q-heading">Сколько вопросов пройти?</h1>
    <div class="test-intro"><p>В этой теме много вопросов. Выберите, сколько случайных вопросов вы хотите пройти за один заход.</p></div>
    <div class="len-grid">
      <button class="len-btn" data-n="10">10 вопросов<small>быстрая проверка</small></button>
      <button class="len-btn" data-n="20">20 вопросов<small>основательно</small></button>
      <button class="len-btn" data-n="0">Все ${n}<small>полный прогон</small></button>
    </div>
    <div style="margin-top:24px"><button class="btn ghost" id="backToThemes">← Назад к темам</button></div>
  `;
  document.querySelectorAll('.len-btn').forEach(b => {
    b.onclick = () => {
      const cnt = parseInt(b.dataset.n);
      startQuiz(idx, cnt === 0 ? null : cnt);
    };
  });
  document.getElementById('backToThemes').onclick = () => { state.testView = 'list'; state.activeTheme = null; renderContent(); animateContent('left'); };
  updateMobileUI();
  animateContent('right');
}

function plural(n, one, two, five) {
  const mod10 = n % 10, mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return one;
  if ([2,3,4].includes(mod10) && ![12,13,14].includes(mod100)) return two;
  return five;
}

function renderQuiz() {
  const main = document.getElementById('content');
  const quizQs = state.quizQuestions || [];
  const quizTitle = state.activeTheme === -1 ? 'Экзамен · все темы' : TEST_THEMES[state.activeTheme].category;
  const q = quizQs[state.testIdx];
  const answered = state.testAnswers[state.testIdx];

  // Progress dots
  let dotsHtml = '';
  for (let i = 0; i < quizQs.length; i++) {
    let cls = 'dot';
    if (i < state.testAnswers.length) {
      cls += state.testAnswers[i].correct ? ' done' : ' wrong';
    } else if (i === state.testIdx) cls += ' current';
    dotsHtml += `<div class="${cls}"></div>`;
  }

  let optsHtml = '';
  q.options.forEach((opt, i) => {
    let cls = 'quiz-opt';
    if (answered) {
      if (i === q.correct) cls += ' correct';
      else if (i === answered.opt) cls += ' wrong';
    }
    const letter = String.fromCharCode(1040 + i); // А, Б, В, Г
    optsHtml += `
      <button class="quiz-opt ${cls.replace('quiz-opt','')}" data-i="${i}" ${answered ? 'disabled' : ''}>
        <span class="letter">${letter}</span>
        <span class="opt-text">${escapeHtml(opt)}</span>
      </button>
    `;
  });

  let feedbackHtml = '';
  if (answered) {
    const isCorrect = answered.correct;
    feedbackHtml = `
      <div class="feedback ${isCorrect ? 'correct' : 'wrong'}">
        <strong>${isCorrect ? '✓ Верно!' : '✗ Не совсем'}</strong>
        ${escapeHtml(q.expl)}
        ${q.ref ? `<br><a class="ref-link" data-ref="${q.ref}">→ Открыть вопрос №${q.ref} в учёбе</a>` : ''}
      </div>
    `;
  }

  const isLast = state.testIdx === quizQs.length - 1;
  const nextLabel = isLast ? 'Завершить тест →' : 'Следующий вопрос →';

  let html = `
    <div class="crumb">
      <span class="cat">${escapeHtml(quizTitle)}</span>
      <span class="num">Вопрос ${state.testIdx + 1} из ${quizQs.length}</span>
    </div>
    <div class="quiz-question">
      <div class="quiz-header">
        <span>${state.activeTheme === -1 ? escapeHtml(q._cat || '') : 'Тестовый режим'}</span>
        <div class="progress-dots">${dotsHtml}</div>
      </div>
      <div class="quiz-q">${escapeHtml(q.q)}</div>
      <div class="quiz-options" id="quizOptions">${optsHtml}</div>
      ${feedbackHtml}
      <div class="quiz-actions">
        <button class="btn ghost" id="quitTest">← К темам</button>
        ${answered ? `<button class="btn primary" id="nextQ">${nextLabel}</button>` : '<div></div>'}
      </div>
    </div>
  `;
  main.innerHTML = html;

  document.querySelectorAll('.quiz-opt').forEach(b => {
    b.onclick = () => {
      if (answered) return;
      const chosen = parseInt(b.dataset.i);
      const isCorrect = chosen === q.correct;
      state.testAnswers[state.testIdx] = { opt: chosen, correct: isCorrect };
      renderQuiz();
    };
  });
  document.getElementById('quitTest').onclick = () => {
    state.testView = 'list';
    state.activeTheme = null;
    saveProgress();
    renderContent();
    animateContent('left');
    window.scrollTo({top:0, behavior:'smooth'});
  };
  const nextBtn = document.getElementById('nextQ');
  if (nextBtn) nextBtn.onclick = () => {
    if (isLast) {
      // Сохраняем результат
      const correct = state.testAnswers.filter(a => a.correct).length;
      const pct = Math.round(correct / quizQs.length * 100);
      const cat = state.activeTheme === -1 ? 'Экзамен (все темы)' : TEST_THEMES[state.activeTheme].category;
      if (!state.testScores[cat]) state.testScores[cat] = { best: 0, attempts: 0 };
      state.testScores[cat].attempts++;
      state.testScores[cat].best = Math.max(state.testScores[cat].best, pct);
      state.testScores[cat].last = pct;
      state.testScores[cat].lastDate = new Date().toISOString();
      saveProgress();
      state.testView = 'results';
      renderContent();
      animateContent('scale');
      window.scrollTo({top:0, behavior:'smooth'});
    } else {
      state.testIdx++;
      renderQuiz();
      updateMobileUI();
      animateContent('right');
      window.scrollTo({top:0, behavior:'smooth'});
    }
  };

  // авто-скролл к объяснению после ответа (моб.)
  if (answered) {
    setTimeout(() => {
      const fb = document.querySelector('.feedback');
      if (fb && window.innerWidth <= 600) fb.scrollIntoView({behavior:'smooth', block:'nearest'});
    }, 120);
  }

  // Ссылки на учебные вопросы
  document.querySelectorAll('.ref-link').forEach(a => {
    a.onclick = (e) => {
      e.preventDefault();
      const refNum = parseInt(a.dataset.ref);
      switchToLearn(refNum);
    };
  });
}

function switchToLearn(qNum) {
  state.tab = 'learn';
  document.getElementById('sidebar').dataset.mode = 'learn';
  document.querySelectorAll('#tabSwitch button').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === 'learn'));
  state.category = 'все';
  state.search = '';
  state.mode = 'all';
  document.querySelectorAll('.modes button').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === 'all'));
  filterQuestions();
  // Найти индекс вопроса по номеру
  const idx = state.filtered.findIndex(q => q.num === qNum);
  if (idx >= 0) {
    state.current = idx;
    state.showHint = false;
    state.showAnswer = false;
  }
  saveProgress();
  renderAll();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderResults() {
  const isExam = state.activeTheme === -1;
  const themeName = isExam ? 'Экзамен · все темы' : TEST_THEMES[state.activeTheme].category;
  const main = document.getElementById('content');
  const correct = state.testAnswers.filter(a => a.correct).length;
  const total = state.quizQuestions.length;
  const pct = Math.round(correct / total * 100);

  let verdict, emoji;
  if (pct === 100) { verdict = 'Превосходно! Полное знание.'; emoji = '🏆'; }
  else if (pct >= 75) { verdict = 'Отличный результат, тема почти освоена.'; emoji = '✨'; }
  else if (pct >= 50) { verdict = 'Неплохо, но есть что подтянуть.'; emoji = '💪'; }
  else { verdict = 'Это стоит подучить. Загляните в раздел «Учёба».'; emoji = '📚'; }

  const c = 2 * Math.PI * 60;
  const offset = c - (pct/100) * c;
  const stroke = pct >= 75 ? 'var(--accent)' : pct >= 50 ? 'var(--ochre)' : 'var(--red)';

  main.innerHTML = `
    <div class="crumb">
      <span class="cat">${escapeHtml(themeName)}</span>
      <span class="num">Результаты</span>
    </div>
    <div class="results-card">
      <div style="font-size:42px;margin-bottom:8px">${emoji}</div>
      <div class="score-circle">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="60" fill="none" stroke="var(--rule)" stroke-width="8"/>
          <circle cx="70" cy="70" r="60" fill="none" stroke="${stroke}" stroke-width="8" stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
        </svg>
        <div class="num">${pct}%</div>
        <div class="of">${correct} из ${total}</div>
      </div>
      <h2>${pct === 100 ? 'Идеально!' : pct >= 75 ? 'Отлично!' : pct >= 50 ? 'Хорошо' : 'Стоит повторить'}</h2>
      <div class="verdict">${verdict}</div>
      <div class="results-actions">
        <button class="btn primary" id="retry">↻ Пройти ещё раз</button>
        <button class="btn" id="backList">← К списку тем</button>
        ${isExam ? '' : '<button class="btn ghost" id="studyMore">📚 Учить тему</button>'}
      </div>
    </div>
  `;

  document.getElementById('retry').onclick = () => {
    startQuiz(state.activeTheme, state.quizQuestions.length);
  };
  document.getElementById('backList').onclick = () => {
    state.testView = 'list';
    state.activeTheme = null;
    renderContent();
  };
  const sm = document.getElementById('studyMore');
  if (sm) sm.onclick = () => {
    state.tab = 'learn';
    document.getElementById('sidebar').dataset.mode = 'learn';
    document.querySelectorAll('#tabSwitch button').forEach(b =>
      b.classList.toggle('active', b.dataset.tab === 'learn'));
    state.category = themeName;
    state.search = '';
    state.mode = 'all';
    state.current = 0;
    saveProgress();
    renderAll();
    window.scrollTo({top:0, behavior:'smooth'});
  };
}

function renderContent() {
  if (state.tab === 'learn') {
    filterQuestions();
    renderLearnContent();
  } else {
    if (state.testView === 'quiz' && (!state.quizQuestions || state.quizQuestions.length === 0)) {
      state.testView = 'list';
    }
    if (state.testView === 'results' && (!state.quizQuestions || state.quizQuestions.length === 0)) {
      state.testView = 'list';
    }
    if (state.testView === 'length' && (state.activeTheme === null || state.activeTheme < 0)) {
      state.testView = 'list';
    }
    if (state.testView === 'list') renderTestList();
    else if (state.testView === 'length') showLengthChooser(state.activeTheme);
    else if (state.testView === 'quiz') renderQuiz();
    else if (state.testView === 'results') renderResults();
  }
  updateMobileUI();
}

// Анимация смены контента
function animateContent(direction) {
  const main = document.getElementById('content');
  if (!main) return;
  const cls = direction === 'right' ? 'anim-right' : direction === 'left' ? 'anim-left' : 'anim-fade';
  main.classList.remove('anim-right','anim-left','anim-fade','anim-scale');
  void main.offsetWidth; // reflow для перезапуска анимации
  main.classList.add(cls);
}

// Обновление мобильного бара и нижней навигации
function updateMobileUI() {
  const bar = document.getElementById('mobileBar');
  const bottomNav = document.getElementById('bottomNav');
  const mbTitle = document.getElementById('mbTitle');

  // Определяем, нужна ли кнопка "назад" в баре
  let showBack = false;
  let title = 'Тренажёр ГИА';

  if (state.tab === 'learn') {
    title = '📚 Учёба';
  } else {
    if (state.testView === 'list') {
      title = '✓ Тест';
    } else if (state.testView === 'length') {
      title = state.activeTheme >= 0 && TEST_THEMES[state.activeTheme] ? TEST_THEMES[state.activeTheme].category : 'Выбор';
      showBack = true;
    } else if (state.testView === 'quiz') {
      title = state.activeTheme === -1 ? 'Экзамен' : (TEST_THEMES[state.activeTheme] ? TEST_THEMES[state.activeTheme].category : 'Тест');
      showBack = true;
    } else if (state.testView === 'results') {
      title = 'Результаты';
      showBack = true;
    }
  }
  if (mbTitle) mbTitle.textContent = title;
  if (bar) bar.classList.toggle('show-back', showBack);

  // Нижняя навигация показывается только в режиме учёбы с карточками
  if (bottomNav) {
    if (state.tab === 'learn' && state.filtered.length > 0) {
      bottomNav.classList.add('show');
      const prev = document.getElementById('bnPrev');
      const next = document.getElementById('bnNext');
      const counter = document.getElementById('bnCounter');
      const reveal = document.getElementById('bnReveal');
      if (prev) prev.disabled = state.current === 0;
      if (next) next.disabled = state.current === state.filtered.length - 1;
      if (counter) counter.textContent = `${state.current + 1} / ${state.filtered.length}`;
      if (reveal) reveal.textContent = state.showAnswer ? '🔼 Скрыть' : '📖 Ответ';
    } else {
      bottomNav.classList.remove('show');
    }
  }
}

function renderAll() {
  if (state.tab === 'learn') {
    filterQuestions();
    renderCategories();
    renderList();
  }
  renderProgress();
  renderContent();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

// === EVENTS ===
document.querySelectorAll('#tabSwitch button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#tabSwitch button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.tab = btn.dataset.tab;
    document.getElementById('sidebar').dataset.mode = state.tab;
    if (state.tab === 'test') {
      state.testView = 'list';
      state.activeTheme = null;
    }
    saveProgress();
    renderAll();
    animateContent('fade');
    closeSidebarOnMobile();
    window.scrollTo({top:0, behavior:'smooth'});
  };
});

document.querySelectorAll('.modes button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.modes button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.mode = btn.dataset.mode;
    state.current = 0;
    saveProgress();
    renderAll();
  };
});

document.getElementById('searchInput').addEventListener('input', (e) => {
  state.search = e.target.value;
  state.current = 0;
  renderAll();
});

document.getElementById('resetBtn').onclick = () => {
  if (confirm('Сбросить ВЕСЬ прогресс (и учёбу, и тесты)? Это действие нельзя отменить.')) {
    state.statuses = {};
    state.testScores = {};
    state.current = 0;
    saveProgress();
    renderAll();
  }
};

document.getElementById('mobileToggle').onclick = openSidebar;
document.getElementById('backdrop').onclick = closeSidebarOnMobile;

function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('backdrop').classList.add('show');
}
function closeSidebarOnMobile() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
}

// === Мобильный верхний бар ===
document.getElementById('mbMenu').onclick = openSidebar;
document.getElementById('mbBack').onclick = () => {
  // Кнопка "назад" в баре
  if (state.tab === 'test') {
    if (state.testView === 'results' || state.testView === 'quiz' || state.testView === 'length') {
      state.testView = 'list';
      state.activeTheme = null;
      saveProgress();
      renderContent();
      animateContent('left');
      window.scrollTo({top:0, behavior:'smooth'});
    }
  }
};

// === Нижняя навигация (карточки учёбы) ===
document.getElementById('bnPrev').onclick = () => navigate(-1);
document.getElementById('bnNext').onclick = () => navigate(1);
document.getElementById('bnReveal').onclick = () => {
  state.showAnswer = !state.showAnswer;
  renderLearnContent();
  updateMobileUI();
  // плавный скролл к ответу
  if (state.showAnswer) {
    setTimeout(() => {
      const ac = document.querySelector('.answer-card');
      if (ac) ac.scrollIntoView({behavior:'smooth', block:'start'});
    }, 100);
  }
};

// === Свайпы по карточкам (моб.) ===
let touchStartX = 0, touchStartY = 0, touchTime = 0;
const mainEl = document.querySelector('.main');
mainEl.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchTime = Date.now();
}, {passive: true});
mainEl.addEventListener('touchend', (e) => {
  if (state.tab !== 'learn') return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const dt = Date.now() - touchTime;
  // Горизонтальный свайп: достаточно длинный, быстрый, преимущественно горизонтальный
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8 && dt < 600) {
    if (dx < 0) navigate(1);   // свайп влево → следующий
    else navigate(-1);          // свайп вправо → предыдущий
  }
}, {passive: true});

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (state.tab !== 'learn') return;
  if (e.key === 'ArrowLeft') navigate(-1);
  else if (e.key === 'ArrowRight') navigate(1);
  else if (e.key === ' ') { e.preventDefault(); state.showAnswer = !state.showAnswer; renderLearnContent(); updateMobileUI(); }
  else if (e.key === 'h' || e.key === 'H' || e.key === 'р') { state.showHint = !state.showHint; renderLearnContent(); }
  else if (e.key === '1' && state.showAnswer) { setStatus(state.filtered[state.current].num,'unknown'); renderAll(); if(state.current<state.filtered.length-1) setTimeout(()=>navigate(1),200); }
  else if (e.key === '2' && state.showAnswer) { setStatus(state.filtered[state.current].num,'partial'); renderAll(); if(state.current<state.filtered.length-1) setTimeout(()=>navigate(1),200); }
  else if (e.key === '3' && state.showAnswer) { setStatus(state.filtered[state.current].num,'known'); renderAll(); if(state.current<state.filtered.length-1) setTimeout(()=>navigate(1),200); }
});

// Init
document.getElementById('sidebar').dataset.mode = state.tab;
document.querySelectorAll('#tabSwitch button').forEach(b =>
  b.classList.toggle('active', b.dataset.tab === state.tab));
document.querySelectorAll('.modes button').forEach(b =>
  b.classList.toggle('active', b.dataset.mode === state.mode));
renderAll();
</script>
