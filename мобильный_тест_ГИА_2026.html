<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2d5d9f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Тренажёр ГИА 2026 · 120 вопросов</title>
<style>
  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface-2: #faf9f6;
    --text: #1a1a1a;
    --text-muted: #6b6b6b;
    --text-soft: #9a9a9a;
    --border: #e4e2dc;
    --primary: #2d5d9f;
    --primary-dark: #1e4477;
    --primary-bg: #e8f0fa;
    --success: #2d7a4e;
    --success-bg: #e6f3eb;
    --danger: #b03b3b;
    --danger-bg: #fbecec;
    --warning: #a96a18;
    --warning-bg: #fbf2e2;
    --radius: 12px;
    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    min-height: 100vh;
    min-height: 100dvh;
  }

  body {
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
  }

  /* === SCREENS === */
  .screen {
    display: none;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 16px;
    padding-top: calc(var(--safe-top) + 16px);
    padding-bottom: calc(var(--safe-bottom) + 24px);
    max-width: 640px;
    margin: 0 auto;
  }
  .screen.active { display: block; }

  /* === HEADER === */
  .app-title {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .app-sub {
    margin: 0 0 20px;
    color: var(--text-muted);
    font-size: 14px;
  }

  h2.section-title {
    margin: 22px 0 10px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    font-weight: 600;
  }
  h2.section-title:first-child { margin-top: 4px; }

  /* === CARDS === */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }

  /* === MODE TILES (single column on mobile) === */
  .modes {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .mode-tile {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    text-align: left;
    font: inherit;
    color: inherit;
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
  }
  .mode-tile.selected {
    border-color: var(--primary);
    background: var(--primary-bg);
  }
  .mode-tile-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .mode-tile-desc {
    font-size: 13px;
    color: var(--text-muted);
  }

  /* === TOPIC CHIPS === */
  .topics {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
  }
  .chip {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 999px;
    padding: 7px 12px;
    cursor: pointer;
    font-size: 13px;
    font: inherit;
    color: inherit;
    font-weight: 500;
    -webkit-appearance: none;
    appearance: none;
  }
  .chip.selected {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }
  .chip-count {
    opacity: 0.7;
    margin-left: 4px;
    font-size: 11px;
  }

  /* === TOGGLES === */
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    font-size: 14px;
  }
  .toggle-row + .toggle-row { border-top: 1px solid var(--border); }
  .toggle-label { color: var(--text); }
  .toggle {
    width: 44px;
    height: 26px;
    background: #c9c6bd;
    border-radius: 999px;
    border: none;
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
    padding: 0;
    flex-shrink: 0;
  }
  .toggle.on { background: var(--primary); }
  .toggle::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 20px;
    height: 20px;
    background: white;
    border-radius: 50%;
    transition: transform 0.2s;
  }
  .toggle.on::after { transform: translateX(18px); }

  /* === BUTTONS === */
  .btn {
    display: inline-block;
    width: 100%;
    padding: 14px 18px;
    border-radius: var(--radius);
    border: 1.5px solid transparent;
    cursor: pointer;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    -webkit-appearance: none;
    appearance: none;
    transition: opacity 0.15s;
  }
  .btn:active { opacity: 0.7; }
  .btn-primary {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }
  .btn-primary:disabled {
    background: #c9c6bd;
    border-color: #c9c6bd;
    cursor: not-allowed;
    opacity: 0.7;
  }
  .btn-secondary {
    background: var(--surface);
    color: var(--text);
    border-color: var(--border);
  }
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .btn-row .btn { flex: 1; }

  /* === QUIZ === */
  .quiz-header {
    margin-bottom: 12px;
  }
  .progress-bar {
    background: var(--border);
    height: 5px;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .progress-fill {
    background: var(--primary);
    height: 100%;
    width: 0%;
    transition: width 0.3s ease;
  }
  .quiz-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .topic-pill {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .question-text {
    font-size: 17px;
    line-height: 1.45;
    font-weight: 500;
    margin: 12px 0 16px;
  }

  /* === OPTIONS === */
  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .option {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font: inherit;
    color: inherit;
    text-align: left;
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
  }
  .option:active:not(:disabled) {
    background: var(--primary-bg);
  }
  .option:disabled { cursor: default; }
  .option-letter {
    background: var(--surface-2);
    border: 1px solid var(--border);
    width: 26px;
    height: 26px;
    min-width: 26px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    flex-shrink: 0;
    margin-top: 1px;
  }
  .option-text {
    flex: 1;
    font-size: 15px;
    line-height: 1.4;
  }
  .option.correct {
    border-color: var(--success);
    background: var(--success-bg);
  }
  .option.correct .option-letter {
    background: var(--success);
    color: white;
    border-color: var(--success);
  }
  .option.incorrect {
    border-color: var(--danger);
    background: var(--danger-bg);
  }
  .option.incorrect .option-letter {
    background: var(--danger);
    color: white;
    border-color: var(--danger);
  }
  .option.dimmed { opacity: 0.55; }

  /* === EXPLANATION === */
  .explanation {
    margin-top: 14px;
    padding: 12px 14px;
    background: var(--primary-bg);
    border-left: 3px solid var(--primary);
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.5;
    display: none;
  }
  .explanation.show { display: block; }
  .explanation.correct {
    background: var(--success-bg);
    border-left-color: var(--success);
  }
  .explanation.incorrect {
    background: var(--warning-bg);
    border-left-color: var(--warning);
  }
  .explanation-label {
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 4px;
  }
  .explanation.correct .explanation-label { color: var(--success); }
  .explanation.incorrect .explanation-label { color: var(--warning); }

  /* === RESULTS === */
  .score-display {
    text-align: center;
    padding: 16px 0 8px;
  }
  .score-circle {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: var(--primary-bg);
    color: var(--primary-dark);
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .score-circle.excellent { background: var(--success-bg); color: var(--success); }
  .score-circle.good { background: var(--primary-bg); color: var(--primary-dark); }
  .score-circle.average { background: var(--warning-bg); color: var(--warning); }
  .score-circle.poor { background: var(--danger-bg); color: var(--danger); }
  .score-percent {
    font-size: 36px;
    font-weight: 800;
    line-height: 1;
  }
  .score-fraction {
    font-size: 13px;
    margin-top: 4px;
    opacity: 0.85;
  }
  .score-msg {
    font-size: 16px;
    font-weight: 500;
    margin: 0 0 16px;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin: 16px 0;
  }
  .stat {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    text-align: center;
  }
  .stat-value {
    font-size: 22px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
  }
  .stat-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  /* === REVIEW === */
  .review-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--danger);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .review-item.correct { border-left-color: var(--success); }
  .review-meta {
    font-size: 11px;
    color: var(--text-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .review-q {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .review-ans {
    font-size: 13px;
    line-height: 1.5;
  }
  .review-ans .wrong-text {
    color: var(--danger);
    text-decoration: line-through;
    display: block;
    margin-bottom: 4px;
  }
  .review-ans .right-text {
    color: var(--success);
    font-weight: 500;
    display: block;
  }

  .hint {
    font-size: 13px;
    color: var(--text-muted);
    margin: 8px 0 0;
  }

  /* === FOOTER BUTTONS (sticky for quiz) === */
  .quiz-footer {
    position: sticky;
    bottom: 0;
    background: linear-gradient(to bottom, transparent, var(--bg) 30%);
    padding: 16px 0 calc(var(--safe-bottom) + 4px);
    margin-top: 16px;
  }
</style>
</head>
<body>

<!-- ===== START SCREEN ===== -->
<div id="start-screen" class="screen active">
  <h1 class="app-title">Тренажёр ГИА 2026</h1>
  <p class="app-sub">PR, реклама, маркетинг, коммуникации · 120 вопросов</p>

  <h2 class="section-title">Режим тестирования</h2>
  <div class="modes">
    <button class="mode-tile selected" data-mode="all">
      <div class="mode-tile-title">Полный тест (120)</div>
      <div class="mode-tile-desc">Все вопросы по программе ГИА</div>
    </button>
    <button class="mode-tile" data-mode="short">
      <div class="mode-tile-title">Короткий (30)</div>
      <div class="mode-tile-desc">30 случайных вопросов</div>
    </button>
    <button class="mode-tile" data-mode="mini">
      <div class="mode-tile-title">Мини (15)</div>
      <div class="mode-tile-desc">Быстрая самопроверка</div>
    </button>
    <button class="mode-tile" data-mode="topic">
      <div class="mode-tile-title">По темам</div>
      <div class="mode-tile-desc">Выберите интересующие темы</div>
    </button>
  </div>

  <div id="topics-block" style="display:none">
    <h2 class="section-title">Выберите темы</h2>
    <div class="topics" id="topics"></div>
    <button class="btn btn-secondary" id="select-all-topics" style="margin-top:10px; padding:10px; font-size:13px;">Выбрать все</button>
  </div>

  <h2 class="section-title">Настройки</h2>
  <div class="card" style="padding: 4px 16px;">
    <div class="toggle-row">
      <span class="toggle-label">Перемешивать вопросы</span>
      <button class="toggle on" id="t-shuffle-q" aria-label="Перемешивать вопросы"></button>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Перемешивать ответы</span>
      <button class="toggle on" id="t-shuffle-o" aria-label="Перемешивать ответы"></button>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Показывать объяснения</span>
      <button class="toggle on" id="t-explain" aria-label="Показывать объяснения"></button>
    </div>
  </div>

  <button class="btn btn-primary" id="start-btn" style="margin-top:16px;">Начать тест</button>
  <p class="hint" id="count-info"></p>
</div>

<!-- ===== QUIZ SCREEN ===== -->
<div id="quiz-screen" class="screen">
  <div class="quiz-header">
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="quiz-meta">
      <span id="progress-text">Вопрос 1 из 120</span>
      <span class="topic-pill" id="topic-pill">Тема</span>
    </div>
  </div>

  <div class="question-text" id="question-text"></div>
  <div class="options" id="options"></div>

  <div class="explanation" id="explanation">
    <div class="explanation-label" id="explanation-label">Пояснение</div>
    <div id="explanation-text"></div>
  </div>

  <div class="quiz-footer">
    <button class="btn btn-primary" id="next-btn" disabled>Далее →</button>
    <div class="btn-row">
      <button class="btn btn-secondary" id="exit-btn" style="font-size:14px; padding:10px;">Завершить</button>
    </div>
  </div>
</div>

<!-- ===== RESULTS SCREEN ===== -->
<div id="results-screen" class="screen">
  <div class="score-display">
    <div class="score-circle" id="score-circle">
      <div class="score-percent" id="score-percent">0%</div>
      <div class="score-fraction" id="score-fraction">0 / 0</div>
    </div>
    <div class="score-msg" id="score-msg"></div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="stat-correct" style="color: var(--success);">0</div>
      <div class="stat-label">Верных</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="stat-wrong" style="color: var(--danger);">0</div>
      <div class="stat-label">Неверных</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="stat-total">0</div>
      <div class="stat-label">Всего</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="stat-time">0:00</div>
      <div class="stat-label">Время</div>
    </div>
  </div>

  <button class="btn btn-primary" id="retry-btn">Пройти ещё раз</button>
  <div class="btn-row">
    <button class="btn btn-secondary" id="home-btn">Настройки</button>
    <button class="btn btn-secondary" id="review-btn">Разбор</button>
  </div>

  <div id="review-section" style="display:none; margin-top:20px;">
    <h2 class="section-title" id="wrong-title" style="color: var(--danger);">Ошибки</h2>
    <div id="wrong-list"></div>
    <h2 class="section-title" id="correct-title" style="color: var(--success);">Правильные</h2>
    <div id="correct-list"></div>
  </div>
</div>

<script>

// ===== СОСТОЯНИЕ =====
const state = {
  mode: 'all',
  selectedTopics: new Set(),
  shuffleQ: true,
  shuffleO: true,
  showExpl: true,
  pool: [],
  idx: 0,
  answers: [],
  startTime: null
};

function $(id) { return document.getElementById(id); }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0, 0);
}

// ===== ИНИЦИАЛИЗАЦИЯ ТЕМ =====
function initTopics() {
  const counts = {};
  QUESTIONS.forEach(q => counts[q.topic] = (counts[q.topic] || 0) + 1);
  const wrap = $('topics');
  wrap.innerHTML = '';
  Object.keys(counts).sort().forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.dataset.topic = t;
    btn.innerHTML = `${t}<span class="chip-count">${counts[t]}</span>`;
    btn.onclick = () => {
      if (state.selectedTopics.has(t)) {
        state.selectedTopics.delete(t);
        btn.classList.remove('selected');
      } else {
        state.selectedTopics.add(t);
        btn.classList.add('selected');
      }
      updateCount();
    };
    wrap.appendChild(btn);
  });
}

function updateCount() {
  let c = 0;
  if (state.mode === 'all') c = QUESTIONS.length;
  else if (state.mode === 'short') c = Math.min(30, QUESTIONS.length);
  else if (state.mode === 'mini') c = Math.min(15, QUESTIONS.length);
  else if (state.mode === 'topic')
    c = QUESTIONS.filter(q => state.selectedTopics.has(q.topic)).length;
  $('count-info').textContent = c > 0 ? `Будет ${c} вопрос${c === 1 ? '' : (c < 5 ? 'а' : 'ов')}` : 'Выберите хотя бы одну тему';
  $('start-btn').disabled = c === 0;
}

// ===== ВЫБОР РЕЖИМА =====
document.querySelectorAll('.mode-tile').forEach(tile => {
  tile.onclick = () => {
    document.querySelectorAll('.mode-tile').forEach(t => t.classList.remove('selected'));
    tile.classList.add('selected');
    state.mode = tile.dataset.mode;
    $('topics-block').style.display = state.mode === 'topic' ? 'block' : 'none';
    updateCount();
  };
});

$('select-all-topics').onclick = () => {
  const all = QUESTIONS.reduce((acc, q) => (acc[q.topic] = 1, acc), {});
  const allSelected = state.selectedTopics.size === Object.keys(all).length;
  document.querySelectorAll('.chip').forEach(c => {
    if (allSelected) {
      state.selectedTopics.delete(c.dataset.topic);
      c.classList.remove('selected');
    } else {
      state.selectedTopics.add(c.dataset.topic);
      c.classList.add('selected');
    }
  });
  $('select-all-topics').textContent = allSelected ? 'Выбрать все' : 'Снять все';
  updateCount();
};

// ===== ТОГГЛЫ =====
function bindToggle(id, key) {
  $(id).onclick = () => {
    state[key] = !state[key];
    $(id).classList.toggle('on', state[key]);
  };
}
bindToggle('t-shuffle-q', 'shuffleQ');
bindToggle('t-shuffle-o', 'shuffleO');
bindToggle('t-explain', 'showExpl');

// ===== СТАРТ =====
$('start-btn').onclick = () => {
  let pool = QUESTIONS.slice();
  if (state.mode === 'topic') pool = pool.filter(q => state.selectedTopics.has(q.topic));
  if (state.shuffleQ) pool = shuffle(pool);
  if (state.mode === 'short') pool = pool.slice(0, 30);
  if (state.mode === 'mini') pool = pool.slice(0, 15);

  state.pool = pool.map(q => {
    // Собираем варианты: correct + distractors
    const allOpts = [q.correct, ...q.distractors];
    const order = allOpts.map((_, i) => i);
    const shuf = state.shuffleO ? shuffle(order) : order;
    return {
      ...q,
      displayOpts: shuf.map(i => allOpts[i]),
      correctIdx: shuf.indexOf(0) // 0 — индекс correct в allOpts
    };
  });

  state.idx = 0;
  state.answers = [];
  state.startTime = Date.now();
  showQuestion();
  showScreen('quiz-screen');
};

// ===== ПОКАЗ ВОПРОСА =====
function showQuestion() {
  const q = state.pool[state.idx];
  const total = state.pool.length;
  $('progress-fill').style.width = (state.idx / total * 100) + '%';
  $('progress-text').textContent = `Вопрос ${state.idx + 1} из ${total}`;
  $('topic-pill').textContent = q.topic;
  $('question-text').textContent = q.q;

  const wrap = $('options');
  wrap.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D', 'E'];
  q.displayOpts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `
      <span class="option-letter">${letters[i]}</span>
      <span class="option-text"></span>
    `;
    btn.querySelector('.option-text').textContent = opt;
    btn.onclick = () => selectAnswer(i);
    wrap.appendChild(btn);
  });

  $('explanation').classList.remove('show', 'correct', 'incorrect');
  $('next-btn').disabled = true;
  $('next-btn').textContent = state.idx === total - 1 ? 'Завершить →' : 'Далее →';
}

// ===== ВЫБОР ОТВЕТА =====
function selectAnswer(chosenIdx) {
  const q = state.pool[state.idx];
  const isCorrect = chosenIdx === q.correctIdx;
  state.answers.push({ poolIdx: state.idx, chosenIdx, isCorrect });

  const optEls = document.querySelectorAll('.option');
  optEls.forEach((el, i) => {
    el.disabled = true;
    if (i === q.correctIdx) el.classList.add('correct');
    else if (i === chosenIdx) el.classList.add('incorrect');
    else el.classList.add('dimmed');
  });

  if (state.showExpl) {
    const expl = $('explanation');
    expl.classList.add('show');
    expl.classList.add(isCorrect ? 'correct' : 'incorrect');
    $('explanation-label').textContent = isCorrect ? '✓ Верно' : '✗ Не совсем';
    $('explanation-text').textContent = isCorrect
      ? 'Это правильный ответ.'
      : `Правильный ответ: ${q.correct}`;
  }

  $('next-btn').disabled = false;
  // Прокрутка к кнопке "Далее" на мобильных
  setTimeout(() => $('next-btn').scrollIntoView({ behavior: 'smooth', block: 'end' }), 100);
}

// ===== НАВИГАЦИЯ =====
$('next-btn').onclick = () => {
  if (state.idx < state.pool.length - 1) {
    state.idx++;
    showQuestion();
  } else {
    showResults();
  }
};

$('exit-btn').onclick = () => {
  if (state.answers.length === 0 || confirm('Завершить тест досрочно?')) {
    showResults();
  }
};

// ===== РЕЗУЛЬТАТЫ =====
function showResults() {
  const correct = state.answers.filter(a => a.isCorrect).length;
  const total = state.answers.length;
  const pct = total === 0 ? 0 : Math.round(correct / total * 100);
  const sec = Math.round((Date.now() - state.startTime) / 1000);
  const mm = Math.floor(sec / 60);
  const ss = String(sec % 60).padStart(2, '0');

  $('score-percent').textContent = pct + '%';
  $('score-fraction').textContent = `${correct} / ${total}`;
  $('stat-correct').textContent = correct;
  $('stat-wrong').textContent = total - correct;
  $('stat-total').textContent = total;
  $('stat-time').textContent = `${mm}:${ss}`;

  const circle = $('score-circle');
  circle.className = 'score-circle';
  let msg;
  if (pct >= 90) { circle.classList.add('excellent'); msg = 'Отлично! Готовы к ГИА 🎓'; }
  else if (pct >= 75) { circle.classList.add('good'); msg = 'Хорошо! Закрепите слабые темы'; }
  else if (pct >= 60) { circle.classList.add('average'); msg = 'Неплохо, есть над чем поработать'; }
  else { circle.classList.add('poor'); msg = 'Нужно повторить материал'; }
  $('score-msg').textContent = msg;

  $('review-section').style.display = 'none';
  $('review-btn').textContent = 'Разбор';
  buildReview();
  showScreen('results-screen');
}

function buildReview() {
  const wrong = $('wrong-list');
  const corr = $('correct-list');
  wrong.innerHTML = '';
  corr.innerHTML = '';
  let wc = 0, cc = 0;

  state.answers.forEach(ans => {
    const q = state.pool[ans.poolIdx];
    const chosen = q.displayOpts[ans.chosenIdx];
    const div = document.createElement('div');
    div.className = 'review-item' + (ans.isCorrect ? ' correct' : '');

    let ansHtml;
    if (ans.isCorrect) {
      ansHtml = `<div class="review-ans"><span class="right-text">✓ ${escapeHtml(q.correct)}</span></div>`;
    } else {
      ansHtml = `<div class="review-ans">
        <span class="wrong-text">✗ Ваш: ${escapeHtml(chosen)}</span>
        <span class="right-text">✓ Верно: ${escapeHtml(q.correct)}</span>
      </div>`;
    }

    div.innerHTML = `
      <div class="review-meta">№${q.num} · ${escapeHtml(q.topic)}</div>
      <div class="review-q">${escapeHtml(q.q)}</div>
      ${ansHtml}
    `;

    if (ans.isCorrect) { corr.appendChild(div); cc++; }
    else { wrong.appendChild(div); wc++; }
  });

  $('wrong-title').textContent = wc > 0 ? `Ошибки (${wc})` : '';
  $('wrong-title').style.display = wc > 0 ? '' : 'none';
  $('correct-title').textContent = cc > 0 ? `Правильные (${cc})` : '';
  $('correct-title').style.display = cc > 0 ? '' : 'none';
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

$('review-btn').onclick = () => {
  const rs = $('review-section');
  const isHidden = rs.style.display === 'none';
  rs.style.display = isHidden ? 'block' : 'none';
  $('review-btn').textContent = isHidden ? 'Скрыть' : 'Разбор';
  if (isHidden) {
    setTimeout(() => rs.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
  }
};

$('retry-btn').onclick = () => $('start-btn').click();
$('home-btn').onclick = () => showScreen('start-screen');

// ===== ИНИЦИАЛИЗАЦИЯ =====
initTopics();
updateCount();
</script>
</body>
