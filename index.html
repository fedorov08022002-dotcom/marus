 Кампании, направленные на «возврат» пользователей, которые ранее уже\nпосещали сайт компании или совершали определенные действия, но не завершили\nпокупку.\n\n9. Партнерский маркетинг (Affiliate Marketing)\n• Привлечение сторонних партнеров для продажи продукта за комиссионное\nвознаграждение от каждой совершенной сделки (модель CPA — Cost Per Action).\n\n10. Омниканальные кампании\n\n* Интегрированные стратегии, которые связывают несколько каналов (например,\nсоцсети + email + сайт) в единый путь клиента для обеспечения бесшовного\nвзаимодействия с брендом.","hint":"Маркетинговая кампания в цифровой среде - это комплекс скоординированных действий бренда, направленных на продвижение продукта или услуги через цифровые каналы (интернет, мобильные устройства) для достижения измеримых целей (KPI) в установленный период времени.","category":"Маркетинг"},{"num":59,"title":"Что такое ключевое сообщение рекламной кампании?","answer":"Ключевое сообщение – это система основных информационных элементов\n(«конструктор»), из которых в зависимости от ситуации, канала коммуникации и\nцелевой аудитории создаются конкретные рекламные обращения. Оно отвечает на\nвопрос, «что?» бренд хочет сказать своей аудитории, как он решает выявленную\nпроблему (инсайт) и какую ценность предлагает.\n\nОсновные характеристики ключевого сообщения\n\n1. Вариативность – в разных рекламных материалах (баннеры, видеоролики,\nпосты в соцсетях) используются разные детали из общего «конструктора», но\nвсе они остаются в рамках единой стратегии.\n2. Адаптивность – сообщение может корректироваться в ходе кампании при\nизменении целей, поведения конкурентов или внешних факторов.\n3. Нацеленность на аудиторию – сообщение создаётся с учётом потребностей,\nинтересов и «болей» конкретного сегмента потребителей, а также их\nстереотипов и ценностей.\n\nЭтапы формирования ключевого сообщения\n\n1. Исходное состояние – преодоление информационного шума или безразличия\nаудитории.\n2. Выделение доминанты – определение ключевого момента (уникального\nпреимущества, выгоды), который отличает бренд от конкурентов и резонирует с\nценностями целевой аудитории.\n3. Упрощение и фокусировка – акцентирование одних элементов и\nпреуменьшение других, устранение сложных связей, замена их простой и\nзапоминающейся идеей.\n4. Драматизация и создание интриги – придание сообщению эмоциональной\nокраски, чтобы оно привлекало внимание и побуждало к действию.\n\nПринципы построения эффективного ключевого сообщения\n\n● Доскональное изучение сути проблемной ситуации и позиции организации.\n● Знание потребностей, интересов и забот целевой группы (умение поставить\nсебя на место адресата).\n● Постоянное повторение в простой и доходчивой форме.\n– Выбор оптимальных каналов, времени и места распространения.\n– Конкретность и нацеленность на конкретную аудиторию.\n– Новостной характер (сообщение должно быть интересным само по себе).\n– Понятность без излишних усложнений, специальной лексики и сокращений.\n– Призыв к немедленному действию.\n– Взаимная польза для организации и общественности.\n\nВиды коммуникационных сообщений\n\nВ зависимости от способа воздействия выделяют три типа сообщений, которые вместе\nформируют центральное ключевое сообщение:\n\n1. Рациональное сообщение – рассказывает об осязаемых отличительных\nособенностях продукта, подкреплённых весомыми фактами и доводами\n2. Эмоциональное сообщение – транслирует ключевые ценности бренда, его\nхарактер (личность).\n3. Эмпирическое сообщение – передаёт потребительский опыт, демонстрирует\nосязаемый мир бренда (запах, вкус, текстура, звук, ощущения)..\n\nЭти три типа сообщений работают в комплексе, поддерживая рациональные и\nэмоциональные выгоды бренда и формируя единый, целостный образ в сознании\nпотребителя.\n\nИсточник:\n\nklientami","hint":"Ключевое сообщение – это система основных информационных элементов («конструктор»), из которых в зависимости от ситуации, канала коммуникации и целевой аудитории создаются конкретные рекламные обращения.","category":"Реклама"},{"num":60,"title":"Что является основной целью стимулирующей рекламы?","answer":"Стимулирующая реклама - это реклама, цель которой заключается в активизации\nспроса и побуждении потребителя к покупке товара или услуги. В отличие от\nимиджевой рекламы, она ориентирована не столько на долгосрочное формирование\nобраза бренда, сколько на получение конкретной реакции аудитории: купить, заказать,\nпопробовать, перейти, оставить заявку.\n\nВзяла из пособия Ю. К. Баженова и Л. П. Дашкова «Основы рекламы», 2024 г\n\nпростым языком - побудить потребителя к покупке или другому целевому действию в\nближайшее время, то есть стимулировать спрос и сбыт товара или услуги.\n\nПримеры стимулирующей рекламы: скидка на ограниченный срок «Только до 15 мая\nскидка 30% на всю коллекцию», акция «2 по цене 1», промокод, подарок за покупку и\nтд.","hint":"Стимулирующая реклама - это реклама, цель которой заключается в активизации спроса и побуждении потребителя к покупке товара или услуги.","category":"Реклама"},{"num":61,"title":"Федеральный закон 38-ФЗ «О рекламе» определяет понятие «реклама» как:","answer":"В целях настоящего Федерального закона используются следующие основные\nпонятия:\n1) реклама - информация, распространенная любым способом, в любой форме и с\nиспользованием любых средств, адресованная неопределенному кругу лиц и\nнаправленная на привлечение внимания к объекту рекламирования, формирование\nили поддержание интереса к нему и его продвижение на рынке;\n\nИсточник: Консультант.\nФедеральный закон от 13.03.2006 N 38-ФЗ (ред. от 27.10.2025) \"О рекламе\"\nСтатья 3. Основные понятия, используемые в настоящем Федеральном законе","hint":"В целях настоящего Федерального закона используются следующие основные понятия: 1) реклама - информация, распространенная любым способом, в любой форме и с использованием любых средств, адресованная неопределенному кругу лиц и направленная на привлечение внимания к объекту рекламирования, формирование или поддержание интереса к нему и его продвижение на рынке; Источник: Консультант.","category":"Реклама"},{"num":62,"title":"Правовые основы рекламной деятельности.","answer":"1. Правовые основы в рекламной деятельности.\n\nПравовые основы рекламной деятельности в Российской Федерации, это совокупность\nконституционных, гражданских, антимонопольных, административных и специальных\nрекламных норм, регулирующих производство, размещение и распространение\nрекламы. Конституционный уровень выражается в свободе слова и свободе\nпредпринимательской деятельности, но одновременно и в запрете недобросовестной\nконкуренции, а также в обязанности государства защищать права граждан.\nСпециальным ядром системы является Федеральный закон от 13 марта 2006 года №\n38-ФЗ «О рекламе».\n\nВ соответствии со статьей 3 этого закона реклама - это информация, адресованная\nнеопределенному кругу лиц и направленная на привлечение внимания к объекту\nрекламирования, поддержание интереса к нему и его продвижение на рынке. Но закон\nраспространяется не на всякую информацию. Из его сферы выведены политическая\nреклама, обязательные по закону сведения о товаре, справочно аналитические\nматериалы без цели продвижения, обычные вывески и указатели, частные объявления\nвне предпринимательской деятельности и органично встроенные в произведения\nупоминания товара, если они сами по себе не являются рекламой.\n\nСистема источников рекламного права включает не только Закон о рекламе, но и\nЗакон о защите конкуренции, Закон о защите прав потребителей, Гражданский кодекс\nи Кодекс об административных правонарушениях. Исторически эта система\nформировалась последовательно, сначала через антимонопольное регулирование\n1991 года, затем через защиту потребителя 1992 года, затем через первый Закон о\nрекламе 1995 года и, наконец, через действующий Закон 2006 года, который отменил\nпрежний закон.\n\nСодержательно закон устанавливает общие и специальные требования к рекламе.\nОбщий принцип состоит в том, что реклама должна быть добросовестной и\nдостоверной. Не допускаются некорректные сравнения с конкурентами, введение\nпотребителя в заблуждение, искажение цены, скидок, гарантий и иных существенных\nобстоятельств, скрытая реклама, а также реклама с призывами к противоправным\nдействиям, с дискриминационными образами и с отсутствием юридически значимой\nинформации. Судебная практика исходит из позиции обычного потребителя, поэтому\nмелкий нечитаемый текст не спасает рекламодателя, а, наоборот, может означать\nотсутствие существенной информации.\n\nПо субъектному составу закон выделяет рекламодателя, рекламопроизводителя,\nрекламораспространителя, потребителя рекламы и спонсора, а в цифровой среде\nтакже рекламные системы и их операторов. Государственный контроль осуществляет\nантимонопольный орган, который возбуждает и рассматривает дела, выдает\nпредписания и обращается в суд. Наряду с этим закон допускает саморегулирование,\nсаморегулируемые организации в сфере рекламы разрабатывают правила\nпрофессиональной этики, контролируют своих членов и участвуют в рассмотрении дел\nо нарушениях. Ответственность в рекламном праве прежде всего гражданско правовая\nи административная. Потерпевшие могут требовать убытки, вред и контррекламу, а\nадминистративные штрафы налагаются по статье 14.3 КоАП РФ.\n\nСовременный этап развития рекламного права связан прежде всего с интернет\nрекламой. Действующая редакция статьи 18.1 Закона о рекламе строится на принципе\n\nпрослеживаемости, передаче данных о рекламе в уполномоченный орган, присвоении\nидентификатора и учете рекламы в Едином реестре интернет рекламы. Поэтому\nсегодня правовые основы рекламной деятельности включают уже не только\nтребования к содержанию рекламного сообщения, но и цифровую маркировку, учет,\nидентификацию и специальные обязанности всех участников интернет рекламного\nрынка. Именно в этом сейчас состоит самая актуальная часть темы.\n\nКратко требования к рекламе:\n\nЭтичность: Реклама не должна содержать оскорбительных образов, сравнений или\nвыражений в отношении расы, национальности, профессии, социальной категории,\nвозраста, пола, языка, религиозных, философских, политических убеждений.\n\nОтсутствие скрытой рекламы: Не допускается реклама, которая воздействует на\nподсознание потребителей или которая не может быть сразу распознана как реклама.\n\nУважение прав интеллектуальной собственности: Использование чужих товарных\nзнаков, фирменных наименований, изображений возможно только с согласия\nправообладателя.\n\nСоответствие принципам конкуренции: Реклама не должна порочить конкурентов или\nих товары.\n\nЗакон о рекламе выделяет несколько видов рекламы, которые признаются\nненадлежащими и запрещены:\n\nНедобросовестная реклама:\n\nНекорректные сравнения: Реклама некорректно сравнивает рекламируемый товар с\nтоваром конкурентов.\n\nПорочащая информация: Реклама содержит ложные, неточные или искаженные\nсведения, порочащие честь, достоинство или деловую репутацию конкурента.\n\nИспользование чужих результатов: Реклама использует результаты интеллектуальной\nдеятельности, средства индивидуализации или товары, работы, услуги конкурента без\nразрешения.\n\nНедостоверная реклама\n\nЛожные сведения: Реклама содержит не соответствующие действительности сведения\nо товаре (характеристики, состав, происхождение, наличие сертификатов), о его\nстоимости, условиях приобретения, скидках, сроках действия акций.\n\nДля более углубленного изучения вопроса можно почитать ФЗ «о рекламе», здесь я\nвыписала самое основное и понятным языком. Информация взята с консультанта.","hint":"Правовые основы рекламной деятельности в Российской Федерации, это совокупность конституционных, гражданских, антимонопольных, административных и специальных рекламных норм, регулирующих производство, размещение и распространение рекламы.","category":"Реклама"},{"num":63,"title":"Является ли обязательным для рекламораспространителя заключение договора на распространение социальной рекламы?","answer":"Социальная реклама - информация, распространенная любым способом, в любой\nформе и с использованием любых средств, адресованная неопределенному кругу лиц\nи направленная на достижение благотворительных и иных общественно полезных\n\nцелей, а также обеспечение интересов государства. Частью 3 статьи 10 ФЗ от\n13.03.2006 № 38-ФЗ установлено, что заключение договора на распространение\nсоциальной рекламы является обязательным для рекламораспространителя и\nсоставляет 5 % годового объема распространяемой им рекламы. Речь и о рекламных\nплощадях печатных СМИ, и о количестве рекламных площадей различных рекламных\nконструкций, и об общих объёмах рекламного времени в телевизионном и\nрадиоэфире.\nИсточники:\n\n5c1842f907350/","hint":"Социальная реклама - информация, распространенная любым способом, в любой форме и с использованием любых средств, адресованная неопределенному кругу лиц и направленная на достижение благотворительных и иных общественно полезных целей, а также обеспечение интересов государства.","category":"Реклама"},{"num":64,"title":"Как реализуется принцип законности правового регулирования рекламы в Российской Федерации?","answer":"Принцип законности правового регулирования рекламы реализуется через\nобязательное соответствие рекламы требованиям законодательства РФ (основу\nправового регулирования составляет Федеральный закон от 13 марта 2006 года\n№38-ФЗ «О рекламе», который определяет понятие рекламы, её цели, общие и\nспецифические требования к содержанию, а также ограничения и запреты): реклама\nдолжна быть добросовестной, достоверной, не нарушать установленные законом\nзапреты и ограничения. Соблюдение этих требований контролируется\nантимонопольным органом, а за нарушения предусмотрена юридическая\nответственность.\nПомимо этого важно установление специальных требований к категориям товаров,\nгосударственный контроль ФАС, маркировку рекламы.\n\nИсточники: КонсультантПлюс — Федеральный закон №38-ФЗ «О рекламе», глава 1.\nСтатья 4. Статья 4. Законодательство Российской Федерации о рекламе\n\n5f4d50b0627/\nСтатья 5. Общие требования к рекламе.\n\n7e185e1156/\nГлава 2.\nСтатья 33. Полномочия антимонопольного органа\n\n06d4143b97/\nСтатья 38. Ответственность за нарушение законодательства Российской Федерации о\nрекламе\n\n352cc84990/","hint":"Принцип законности правового регулирования рекламы реализуется через обязательное соответствие рекламы требованиям законодательства РФ (основу правового регулирования составляет Федеральный закон от 13 марта 2006 года №38-ФЗ «О рекламе», который определяет понятие рекламы, её цели, общие и специфические требования к содержанию, а также ограничения и запреты): реклама должна...","category":"Реклама"},{"num":65,"title":"Что такое репутация?","answer":"РЕПУТАЦИЯ\n— общее мнение о достоинствах и недостатках субъекта; совокупность мнений\nзаинтересованных сторон (сотрудников, инвесторов, кредиторов, аналитиков, властей,\nСМИ и т.д.) о достоинствах и недостатках компании, влияющих на принятие решений,\nкасающихся субъекта.\n\nБудучи составляющей имиджа, Р. отличается от него тем, что складывается из\nреальных действий и фактов. Задача поддержания хорошей репутации в маркетинге\nсхожа с той, которая решается в рамках создания имиджа: помогать выведению на\n\nрынок новых товаров и услуг, защищать организацию от действий конкурентов,\nпривлекать надежных партнеров. Понятие «Р.» вплоть до середины ХХ в.\nвоспринималось как синоним понятий «честь», «достоинство» и применялось для\nхарактеристики отдельного человека. Сейчас Р. все чаще воспринимается как синоним\nкатегории «социальная ответственность».\n\nРепутация может быть разной: положительной, отрицательной или нейтральной.\n\nМеханизмы, которые формируют имидж и Р. компании на рынке, одинаковы. К ним\nотносятся:\n● отношение к клиентам,\n● политика компании (в том числе миссия и стратегия, этические нормы, правила\nигры),\n● позиционирование компании на рынке,\n● психологический климат,\n● степень профессионализма и опыта сотрудников,\n● практика работы (бизнес-опыт),\n● финансовая стабильность,\n● динамика развития компании (инновационная и маркетинговая активность,\nэффективность системы управления),\n● участие в общественно значимых акциях (благотворительность, спонсорство),\n● интеллектуальный и научный потенциал организации,\n● деловые качества руководителя,\n● доступность информации о компании.\n\nР. рассматривается в качестве основного конкурентного преимущества. На ее\nформирование и управление ею влияют несколько блоков факторов:\n● качество продукта,\n● поведение обслуживающего персонала,\n● уровень обслуживания клиентов;\n● миссия компании (социально значимая идея, положенная в основу\nдеятельности);\n● оценка компании в средствах массовой информации,\n● отношение к ней лидеров общественного мнения и государственных структур.\n\nВ управлении Р. фирмы важны три направления, причем грамотно\nскоординированные: формирование Р. (перемены в бизнес-практике, механизме\nпринятия решений и т.д.); поддержание Р. (создание такой ситуации, при которой на\nкомпанию работает весь комплекс позитивной информации, в т.ч. успех бренда,\nкорпоративная культура, степень мотивации сотрудников, объемы финансовых\nоборотов, расширение рыночной ниши, ослабление позиций конкурентов и т.п.);\nзащита Р. (создание адекватной правовой инфраструктуры и снижение издержек\nбизнеса).\n\nМаркетинг: большой толковый словарь. — М.: Омега-Л. Под ред. А. П. Панкрухина.\n2010.","hint":"РЕПУТАЦИЯ — общее мнение о достоинствах и недостатках субъекта; совокупность мнений заинтересованных сторон (сотрудников, инвесторов, кредиторов, аналитиков, властей, СМИ и т.д.) о достоинствах и недостатках компании, влияющих на принятие решений, касающихся субъекта.","category":"Бренд и репутация"},{"num":66,"title":"Основные стратегии репутационного менеджмента.","answer":"Репутационный менеджмент — это управление процессом формирования и\nкорректировки репутационных и имиджевых характеристик компании, а также\nдоведение их до целевой аудитории. Существует несколько подходов и стратегий в\n\nэтой сфере, которые различаются по целям, методам реализации и фокусу\nкоммуникаций.\n\nСтратегии репутационного менеджмента:\n\n● По объекту репутации. Стратегия может фокусироваться на компании в\nцелом, её продукции или услугах, достижениях, команде сотрудников,\nфинансовых показателях, конкретных событиях или территориях. Например,\nпри стратегии, где акцент делается на продукции, продвижение строится вокруг\nтого, что компания предлагает рынку.\n● По временному фокусу. Выделяют краткосрочные (решение конкретных\nзадач, например, реакция на жалобу клиента), долгосрочные (постепенное\nукрепление положительного образа, повышение лояльности), антикризисные\n(действия при угрозе репутации, например, публичные извинения) и\nпрофилактические стратегии (создание запаса доверия).\n● По принципу действия. Проактивные стратегии направлены на создание\nположительного имиджа до возникновения негативных событий через\nрегулярное взаимодействие с аудиторией, формирование доверия и\nиспользование современных инструментов (автоматизированные системы\nмониторинга, работа с лидерами мнений). Реактивные стратегии связаны с\nоперативным реагированием на негатив, разработкой планов на случай\nкризисных ситуаций.\n● По стратегии управления репутационными рисками. Выделяют три\nбазовые стратегии:\nУклонение — сознательный отказ от потенциально рискованных\nситуаций, проектов или партнёрств. Компания анализирует каждое\nрешение с точки зрения возможных репутационных последствий.\nСнижение — фокусируется на минимизации возможного ущерба через\nактивное управление факторами риска: контроль качества продукции,\nобучение сотрудников, повышение уровня клиентского сервиса.\nАнализ — систематическая работа по оценке прошлых инцидентов и\nпрогнозированию будущих угроз. Компании создают\nспециализированные подразделения или привлекают внешних\nконсультантов для мониторинга информационного поля.\n\nИсточник: Тендит, К.Н.\nОсновы репутационного менеджмента : учеб. пособие / К.Н. Тендит. –\nКомсомольск-на-Амуре : ФГБОУ ВПО «КнАГТУ», 2013.\n\nПростое объяснение термина «репутационный менеджмент» (на примере кейса):\n\nРепутационный менеджмент — это искусство управлять мнением людей о вашей\nкомпании, чтобы завоевать их доверие и уважение.\n\nПредставьте себе ситуацию, когда вы хотите купить новый телефон. Вы наверняка\nначнете искать отзывы, читать обзоры и спрашивать мнение друзей. То, что вы\nузнаете, повлияет на ваше решение: покупать или нет. Вот эта совокупность мнений,\nвпечатлений и отзывов о бренде телефона и называется репутацией.\n\nТеперь представьте себя на месте производителя телефонов. Ваша задача — сделать\nтак, чтобы покупатели думали о вашем продукте хорошо, доверяли вам и\nрекомендовали другим. Для этого вы будете стараться выпускать качественные\nтовары, оперативно решать проблемы клиентов, рассказывать о преимуществах\n\nвашего бренда и поддерживать положительный образ в глазах общественности.\nИменно этим и занимается репутационный менеджмент: управляет тем, как компания\nвыглядит в глазах окружающих, формирует положительное впечатление и исправляет\nнегативные моменты.\nОбзор научной литературы также позволил выделить основные методы управления\nрепутацией, среди которых:\n1 Мониторинг и аналитика. Современные инструменты (Brand Analytics, SCAN\nInterfax, Medialogia) позволяют отслеживать, как компания представлена в медиа. Это\nбаза для оценки текущей ситуации и прогноза репутационных рисков.\n2 Крауд-маркетинг. Работа с реальными комментариями пользователей, отзывами на\nфорумах и площадках вроде Яндекс.Маркета — способ «приблизить» бренд к\nаудитории. Такие мнения часто оказываются более убедительными, чем официальные\nсообщения.\n3 Контент-менеджмент. Официальные сайты, блоги, соцсети — это площадки, где\nкомпания может сама формировать позитивный образ. Главное — актуальность,\nчестность и понятный язык.\n4 Работа с негативом. Нельзя просто удалять плохие комментарии. Нужно отвечать,\nпо существу, вовремя, с уважением к автору. Это формирует доверие.\n5 Опросы и исследования. Глубинные интервью и онлайн-опросы помогают понять,\nчего ждёт аудитория. Это позволяет корректировать стратегию до появления проблем.\n\nСпециализированные подходы к репутационному менеджменту:\n1. ORM (Online Reputation Management).Управление онлайн-репутацией, которое\nвключает замещение негативного контента позитивным на всех доступных\nплощадках.\n\n2. SERM (Search Engine Reputation Management).Управление репутацией в\nпоисковых системах, направленное на\nпродвижение положительных упоминаний и вытеснение негативных\nрезультатов из топа выдачи.\n\n3.SMM (Social Media Reputation Management).Работа с репутацией в\nсоциальных сетях, включая мониторинг упоминаний, анализ настроений\nаудитории и оперативное реагирование на негатив.\n\n4. SEO (Search Engine Optimization). Оптимизация контента для поисковых\nсистем с целью повышения видимости положительных материалов и снижения\nвлияния негативных отзывов.\n\n\nИсточники: Петренко Е.В. Репутация как стратегический ресурс компании // Вестник\nМГУ. Серия 6. Экономика. — 2019. — №2. — С. 34-45;\n\niey","hint":"Репутационный менеджмент — это управление процессом формирования и корректировки репутационных и имиджевых характеристик компании, а также доведение их до целевой аудитории.","category":"Бренд и репутация"},{"num":67,"title":"Имидж присущ…","answer":"Любому публичному объекту (человеку, компании, товару, городу, государству),\nнезависимо от того, занимается ли он целенаправленным формированием имиджа или\nнет.","hint":"Любому публичному объекту (человеку, компании, товару, городу, государству), независимо от того, занимается ли он целенаправленным формированием имиджа или нет.","category":"Бренд и репутация"},{"num":68,"title":"Какое понятие описывает образ организации, формируемый в сознании общественности?","answer":"Имидж/ имидж организации\n– целенаправленно формируемый образ организации, личности, товара или услуги,\nпризванный оказать определённое эмоционально-психологическое воздействие на\nобщественность в целях популяризации и продвижения (Синяева И. М.\nПаблик-рилейшенз: толковый словарь. 5-е изд. М.: Дашков и К, 2023).\n\n– заявленная (идеальная) позиция – то есть такая, которую субъект (организация,\nперсона) спланировал и собирается продвигать («раскручивать») в целевые группы\nобщественности. Этому понятию автор противопоставляет репутацию как воспринятую\nпозицию – то, что реально «осело» в сознании аудитории по итогам\nкоммуникационных усилий и накопленного опыта взаимодействия (Чумиков А. Н.\nРеклама и связи с общественностью. Имидж, репутация, бренд. 2-е изд. М.:\nАспект Пресс, 2016).\n\n– специально проектируемый, искусственно создаваемый образ, формируемый в\nмассовом сознании средствами массовой коммуникации и психологического\nвоздействия. Автор подчёркивает, что имидж включает не только реальные\nхарактеристики объекта, но и приписываемые ему свойства, имея преимущественно\nэмоционально-психологическую природу (Шарков Ф. И. Интегрированные\nкоммуникации: реклама, паблик рилейшнз, брендинг: учебное пособие. М.:\nДашков и К, 2020).\n\n– сложившийся в массовом сознании и имеющий характер стереотипа эмоционально\nокрашенный образ кого-либо или чего-либо (Коноваленко М. Ю. Реклама и связи с\nобщественностью. Введение в профессию: учебник для вузов. 2-е изд., перераб.\nи доп. М.: Юрайт, 2025).\n\n– образ организации, существующий в сознании людей (Чилингир Е. Ю. Реклама и\nсвязи с общественностью: учебное пособие для СПО. Саратов; М.:\nПрофобразование; IPR Медиа, 2020).\n\n– набор представлений, идей и впечатлений, складывающихся у человека о том или\nином объекте, от которого в значительной мере зависит отношение этого человека к\nданному объекту и его поведение (Котлер Ф., Келлер К., Чернев А. Маркетинг\nменеджмент. 16-е изд. СПб.: Питер, 2024).\n\n– искусственно создаваемый образ субъекта или объекта, формируемый в массовом\nсознании посредством инструментов рекламы и связей с общественностью (Шевченко\nД. А., Крюкова Е. М., Зеленов В. В., Галстян В. В. Введение в рекламу и связи с\nобщественностью: учебник / под ред. Д. А. Шевченко. М.: Директ-Медиа, 2025).","hint":"Имидж/ имидж организации – целенаправленно формируемый образ организации, личности, товара или услуги, призванный оказать определённое эмоционально-психологическое воздействие на общественность в целях популяризации и продвижения (Синяева И.","category":"Общественное мнение"},{"num":69,"title":"Что стоит делать с негативными отзывами?","answer":"Когда компания имеет дело с обоснованной критикой от реальных клиентов, то\nглавной задачей становится не допустить эскалации конфликта и найти\nконструктивное решение проблемы. Для этого необходимо следовать\nопределенным принципам:\n\n● Оперативность реагирования. Чем дольше компания игнорирует негативный\nотзыв, тем больше он распространяется и тем сложнее будет его локализовать.\n\nИдеальный срок реагирования - несколько часов с момента появления отзыва.\nСкорость ответа показывает, что компания внимательна к клиентам.\n\n● Проявление клиентоориентированности. В ответе необходимо\nпродемонстрировать сдержанность, вежливость и желание разобраться в\nситуации. Клиент должен почувствовать, что его проблема услышана, а не\nпроигнорирована. Даже простой ответ вроде “спасибо за отзыв, мы уже в поиске\nрешения данной ситуации” уже снижает напряжение.\n\n● Четкая структура ответа. Рекомендуется придерживаться модели: приветствие,\nблагодарность за отзыв, извинения, уточнение деталей, описание дальнейших\nдействий по решению проблемы, предложение компенсации. Для удобства бренду\nследует проработать качественные скрипты, которые не будут шаблонными, но\nсформируют структуру ответа. Также важно придерживаться спокойного,\nуважительного тона коммуникации.\n\n● Признать проблему. При наличии объективных проблем, даже небольших или\nнеочевидных нюансах умение признать вину демонстрирует уважение к клиенту,\nможет помочь снизить градус конфликта и сделать дальнейшую коммуникацию\nболее конструктивной.\n\n● Индивидуальный подход. Нельзя ограничиваться шаблонными ответами -\nкаждая ситуация требует погружения в детали и поиска оптимального решения\nименно для данного клиента.\n\n● Публичность коммуникации. Ответ на негативный отзыв должен быть\nопубликован там же, где появился исходный отклик. Это демонстрирует открытость\nбренда и показывает, что обратная связь положительно влияет на развитие бренда\nи его репутации.\n\n● Понятность и лаконичность. Ответ должен быть написан грамотно, без\nкорпоративного жаргона и длинных сложных предложений. Цель - донести\nготовность компании решить проблему.\n\nСоблюдение этих принципов позволяет грамотно и конструктивно работать с\nнегативными откликами реальных клиентов, минимизировать репутационные риски и\nсохранять лояльность аудитории.\n\nИсточники:\n\ntzyvami#pravila-gramotnoj-raboty-s-realnymi-negativnymi-otzyvami + чат гпт","hint":"Когда компания имеет дело с обоснованной критикой от реальных клиентов, то главной задачей становится не допустить эскалации конфликта и найти конструктивное решение проблемы.","category":"Прочее"},{"num":70,"title":"При подготовке к проведению коммуникационной кампании в первую очередь…","answer":"«Процесс разработки эффективных коммуникаций включает в себя восемь этапов.\nПервые пять шагов – это: определение целевой аудитории, постановка целей\nкоммуникации, разработка сообщения, выбор каналов коммуникации и\nопределение размера бюджета. Остальные три этапа (составление комплекса\nмаркетинговых коммуникаций, оценка результатов коммуникации и управление\nпроцессом интегрированных маркетинговых коммуникаций) мы рассмотрим\nнесколько позже в этой же главе.»\n\nИсточник:\n“Маркетинг менеджмент” Кевин Лейн Келлер","hint":"«Процесс разработки эффективных коммуникаций включает в себя восемь этапов.","category":"Коммуникации и тексты"},{"num":71,"title":"Как называется деятельность, которая осуществляется на безвозмездной основе и не предполагает финансовых и прочих обязательств со стороны, получающих поддержку?","answer":"Благотворительность","hint":"Благотворительность...","category":"Прочее"},{"num":72,"title":"Что такое товарный знак?","answer":"Товарный знак - это обозначение (словесное, изобразительное, объемное и т.д.),\nпрошедшее официальную регистрацию в Роспатент, служащее для индивидуализации\nтоваров, производимых юридическими лицами или индивидуальными\nпредпринимателями.\nИсточник: п.1 ст.1477, ст.1481, ст.1482 ГК РФ\nВажно:\n● Товарный знак действует 10 лет, после чего его можно продлевать\nнеограниченное число раз.\n● Если знак не используется более 3 лет, его правовую защиту могут\nаннулировать.\n● Регистрация обязательна для защиты бренда — без неё любое название\nили логотип могут быть использованы конкурентами.\n\nИсточник: п.2 ст.1491, ст.1486 ГК РФ.","hint":"Товарный знак - это обозначение (словесное, изобразительное, объемное и т.","category":"Прочее"},{"num":73,"title":"Графический способ быстрой и чёткой передачи сложной информации с помощью схем и рисунков – Это инфографика","answer":"(В принципе в этой статье много чего написано, меня смущает такой короткий ответ\n)","hint":"(В принципе в этой статье много чего написано, меня смущает такой короткий ответ )","category":"Прочее"},{"num":74,"title":"Определите коммуникационный канал, по которому передаются слухи.","answer":"Коммуникационный канал – это способ и средство, с помощью которых информация\nпередаётся от отправителя к получателю.\n\nСлухи передаются по неформальному коммуникационному каналу, то есть вне\nофициальных источников и без строгой регламентации. Такой канал основан на\nмежличностном общении, когда информация распространяется напрямую от человека\nк человеку.\n\nПримеры распространения слухов:\n\n● разговоры между студентами (например, обсуждение сложности экзамена);\n● общение сотрудников в коллективе (слухи о кадровых изменениях);\n● переписки в мессенджерах и чатах;\n● обсуждения и комментарии в социальных сетях.\n\nВ теории коммуникаций такой способ передачи информации называют «сарафанное\nрадио» или grapevine communication. Он отличается высокой скоростью\nраспространения, но при этом информация может искажаться и не всегда является\nдостоверной.\n\nИтог: слухи передаются через неформальные межличностные каналы\nкоммуникации, которые не регулируются официальными структурами и основаны на\nличных контактах.\n\nИсточники:","hint":"Коммуникационный канал – это способ и средство, с помощью которых информация передаётся от отправителя к получателю.","category":"Коммуникации и тексты"},{"num":75,"title":"Разработка комплекса мероприятий, определяющих последовательность достижения конкретных целей с учётом возможностей наиболее эффективного использования ресурсов каждым производственным подразделением и всей фирмой, – это…","answer":"стратегическое планирование (деятельности предприятия)\n\nисточник:\n\nvennymi-zapasami","hint":"стратегическое планирование (деятельности предприятия) источник: vennymi-zapasami","category":"Прочее"},{"num":76,"title":"Какой вид коммуникаций желательно использовать для информирования приоритетных целевых аудиторий?","answer":"Для информирования приоритетных целевых аудиторий наиболее эффективно\nиспользовать прямые и персонализированные коммуникации в рамках\nинтегрированных маркетинговых коммуникаций (ИМК).\n\nК таким коммуникациям относятся:\n-Direct marketing (прямой маркетинг): почтовые и email-рассылки, SMS-уведомления;\n-CRM-коммуникации: персонализированные сообщения на основе клиентских данных;\n-Таргетированная digital-реклама: в социальных сетях и поисковых системах;\n-Личные продажи и персональные контакты (встречи, переговоры);\n-PR-активности с индивидуальной работой со СМИ и лидерами мнений;\n-Программы лояльности и персональные предложения.\n\nЭти инструменты позволяют точно сегментировать аудиторию, адаптировать\nсообщение под конкретные группы и повышают эффективность воздействия.\n\nИсточники: напрямую в учебниках об этом не говориться, но выборочно информацию\nбрала из тех, которые были указаны в рекомендациях Котлер «Маркетинг\nменеджмент», Кузьмина «Интегрированные маркетинг коммуникации» + gpt","hint":"Для информирования приоритетных целевых аудиторий наиболее эффективно использовать прямые и персонализированные коммуникации в рамках интегрированных маркетинговых коммуникаций (ИМК).","category":"Коммуникации и тексты"},{"num":77,"title":"Для чего необходимо заранее ознакомиться со списком предполагаемых вопросов издания к фигуранту интервью?","answer":"Заранее ознакомиться со списком предполагаемых вопросов необходимо для\nкачественной подготовки интервью. Это помогает журналисту определить цель\nбеседы, собрать нужную информацию о фигуранте, продумать последовательность\nвопросов и возможные уточнения. Кроме того, предварительная подготовка позволяет\nпредугадать реакцию собеседника, избежать неточностей и сохранить контроль над\nходом интервью. Благодаря этому беседа становится более содержательной, логичной\nи результативной.\n\nИсточник:\n\nalists/?utm_source=chatgpt.com + ведение переговоров","hint":"Заранее ознакомиться со списком предполагаемых вопросов необходимо для качественной подготовки интервью.","category":"Прочее"},{"num":78,"title":"Креативность –...","answer":"Креативность представляет собой уровень творческой одарённости как устойчивую\nхарактеристику личности. Она проявляется в способности создавать новое\nнетрадиционными способами за пределами общепринятых норм и технологи\n\nОсновные компоненты:\n– Оригинальность - подразумевает генерацию нетрадиционных идей с отклонением от\nшаблонов.\n– Утилитарность - обеспечивает практическую ценность результата, достигаемого\nнестандартно.\n– Конфликт - возникает как противоречие между привычным и новым, что создаёт\nэффект креатива\n\nУровни креативности:\nМодель «4C»\n● Mini-c (субъективная): Личные открытия и идеи, которые важны только для\nсамого человека (например, ребенок впервые смешал краски и узнал новый\nцвет).\n● Little-c (бытовая): Использование творчества для решения повседневных задач\n(приготовление блюда из остатков продуктов, необычный подарок другу).\n● Pro-C (профессиональная): Креативность экспертов, которые создают\nкачественный продукт в своей области, но не обязательно меняют ход истории\n(профессиональный дизайн, архитектура, программирование).\n● Big-C (великая): Идеи мирового масштаба, которые меняют культуру или науку\n(теория относительности Эйнштейна, картины Пикассо)\nПараметры креативности:\n● Дивергентное мышление- генерирование множества идей из одной проблемы, в\nотличие от конвергентного мышления, ориентированного на поиск\nединственного верного решения.\n● Гибкость - переключение между идеями и подходами.\n● Беглость - количество идей за единицу времени.\n● Разработанность- детализация идей до практической формы.","hint":"Креативность представляет собой уровень творческой одарённости как устойчивую характеристику личности.","category":"Прочее"},{"num":79,"title":"Коммуникация – это…","answer":"Коммуникация ‒ процесс передачи информации от одного человека к другому по\nразным каналам связи посредством общей системы знаков.\n\n1. Виды коммуникации :\n■ вербальная – невербальная,\n■ межличностная – межнациональная ‒ межкультурная,\n■ мифологическая,\n■ художественная,\n■ массовая и др.\n\n2. Условия коммуникации:\n■ прямая, или непосредственная, коммуникация с активной обратной связью (диалог)\nили с отсроченной обратной связью (письменное распоряжение, сообщение по радио\nи т.д.)\n■ опосредованная коммуникация (выступление на телевидении, в СМИ и т.д.)\n\nКоличество участников:\n■ монолог\n■ диалог\n■ полилог\n\n3. Цели коммуникации:\n■ информирование\n■ убеждение (включая побуждение, объяснение и т. д., вплоть до дестабилизации\nчерез угрозу или агрессию)\n■ развлечение…\n\n4. Характер ситуации:\n■ деловая коммуникация (доклад, лекция, дискуссия)\n■ публичная коммуникация (митинг, собрание)\n■ бытовая коммуникация (болтовня, светские разговоры, чат)\n\n5. Модели коммуникации:\n■ Гарольда Д. Лассвелла: Who says what to whom in which channel with what effect?\n\nВ определении Г. Лассвелла содержится свернутая модель коммуникации с\nвыделением отправителя, получателя, сообщения, канала связи и результата:\n\n• кто говорит? [отправитель],\n• кому говорит? [получатель: индивид, коллегиальный, кооперативный,\nколлегиально-кооперативный, коллективный],\n\n• по какому каналу? [канал коммуникации по органам чувств: слуховой, визуальный,\nтактильный, вкусовой; канал коммуникации по используемым техническим средствам:\nрадиосвязь, телефон…],\n• что говорит? [сообщение],\n• с каким эффектом? [результативность коммуникативного акта в плане достижения\nпоставленной цели: информировать, привлечь внимание, выразить мнение,\nпредупредить, убедить, побудить к действию и т.д.].\n\n● Достоинство ‒ развернутый план коммуникативного действия.\n● Недостаток ‒ монологичность: коммуникативный акт представляется как прямое\nвоздействие отправителя на получателя без учета возможной обратной связи.\n\n■ Линейная модель Шеннона ‒ Уивера\nРазработана в 1949 году для описания коммуникации средствами телефонной связи,\nзатем распространена на все виды коммуникации (с добавлением шумакакпомехи\nкоммуникации).\n\nпередатчик → канал связи → приемник\n\nВ модели учитываются: источник сообщения, кодировщик, канал связи, декодер,\nполучатель сообщения.\n\nНа успешность связи влияют помехи (шум). В качестве шума могут рассматриваться\nкак неразборчивость речи, плохое качество воспроизведения, так и неинформативные\nсообщения.\n\n● Достоинство ‒ представление о скорости и количестве передаваемой\nинформации.\n● Недостаток ‒ коммуникативный процесс представляется как линейный\n(однонаправленный) без учета обратной связи.\n\n■ Функциональная модель Р. О. Якобсона\n\nМодель включает шесть компонентов: адресант ‒ адресат ‒ сообщение ‒ код‒\nконтекст ‒ контакт .\n\nКомпоненты модели соотносятся с функциями языка:\n• отправитель (адресант) → экспрессивная функция,\n• получатель (адресат) → конативная функция,\n• контекст → референтная функция,\n• сообщение → поэтическая функция,\n\n• контакт → фатическая функция,\n• код → метаязыковая функция.\n\n■ Модель Осгуда ‒ Шрамма\n\nДостоинство ‒ в модели учитывается принцип обратной связи.\n\nИсточник:","hint":"Коммуникация ‒ процесс передачи информации от одного человека к другому по разным каналам связи посредством общей системы знаков.","category":"Коммуникации и тексты"},{"num":80,"title":"Как в модели социальной ответственности формулируется роль прессы в обществе?","answer":"Модель социальной ответственности прессы является одной из классических теорий\nмассовой коммуникации и была сформулирована в рамках Теории четырех моделей\n\nпрессы Сиберт, Шрамм, Питерсон (авторитарная, либертарианская, теория\nсоциальной ответственности, советская тоталитарная теория) и получила\nраспространение в США в ХХ веке. Она возникла как развитие либертарианской\nтеории и отражает необходимость сочетания свободы СМИ с их ответственностью\nперед обществом.","hint":"Модель социальной ответственности прессы является одной из классических теорий массовой коммуникации и была сформулирована в рамках Теории четырех моделей прессы Сиберт, Шрамм, Питерсон (авторитарная, либертарианская, теория социальной ответственности, советская тоталитарная теория) и получила распространение в США в ХХ веке.","category":"Прочее"},{"num":81,"title":"Понятие «лидер общественного мнения».","answer":"Лидеры общественного мнения — это люди, чье мнение оказывает значительное\nвлияние на взгляды и поведение широкой аудитории. Лидеры общественного мнения\nшироко привлекаются для рекламы и управления репутацией компаний.\n\nЛидеры мнений (Opinion Leaders) — узнаваемые звезды, которые пользуются\nдоверием в своих сообществах, например, эксперты, блогеры или активисты.\n\nБлагодаря своей репутации Лидеры мнений могут целенаправленно формировать\nотношение людей к различным вопросам, продуктам или брендам. Их влияние\nбазируется на узнаваемости и способности доносить сложные идеи понятным и\nпривлекательным способом.\n\nВ условиях легкого доступа к информации, высокоскоростного интернета и цифровой\nэкономики лидеры мнений играют важную роль, быстро распространяя информацию и\nвызывая эмоциональную вовлеченность.\n\nИсточник:\n\ney/lidery-obshchestvennogo-mneniya-key-opinion-leaders/?utm_referrer=\n.com/","hint":"Лидеры общественного мнения — это люди, чье мнение оказывает значительное влияние на взгляды и поведение широкой аудитории.","category":"Общественное мнение"},{"num":82,"title":"Что такое контент?","answer":"Контент – это любой информационный продукт, который создается, распространяется\nи используется через различные медиа-каналы. Сюда входят тексты, изображения,\nвидео, аудио, а также интерактивные элементы, такие как игры, опросы или\nвеб-приложения. Контент служит основой для взаимодействия между пользователями\nи платформами, а также является средством для передачи идей, знаний и эмоций.\n\nКлассификация\nПо формату подачи\n● Текстовый. Такой формат выступает основным для многих ресурсов. Это\nновости, статьи, обзоры, интервью, руководства, заметки и другие тексты.\n● Графический. К данной категории относят изображения, фотографии,\nиллюстрации, инфографику и другие способы визуального представления\nинформации. Часто графика дополняет текстовые материалы, но может быть и\nосновным форматом.\n● Видео. Ролики разного содержания и объёма.\n● Аудио. Интервью, музыка, подкасты и прочее.\n\nИногда в одном материале сочетают два и более формата. Для материала,\nпредставленного одновременно в разных форматах, применяют понятие\n«мультимедийный».\n\nПо назначению\n● Коммерческий. Основная задача — привлечь потенциальных клиентов,\nпрорекламировать деятельность и продать товары или услуги. Иногда такой\nконтент называют продающим (рекламный пост о продукте, рассылка с акцией).\n● Информационный. Предоставляет аудитории полезную информацию, даёт\nответы на вопросы (новости, статьи). В эту же категорию можно отнести и\nобучающий контент (например инструкции, вебинары).\n● Развлекательный. Предназначен для развлечения пользователей (тесты, игры).\nСюда же можно добавить вовлекающий контент, который используют с целью\nвовлечения аудитории в диалог или взаимодействие.\n\nВсе упомянутые категории можно представить в разных форматах. Например, на\nинформационном сайте зачастую присутствуют рекламные баннеры, а продающий\nтекст может одновременно быть развлекательным. Также важно отметить, что\nинформационный и развлекательный контент от бренда так или иначе имеет\nкоммерческий подтекст.\n\nПо уровню эксклюзивности\n● Уникальный. Так называют контент, который не имеет аналогов. Хотя\nизложенная информация может и не быть эксклюзивной, но способ её передачи\nуникален. Текстовую уникальность проверяют с помощью специальных\nпрограмм для поиска плагиата (например, Адвего, text.ru). Изображения также\nможно проверять через спецсервисы — например, Google-картинки.\n● Неуникальный. Это полностью или частично скопированный материал. Иногда\nтакой контент становится результатом некачественного рерайтинга\n(переработки готовых текстов с целью создания новых материалов). В\nнекоторых случаях неуникальный контент может выступать основным на сайте,\nно тогда должны быть указаны источники материалов.\n\nЧаще всего понятие уникальности применяют в отношении текстового контента.\nУникальные тексты имеют существенное значение при продвижении сайтов. Они\nвыступают объектом ранжирования поисковых систем — определения позиции сайта в\nпоисковой выдаче. Неуникальный контент нарушает авторские права, из-за чего\nвладелец может пожаловаться на тех, кто скопировал его материалы.\n\nПо источникам\n● Авторский. Это оригинальный материал, созданный собственными силами или\nс помощью привлечённых специалистов.\n● Копипаст. В этом случае ресурс наполняют чужим контентом. При этом,\nобычное копирование и перепечатку признают плагиатом или воровством. При\n«белом» копипасте указывают ссылки на источник, но такой вариант должен\nбыть разрешён владельцем. Правильно оформленное цитирование отдельных\nфрагментов в уникальном тексте копипастом не считается. Копипаст\nвизуального контента также признают воровством.\n● Пользовательский (UGC). Это материалы, которые создают сами посетители\nресурса. Например, комментарии, отзывы, обзоры, фотографии, посты.\nЦенность таких материалов в их естественности и поддержании связи с\nаудиторией. Однако пользовательский контент требует постоянный модерации,\nчтобы удалять спам, ненормативную лексику и противоправные высказывания.\n\nКакие каналы используют для посева контента\n● Социальные сети. В различных тематических группах и сообществах публикуют\nпосты, связанные с темой продвигаемого контента и дают ссылку на конкретный\nматериал. Также можно запускать в соцсетях таргетированную рекламу на\nподготовленные материалы.\n\n● Мессенджеры. Контент анонсируют в мессенджер-рассылках.\n\n● Email-рассылки. О новых материалах рассказывают в рассылке, акцентируя\nвнимание на том, чем они интересны или полезны.\n\n● Гостевые публикации. Многие площадки приглашают авторов-экспертов для\nсоздания контента и взамен предлагают большой охват аудитории. Если ваш\nматериал соответствует требованиям ресурса, можно разместить его\nбесплатно.\n\n● Тематические площадки. Можно размещать публикации на различных\nпопулярных площадках вашей тематики. Размещение может быть платным и\nбесплатным.\n\nИсточники:\n\nrii/#anchor-2","hint":"Контент – это любой информационный продукт, который создается, распространяется и используется через различные медиа-каналы.","category":"Коммуникации и тексты"},{"num":83,"title":"Какой из рекламных текстов написан по формуле AIDA?","answer":"AIDA — популярная схема, по которой пишут продающие тексты и составляют\nрекламные сообщения. Это одна из самых известных моделей для продающего\nкопирайтинга. Кроме того, на её основе разрабатывают маркетинговые воронки.\nМодель представляет собой четыре шага, через которые нужно провести покупателя.\nКаждая буква соответствует одному из этих шагов.\n\nКлючевые элементы структуры:\n\n● A (Attention) — Внимание: Яркий заголовок или вопрос, цепляющий целевую\nаудиторию.\n● I (Interest) — Интерес: Описание уникального торгового предложения (УТП) или\nпроблемы.\n● D (Desire) — Желание: Акцент на выгодах для клиента, почему нужен этот\nпродукт.\n● A (Action) — Действие: Четкий призыв к покупке или целевому действию.\n\nПример использования модели AIDA\n\nПредположим, вы продаёте квартиры от застройщика в доме комфорт-класса.\nРазберём, что можно сделать на каждом этапе.\n\nAttention. Вашей целевой аудиторией, скорее всего, будет средний класс. Сейчас эти\nлюди снимают квартиру в центре или недалеко от него. Возможно, у них есть машина.\nОни работают на квалифицированной работе и проводят много времени в интернете.\n\nЗначит, вы можете привлечь внимание потенциальных покупателей с помощью\nбилбордов, расположенных на оживлённой дороге в центре. Также можно запустить\nконтекстную рекламу в поиске по запросам «Купить квартиру» и «Квартиры в\nновостройке».\n\nМожно выделить для таргетированной рекламы несколько сегментов аудитории и для\nкаждого составить свои объявления. Например, многие молодые семьи ждут ребёнка\n— в объявлениях на эту аудиторию важно написать о детском саде рядом с домом.\n\nInterest. Расскажите главное, что нужно знать о квартирах в этом доме. Укажите цену.\nНапишите, чем дом отличается от других новостроек.\n\nРасскажите о выгодных предложениях: низком проценте по ипотеке, большой скидке\nпри покупке на этапе котлована, отделке в подарок.\n\nDesire. Покажите, как квартиры будут выглядеть после ремонта. Добавьте на сайт\nвиртуальную экскурсию. Расскажите, насколько удобно жить в этом доме: например,\nнапишите о том, что до метро можно дойти за десять минут прогулки по парку.\n\nЕсли дом достроен или почти достроен, можно проводить индивидуальные экскурсии и\nпоказывать квартиры.\n\nAction. Укажите на сайте как можно больше контактов для связи и напишите часы\nработы. Создайте форму для заказа звонка и бронирования квартиры.\n\nЧто такое AIDA и как её использовать / Skillbox Media","hint":"Это одна из самых известных моделей для продающего копирайтинга.","category":"Реклама"},{"num":84,"title":"Лаконичности рекламного текста содействуют…","answer":"Ответ: короткие предложения, активный залог и императивные конструкции.\n\nОбоснование выбора\nЛаконичность — это умение выражать мысли кратко и ясно, без лишних слов.\nРекламные тексты требуют максимальной компрессии информации из-за\nограниченного пространства и времени восприятия аудиторией, что достигается\nсинтаксическими средствами, такими как короткие предложения и динамичные формы.\nАктивный залог и сильные слова усиливают прямолинейность и энергетику\nвысказывания, избегая пассивных конструкций, которые удлиняют текст и снижают\nэмоциональное воздействие. Императивы (призывы типа \"Купите!\", \"Попробуйте!\")\nсоздают эффект непосредственного обращения, повышая убедительность при\nминимальном объеме. Реклама должна вызвать интерес к рекламируемой продукции,\nчто позволит адресату получить упрощенное точное понятийное представление об\nинтересуемом объекте. Это повышает эффективность: лаконичные сообщения\nбыстрее доносят суть и вызывают нужную реакцию.\n\nНекоторые способы достижения лаконичности в рекламе:\n● Фокусировка на главном. Нужно определить ключевое сообщение и\nсосредоточиться на нём, избегая лишних деталей и второстепенной\nинформации.\n● Использование сильных слов. Следует выбирать слова, которые имеют\nмощное значение и вызывают эмоции. Например, вместо «очень хороший»\nиспользовать «отличный».\n\n● Применение визуальных элементов. Картинки и иконки могут передать\nинформацию быстрее и эффективнее, чем текст. Например, вместо длинного\nописания продукта можно использовать изображение с кратким слоганом.\n● Использование призывов к действию. Чёткие и краткие призывы, такие как\n«Купите сейчас» или «Узнайте больше», помогают направить аудиторию к\nнужному действию.\n● Применение эллиптических конструкций. Это приём, при котором часть\nпредложения намеренно опускается, однако читатель может восстановить её из\nконтекста. Такие конструкции делают фразу более короткой и запоминающейся.\n● Использование цифр. Цифры часто связаны с выгодой, поэтому они\nвыделяются на фоне остального текста и привлекают внимание.\n\nВажно, чтобы лаконичный текст при этом оставался информативным и убедительным.\nКаждая последующая фраза должна вытекать из предыдущей, ни одна фраза не\nдолжна быть лишней.\n\nИсточники:","hint":"Лаконичность — это умение выражать мысли кратко и ясно, без лишних слов.","category":"Реклама"},{"num":85,"title":"Основными требованиями к этим жанрам медиатекстов являются взвешенность фактов, доказательность выводов и чёткая авторская позиция. О каких жанрах идёт речь?","answer":"Речь идет об аналитических жанрах медиатекстов.\n\nК ним относятся: статья, обзор, рецензия, комментарий, аналитическая\nкорреспонденция, журналистское расследование.\n\nИменно для аналитики характерны взвешенность фактов, доказательность выводов и\nчеткая авторская позиция. Например, в информационных жанрах самым главным\nявляется оперативно и нейтрально сообщить факт, а в\nхудожественно-публицистических - показать образность, эмоциональность и авторскую\nинтерпретацию.\n\n“В сфере аналитических жанров эффективность обеспечивается масштабностью\nвзгляда на сущность жизненных явлений, комплексным подходом к анализу проблем\n\nдействительности, расширением тематики за счет обозрений по широкому кругу\nвопросов, интересующих аудиторию.\n\nОт публицистических жанров требуется раскрытие новых граней общественных\nотношений в их диалектической сложности, многосторонний показ человека в самых\nзначительных проявлениях личности, психологическая и нравственная глубина оценки\nпротиворечий, что позволяет преодолевать элементы «литературщины», которые не\nвоспринимаются на страницах прессы массовой аудиторией.\n\nВ информационных жанрах важно умение видеть, отбирать, оценивать,\nкомментировать и оперативно реагировать на новые общественно значимые факты”.\nИсточник:","hint":"К ним относятся: статья, обзор, рецензия, комментарий, аналитическая корреспонденция, журналистское расследование.","category":"Медиа и теория"},{"num":86,"title":"Для успешного написания рекламного текста требуется…","answer":"Чёткая цель и ориентация на целевую аудиторию: текст должен быть конкретным,\nцеленаправленным и обращаться к определённому сегменту потребителей.\n\n1. Уникальное торговое предложение (УТП) и аргументация: необходимо\nвыделить одну ключевую идею, подчеркнуть преимущества продукта и логично\nих обосновать.\n2. Лаконичность и простота: использование понятной лексики, кратких\nформулировок и простого синтаксиса без перегруженности смыслами.\n3. Оригинальность и креативность: текст должен быть запоминающимся,\nинтересным, выделяться среди конкурентов и использовать приёмы,\nусиливающие запоминаемость.\n4. Призыв к действию (CTA): чёткое указание на ожидаемое действие\nпотребителя (купить, позвонить, перейти по ссылке и т.д.).\n5. Достоверность и соответствие законодательству: реклама должна быть\nправдивой, этичной и соответствовать нормам закона о рекламе.\n○ достоверность информации;\n○ недопустимость введения потребителя в заблуждение;\n○ корректность сравнений с конкурентами;\n○ соблюдение этических норм;\n○ учёт ограничений для отдельных категорий товаров и услуг\n(медицинских, финансовых, алкогольной продукции и др.).\n\nЮридическая грамотность текста напрямую влияет на его безопасность и\nвозможность использования в публичных коммуникациях.\n\nИсточники:\n\n1. Котлер Филип «Основы маркетинга»: базовые принципы маркетинга, целевая\nаудитория, УТП.\n2. Огилви Дэвид «О рекламе»: практические подходы к созданию эффективных\nрекламных текстов","hint":"Чёткая цель и ориентация на целевую аудиторию: текст должен быть конкретным, целенаправленным и обращаться к определённому сегменту потребителей.","category":"Реклама"},{"num":87,"title":"Специфика использования сторителлинга в B2B рекламе.","answer":"Сторителлинг (от англ. storytelling — «рассказывание историй») — это\nкоммуникационная техника, основанная на создании и подаче информации в форме\nувлекательной истории с сюжетом, героями и конфликтом. Цель сторителлинга — не\n\nпрямое убеждение, а вовлечение аудитории через эмоциональный отклик, который\nзатем приводит к желаемому действию.\n\nB2B (Business‑to‑Business) — модель коммерческих отношений, при которой одна\nкомпания продаёт товары или услуги другой организации (а не конечному\nпотребителю, как в B2C).\n\nНесмотря на кажущуюся «сухость» B2B‑рынка, его участниками являются люди,\nкоторые, как и все, подвержены эмоциям. Сторителлинг помогает:\n\n· Упростить сложные концепции. Технические детали и цифры легче\nвоспринимаются в контексте реальной истории.\n· Создать доверие. Истории о реальных клиентах (кейсы) убедительнее\nабстрактных заявлений.\n· Выделиться среди конкурентов. Уникальная история запоминается\nлучше, чем список стандартных преимуществ.\n· Сформировать эмоциональную связь. Даже в B2B отношения строятся\nмежду людьми, а не между корпоративными логотипами.\n· Продемонстрировать ценность. История наглядно показывает, как\nпродукт решает конкретную бизнес‑проблему.\n· Улучшить запоминаемость. Мозг лучше усваивает и хранит информацию\nв форме нарратива.\n\nСпецифика сторителлинга в B2B\n\n(Отличия от B2C)\n\nПараметр B2B B2C\nАудитори Эксперты, ЛПР, узкие Широкая масса потребителей\nя специалисты\nМотиваци Рациональная: ROI, Эмоциональная: удовольствие,\nя надёжность, эффективность статус, принадлежность\nЦикл Длительный Короткий (минуты/дни)\nсделки (недели/месяцы)\nФокус Бизнес‑результат, снижение Личное счастье, комфорт,\nистории затрат, рост прибыли развлечение\nДоказате Кейсы, цифры, метрики, ROI Отзывы, впечатления, «лайки»\nльства\nТон Профессиональный, Непринуждённый,\nповество экспертный развлекательный\nвания\n\nКлючевые акценты в B2B‑сторителлинге:\n· Цифры и метрики. История должна содержать конкретные данные:\n«сократили время обработки заказов на 30 %», «увеличили конверсию в\nпродажи на 15 %».\n· Бизнес‑язык. Используйте термины, понятные целевой аудитории (ROI,\nKPI, воронка продаж и т. д.).\n· Фокус на процессе. Покажите как было достигнуто решение: этапы\nвнедрения, преодоление сложностей.\n· Доказательная база. Подкрепляйте историю фактами: отчёты, графики,\nцитаты ЛПР клиента.\n\n· Долгосрочная перспектива. Акцентируйте внимание на устойчивости\nрезультата и потенциале для масштабирования.\n\nТипы сторителлингов в B2B\n\n1. Кейс‑история (Case Study). Классический формат: «Клиент X столкнулся с\nпроблемой Y. Мы предложили решение Z. Результат: +N % прибыли».\nСамый убедительный инструмент.\n2. История бренда (Brand Story). Рассказывает о создании компании, её\nмиссии и ценностях. Помогает выстроить доверие и позиционирование.\n3. Экспертный нарратив. История от лица эксперта компании: «Как я помог\nклиенту решить сложную задачу». Демонстрирует компетенции.\n4. Визионерская история. Показывает будущее отрасли и роль продукта в\nнём: «Каким будет производство через 5 лет и как наше ПО поможет\nлидировать».\n5. История продукта. Рассказывает, как и зачем был создан продукт, какие\nболи он решает. Особенно актуально для инноваций.\n\nГде применять сторителлинг в B2B?\n\nКейсы на сайте\\ Презентации для клиентов\\ Email‑рассылки\\ Вебинары и выступления\\\nСоциальные сети (LinkedIn)\nИсточник: ИИ +","hint":"Цель сторителлинга — не прямое убеждение, а вовлечение аудитории через эмоциональный отклик, который затем приводит к желаемому действию.","category":"Реклама"},{"num":88,"title":"Что из названного может относиться к визуальному сторителлингу?","answer":"Визуальный сторителлинг — это способ рассказать историю, передать идею,\nценность бренда, продукта или события с помощью визуальных средств: изображений,\nфотографий, видео, анимации, инфографики, комиксов, презентаций, плакатов,\nвизуальных серий и других форматов. Главное отличие визуального сторителлинга от\nобычной картинки в том, что он не просто показывает объект, а разворачивает сюжет:\nесть герой, ситуация, проблема или конфликт, развитие действия и определенный\nсмысловой вывод.\n\nЧто относится к визуальному сторителлингу\n\n1. Серия фотографий, рассказывающая историю.\nНапример, не просто фото товара, а последовательность: проблема клиента →\nиспользование продукта → результат.\n\n2. Рекламный видеоролик с сюжетом.\nНапример, герой сталкивается с проблемой, бренд помогает ее решить, в финале\nпоявляется эмоциональный или практический результат.\n\n3. Комикс или иллюстрированная история.\nТакой формат часто используется в социальных сетях, образовательных проектах,\nпрезентациях и бренд-коммуникациях.\n\n4. Инфографика, если она показывает развитие событий.\nНапример, путь клиента, этапы проекта, историю компании, изменение ситуации\n«до/после».\n\n5. Презентация с визуальным сюжетом.\nКогда слайды не просто перечисляют факты, а последовательно ведут аудиторию от\nпроблемы к решению.\n\n6. Плакатная серия или рекламная кампания с единым визуальным образом.\nНапример, несколько макетов, которые вместе раскрывают одну идею бренда.\n\n7. Анимация, motion-дизайн, короткие видео для социальных сетей.\nОсобенно если в них есть герой, действие, изменение ситуации и финальный смысл.\n\n8. Визуальный кейс бренда.\nНапример, история о том, как компания помогла клиенту, показанная через фото,\nвидео, схемы, цитаты и результат.\n\nЧто не относится к визуальному сторителлингу\n\nК визуальному сторителлингу не относятся:\n\n1. Обычная фотография товара без сюжета.\nНапример, просто изображение чашки кофе на белом фоне — это визуальный контент,\nно не история.\n\n2. Логотип сам по себе.\nЛоготип может быть частью фирменного стиля, но без сюжета он не является\nсторителлингом.\n\n3. Баннер с прямым рекламным призывом.\nНапример: «Купите сейчас со скидкой 20%». Это реклама, но не визуальная история.\n\n4. Случайный набор красивых картинок.\nЕсли изображения не связаны между собой смыслом и последовательностью, это\nпросто визуальное оформление.\n\n5. Таблица или схема без повествовательной логики.\nИнфографика может быть сторителлингом, но только если она показывает развитие,\nпуть, проблему и решение.\n\n6. Фирменные цвета, шрифты и иконки сами по себе.\nОни помогают визуальной коммуникации, но не являются историей без сюжета.\n\nГлавный критерий: если визуал не рассказывает историю, а только украшает или\nсообщает отдельный факт, это не визуальный сторителлинг.","hint":"Визуальный сторителлинг — это способ рассказать историю, передать идею, ценность бренда, продукта или события с помощью визуальных средств: изображений, фотографий, видео, анимации, инфографики, комиксов, презентаций, плакатов, визуальных серий и других форматов.","category":"Коммуникации и тексты"},{"num":89,"title":"В каком виде рекламы чаще других используется сторителлинг?","answer":"Наиболее вероятные варианты ответов: Сторителлинг в рекламе чаще всего\nиспользуется в ВИДЕОРЕКЛАМЕ; ИМИДЖЕВОЙ (брендовой) рекламе, также могут\nбыть представлены такие варианты как ИНТЕРНЕТ-реклама; НАТИВНАЯ реклама.\n\nСторителлинг (англ. storytelling — «рассказывание историй») — это маркетинговый\nприём, который помогает донести информацию через рассказ или историю.\n(\n8)\n\nСторителлинг — это целостная структура, где есть композиция, сюжет, герой, его цель\nи препятствия на пути к ней.\n(\n89800)\n\nКлассификации и частота использования\n\nПо каналам распространения и форматам:\n\n● Видеореклама. Для сторителлинга в рекламе чаще всего используют видео,\nпотому что за 30–40 секунд можно донести максимум информации и не\nнаскучить зрителю.\n(\n5069286)\n● Интернет-реклама и digital-форматы — Здесь преобладает\ndigital-сторителлинг и визуальный сторителлинг, который часто использует\nкороткие визуальные форматы, например ролики или карточки с продуктом.\n(\n87526)\n● Нативная реклама. Нативный подход часто использует сторителлинг и креатив,\nчтобы вовлечь пользователя, а не просто «показать товар».\n(\n4100288)\n\nПо целям рекламы:\n\n● Имиджевая реклама (верхняя часть воронки продаж) При работе с имиджем\nстоит задача — передать ценности, характер, миссию бренда.\n(","hint":"Наиболее вероятные варианты ответов: Сторителлинг в рекламе чаще всего используется в ВИДЕОРЕКЛАМЕ; ИМИДЖЕВОЙ (брендовой) рекламе, также могут быть представлены такие варианты как ИНТЕРНЕТ-реклама; НАТИВНАЯ реклама.","category":"Реклама"},{"num":90,"title":"Основные коммуникационные революции.","answer":"В современной науке, основанной на методологии технологического\nдетерминизма (Г. Иннис, Г.-М. Маклюэн, О. Тоффлер), сформировался подход,\nрассматривающий коммуникационные революции как смену ключевых\nтехнологических укладов.\n1. Революция языка (около 40 000 лет назад)\nПервая великая информационная революция связана с появлением\nчленораздельной звуковой речи, которая окончательно закрепила антропологический\nпереход к Homo Sapiens.\nСуть революции: Переход от примитивной невербальной коммуникации\n(жестов, мимики, ритуальных танцев) к полноценной звуковой системе — языку.\nПоследствия и значение: Речь не только кардинально повысила\nэффективность совместной деятельности (например, охоты), но и стала тем\nуникальным инструментом, который позволил человеку абстрактно мыслить,\nнакапливать и передавать опыт от поколения к поколению. Язык создал основу для\nформирования устойчивых социальных общностей и культурной преемственности.\n2. Революция письменности (около 3200–3000 гг. до н.э.)\n\nПоявление письменности стало первым способом закрепления информации\nвне человеческого сознания, что дало толчок к зарождению первых цивилизаций.\nСуть революции: Изобретение системы графических знаков (от пиктограмм и\nиероглифов до алфавита) для долговременной фиксации и передачи речи.\nПоследствия и значение: Письменность позволила сохранять\n(консервировать) информацию, преодолев временные рамки человеческой жизни и\nограничения памяти. Именно письменность стала тем решающим критерием, который,\nпо мнению антропологов, отделил первобытность от цивилизованных обществ. Она\nдала начало развитию права, бюрократии, науки и сделала возможным накопление\nзнаний в масштабах, достаточных для строительства городов и государств.\n3. Революция книгопечатания (середина XV века)\nИзобретение Иоганном Гутенбергом печатного станка с подвижными литерами\nрадикально демократизировало знание, сделав его потенциально доступным для\nшироких масс, а не только для избранной элиты.\nСуть революции: Переход от трудоемкого ручного переписывания книг к их\nмеханическому массовому тиражированию.\nПоследствия и значение: Книгопечатание привело к экспоненциальному росту\nчисла грамотных людей, стандартизации языка и текстов, а также к формированию\nединого информационного пространства в масштабах целых государств. Этот\nреволюционный скачок разрушил монополию на знание (в первую очередь церковную),\nстал катализатором Возрождения, Реформации и бурного развития науки, заложив\nфундамент индустриальной эпохи.\n4. Революция электрических коммуникаций (XIX – середина XX века)\nЭта революция ознаменовала победу информации над физическим\nпространством — сообщения стали передаваться со скоростью света, что впервые в\nистории сформировало ощущение мира как \"глобальной деревни\" (концепция\nканадского философа М. Маклюэна)\nСуть революции: Создание и широкое внедрение технических средств\nкоммуникации, основанных на электричестве.\nКлючевые изобретения: Эта революция проходила в несколько этапов.\nТелеграф (1830–40-е гг.) позволил мгновенно передавать текстовые сообщения. Затем\nтелефон (1876 г.) добавил к этому \"живой\" голос, а радио (конец XIX — начало XX в.)\nвпервые обеспечило массовое вещание на невиданные аудитории.\nПоследствия и значение: Возникновение электронных средств массовой\nинформации (СМИ) не только глобализировало новостное поле, но и создало мощные\nинструменты влияния на сознание миллионов людей. Появилась глобальная\nиндустрия культуры и пропаганды\n5. Компьютерно-сетевая революция (с 1970-х гг. по настоящее время)\nСовременная, самая быстротечная информационная революция, которая\nперевела данные в цифровую, интерактивную плоскость, принципиально изменив\nспособ взаимодействия человека с информацией и друг с другом.\nСуть революции: Изобретение персонального компьютера, а затем и\nглобальных компьютерных сетей (Интернета).\nПоследствия и значение: Это переход от односторонней модели\nкоммуникации \"один говорит — многие слышат\" к многосторонней, интерактивной\nмодели \"каждый может общаться с каждым\".\nДанная революция лежит в основе формирования информационного\nобщества, где информация и знания становятся главным стратегическим ресурсом и\nдвижущей силой экономики и социума. Она привела к цифровой трансформации,\nглобализации, возникновению виртуальных сообществ и киберпространства.\n\nисточники:","hint":"В современной науке, основанной на методологии технологического детерминизма (Г.","category":"Коммуникации и тексты"},{"num":91,"title":"Предпосылки появления пиара как профессиональной деятельности в России.","answer":"Связи с общественностью, пиар (англ. PublicRelations — связи с общественностью,\nотношения с общественностью, общественные связи, общественные отношения,\nобщественное взаимодействие; сокращённо: PR — пи-ар) — технологии создания и\nвнедрения при общественно-экономических и политических системах конкуренции\nобраза объекта (идеи, товара, услуги, персоналии, организации — фирмы, бренда) в\nценностный ряд социальной группы, с целью закрепления этого образа как идеального\nи необходимого в жизни. В широком смысле - управление общественным мнением,\nвыстраивание взаимоотношений общества и государственных органов или\nкоммерческих структур, в том числе, для объективного осмысления социальных,\nполитических или экономических процессов.\n\nPR в России возник как ответ на политические изменения, рыночную конкуренцию\nи необходимость управлять общественным мнением в новых условиях, заменив\nсобой советскую пропагандистскую модель.\n\nПредпосылки:\n1. Переход от советской системы к демократическому обществу (конец 1980-х —\n1990-е гг.)\nПосле распада СССР исчезла монополия государственной пропаганды. Возникла\nнеобходимость двусторонней коммуникации между властью, бизнесом и обществом.\n\n2. Замена пропаганды на новые формы коммуникации\nВ СССР функции PR выполняли органы агитации и пропаганды, но их деятельность\nбыла односторонней. В новых условиях потребовались более гибкие и диалоговые\nинструменты влияния на общественное мнение.\n\n3. Переход к рыночной экономике и рост конкуренции\nПоявление частного бизнеса и конкуренции между компаниями вызвало\nнеобходимость:\n● формирования имиджа\n● продвижения товаров и услуг\n● выстраивания отношений с потребителями\n\n4. Политическая конкуренция\nМногопартийность и выборы создали конкуренцию за электорат, что потребовало:\n● работы с общественным мнением\n● построения политического имиджа\n● проведения информационных кампаний\n\n5. Развитие СМИ и информационного рынка\nВ 1990-е годы активно формируются независимые СМИ и информационная среда. Это\nсоздает платформу для распространения PR-коммуникаций.\n\n6. Изменение массового сознания и кризис доверия\nПосле советского периода у общества сформировалось недоверие к официальной\nинформации. Это потребовало:\n\n● более тонких коммуникационных стратегий\n● работы с ценностями и восприятием аудитории\n\n7. Влияние западного опыта\nРоссийский PR формировался под влиянием западных моделей:\n● заимствование технологий\n● адаптация зарубежных практик\n● развитие международных коммуникаций\n\n8. Развитие информационных технологий\nНовые технологии усилили возможности воздействия на аудиторию и изменили\nспособы коммуникации, что ускорило развитие PR как профессиональной сферы.","hint":"В широком смысле - управление общественным мнением, выстраивание взаимоотношений общества и государственных органов или коммерческих структур, в том числе, для объективного осмысления социальных, политических или экономических процессов.","category":"PR-деятельность"},{"num":92,"title":"В Российской империи накануне Первой мировой войны НЕ использовалась…","answer":"Ответ на вопрос «В Российской империи накануне Первой мировой войны НЕ\nиспользовалась…»\nПравильный ответ: массовые PR‑кампании с использованием радио и телевидения.\n\nЧто НЕ использовалось в Российской империи накануне Первой мировой войны:\n1. Радио и телевидение для рекламы и PR.\n• Радиовещание в России находилось в зачаточном состоянии: экспериментальные\nпередачи начались лишь в 1910‑х годах, регулярного вещания не было.\n• Телевидение как технология в тот период ещё не существовало в практическом\nприменении.\n• Соответственно, ни радиореклама, ни телевизионные PR‑кампании были\nневозможны.\n\n2. Профессиональные PR‑агентства западного типа.\n• В России начала XX века не было организаций, которые бы комплексно занимались\nсвязями с общественностью по модели Айви Ли или Эдварда Бернейса (их концепции\nсформировались позже, в 1920‑х).\n• Функции, близкие к PR, выполняли другие структуры, но не специализированные\nагентства.\n\n3. Системный политический PR в современном понимании.\n• Не было технологий «спин‑докторинга», медиа‑тренинга политиков, регулярного\nмониторинга общественного мнения.\n• Агитационные материалы создавались ситуативно, без единой стратегии.\n\nЧто ДЕЙСТВИТЕЛЬНО использовалось в Российской империи (прототипы\nрекламы и PR):\n1. Печатная реклама: плакаты, афиши, листовки, каталоги, реклама в газетах и\nжурналах.\n2. Выставочная деятельность как инструмент продвижения: участие в международных\nи национальных выставках.\n3. Фирменный стиль и брендинг: товарные знаки, фирменные шрифты, упаковка.\n4. Спонсорство и благотворительность как PR: поддержка театров, музеев,\nобразовательных учреждений.\n5. Государственная пропаганда через СМИ: публикации в официальных изданиях,\nраспространение патриотических листовок.\n\n6. Визуальная коммуникация: рекламные плакаты в стиле модерн, витринные\nэкспозиции.\n7. Связи с элитами и лоббизм: взаимодействие предпринимателей с чиновниками и\nдепутатами Госдумы.\n\nИсточники:\n1. РИА Новости. История развития радиовещания в России. — URL:\n(раздел «История»).\n2. РИА Новости. История развития телевидения в СССР и России. — URL:\n(раздел «История»).\n3. Культура.рф. История рекламы в России. — URL:\n4. РОО «Ассоциация победителей олимпиад». История отечественного\nрадиовещания. — URL: (раздел «Образовательные материалы»).\n5. ТАСС. История телевидения в России. — URL: (тематический раздел\n«История СМИ»).\n6. Reklama.school. Глава 1. Дореволюционная реклама в Российской империи —\nистория российской рекламы. — URL:\n7. Лукьянчикова М. В., Управителева Л. М., Маркина К. Н., Бердникова Э. Н. История,\nэтика и психология рекламы и PR. — Учебное пособие. — [Город]: [Издательство],\n[Год]. — [Количество] с.\n8. ТВТОК. Основные этапы истории телевидения: даты, изобретатели, технические\nаспекты. — URL:\n9. Реклама в прессе: история дореволюционной рекламы в Российской империи. —\nМатериал с образовательного портала Reklama.school. — URL:","hint":"Ответ на вопрос «В Российской империи накануне Первой мировой войны НЕ использовалась…» Правильный ответ: массовые PR‑кампании с использованием радио и телевидения.","category":"Прочее"},{"num":93,"title":"В СССР в годы НЭПа появился термин «реклам-конструктор», который означал…","answer":"Термин «реклам-конструктор» появился в СССР в годы НЭПа ( новая экономическая\nполитика, 1921–1928) и обозначал творческий метод или специалистов, работавших в\nстиле конструктивизма над рекламными материалами. Это был подход, сочетающий\nпоэзию, графику и дизайн для создания лаконичной, функциональной рекламы с\nакцентом на экономию средств, контраст цветов и метрическую повторяемость\nэлементов\n\nВладимир Маяковский (автор слоганов и текстов) и Александр Родченко\n(художник-конструктивист) в начале 1920-х открыли совместное агентство\n«Реклам-конструктор». Они создавали плакаты, этикетки, витрины и фирменный стиль\nдля госучреждений вроде Моссельпрома и ГУМа.\n\nРаботы «реклам-конструкторов» заложили основу советской торговой графики 1920-х,\nпредвосхитив политический плакат.\n\nОсновные характеристики «реклам-конструктора»:\n- Союз слова и изображения: Маяковский писал чеканные, рифмованные слоганы, а\nРодченко создавал графическое оформление в стиле конструктивизма\n(геометрические формы, фотомонтаж, яркие цвета)\n- Функциональность: Реклама не только продавала, но и агитировала, популяризируя\nгосударственные тресты в условиях конкуренции с частниками\n- Конструктивистский подход: Создание рекламных плакатов, упаковок, этикеток и\nвывесок как «производственного искусства», где каждый элемент был функционален и\n«сконструирован» для максимального воздействия на потребителя\n\nСамый известный пример их работы, серия рекламы для Моссельпрома со слоганом:\n“Нигде, кроме как в Моссельпроме!”\nисточник:","hint":"Термин «реклам-конструктор» появился в СССР в годы НЭПа ( новая экономическая политика, 1921–1928) и обозначал творческий метод или специалистов, работавших в стиле конструктивизма над рекламными материалами.","category":"Реклама"},{"num":94,"title":"В СССР в 1930-е гг. Анастас Микоян, оказавший значительное влияние на появление «советской рекламы», был известным…","answer":"народным комиссаром пищевой промышленности СССР.\n\nБудучи наркомом, он курировал развитие пищевой индустрии, внедрял новые\nтехнологии (в том числе после поездки в США в 1936 году) и активно занимался\nпродвижением товаров, считая, что реклама должна давать точную информацию о\nпродуктах.\n\nКлючевые факты о его деятельности в этот период:\n● Инициатор массового производства: Под его руководством в СССР появились\nмассовое производство мороженого, «докторской» колбасы, соков, кукурузных\nхлопьев, а также производство крабов.\n● «Отец» советской рекламы: Микоян инициировал создание первой советской\nрекламы, привлекая к работе Маяковского и Родченко.\n● Инициатор «Книги о вкусной и здоровой пище»: Курировал издание главной\nповаренной книги СССР.\n\nМикоян занимал должности наркома снабжения, внутренней торговли, а с 1934 года\nвозглавил Наркомпищепром.\n\nИсточники:","hint":"Будучи наркомом, он курировал развитие пищевой индустрии, внедрял новые технологии (в том числе после поездки в США в 1936 году) и активно занимался продвижением товаров, считая, что реклама должна давать точную информацию о продуктах.","category":"Реклама"},{"num":95,"title":"В России в 1990-е годы рекламные кампании банка «Империал» имели целью…","answer":"Серия популярных рекламных роликов, снятых в 1992-1997 годах Тимуром\nБекмамбетовым для банка «Империал». По прошествии времени серию этих\nрекламных роликов стали называть «классикой российской рекламы», а цитаты из\nроликов разошлись в народе. На Московском международном фестивале рекламы в\n2012 году серия рекламных роликов банка «Империал» была названа лучшей по\nитогам 20-летия рекламы в России.\n\nОсновные цели рекламных кампаний банка «Империал» в 1990-е годы в России —\nповышение узнаваемости бренда, формирование имиджа надёжного и престижного\nбанка, а также привлечение новых клиентов.\n\nРекламные ролики Бекмамбетова для банка \"Империал\" были направлены на\nпривлечение зрелой, обеспеченной аудитории, которая ценит исторические традиции,\nнадежность и престиж. Банк предлагал разнообразные финансовые продукты,\nудовлетворяющие потребности как частных лиц, так и корпоративных клиентов,\nакцентируя внимание на качестве обслуживания и эксклюзивных возможностях.\n\nРекламные ролик для банка “Империал” являются классическим примером успешной\nмаркетинговой кампании, где были эффективно использованы исторические сюжеты,\nэмоциональное воздействие и высокое качество продакшена для достижения\nмаркетинговых целей.\n\nauditorii","hint":"Серия популярных рекламных роликов, снятых в 1992-1997 годах
