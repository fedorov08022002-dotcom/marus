 менеджмента, злонамеренного поведения","внутренние, внешние, смешанные, гибридные","локальные, региональные, национальные, международные"],"correct":1,"expl":"В антикризисном PR используется именно классификация: технологические, конфронтационные, кризисы менеджмента и злонамеренного поведения. Прочие классификации — из других дисциплин (риск-менеджмент, кризисное управление в целом).","ref":22},{"q":"Что такое «слабые сигналы» в антикризисном PR?","options":["непроверенные слухи в социальных сетях","ранние признаки кризиса: неожиданные события, искажение информации, рост недовольства","падение охватов в собственных каналах","снижение трафика на сайт компании"],"correct":1,"expl":"«Слабые сигналы» — это ранние признаки, которые отслеживает PR-служба: неожиданные события, искажение информации, рост недовольства. Их выявление позволяет предотвратить кризис. Падение метрик — следствие, а не предупреждение.","ref":22},{"q":"Какие этапы кризисной PR-деятельности следуют друг за другом?","options":["Замалчивание → реакция → восстановление → выводы","Идентификация проблем → создание кризисного плана и команды → определение ЦА → распространение информации через СМИ","Юридическая оценка → внутренняя коммуникация → внешняя коммуникация → отчёт","Анализ рынка → разработка нового позиционирования → ребрендинг → запуск кампании"],"correct":1,"expl":"Стандартная последовательность этапов: идентификация проблем и источников → создание плана и команды → определение ЦА и сообщений → распространение через СМИ. Первый вариант — антипаттерн, остальные — про другие задачи.","ref":22},{"q":"Что означает принцип координации в антикризисном PR?","options":["Совместная работа PR-отдела с юристами и финансистами","Избегание противоречивых высказываний от разных представителей компании","Согласование позиции с регуляторами и госорганами","Координация с конкурентами для совместного ответа на отраслевой кризис"],"correct":1,"expl":"Принцип координации (сплочённости): любые разногласия внутри компании усилят кризис и подорвут доверие, поэтому важен единый голос. Это не про межотраслевые или межкорпоративные коалиции.","ref":23},{"q":"Что входит в задачи антикризисного PR помимо реагирования на кризис?","options":["прогнозирование, профилактика, восстановление доверия после кризиса","юридическое сопровождение претензий и исков","разработка новых продуктов для удержания клиентов","реструктуризация компании и оптимизация затрат"],"correct":0,"expl":"Задачи антикризисного PR: прогнозирование и профилактика (до), оперативное реагирование (во время), восстановление доверия (после). Юридика, продукты и реструктуризация — функции других подразделений.","ref":20},{"q":"Может ли правильно проведённый антикризисный PR улучшить репутацию компании?","options":["нет, цель — лишь минимизация потерь","да, через демонстрацию ответственности и способности эффективно решать проблемы","да, но только за счёт затмения проблемы новыми позитивными инфоповодами","нет, после кризиса репутация всегда хуже предкризисной"],"correct":1,"expl":"Правильно проведённая антикризисная кампания может не только минимизировать потери, но и улучшить репутацию — за счёт демонстрации ответственности, прозрачности и компетентности в решении проблем. Это «оборотная сторона» кризиса.","ref":20}]},{"category":"Бренд и репутация","questions":[{"q":"В чём ключевое различие между имиджем и репутацией?","options":["Имидж формируется быстрее, репутация — медленнее","Имидж — целенаправленно формируемый образ, репутация — устойчивое мнение из реального опыта","Имидж работает с эмоциями, репутация — с рациональным","Имидж управляется компанией, репутация — независимыми СМИ"],"correct":1,"expl":"Главное различие — в природе: имидж конструируется PR-инструментами (как компания хочет выглядеть), репутация складывается из реальных действий и фактов (более объективна). Скорость, эмоции и каналы — производные различия.","ref":24},{"q":"Какое из понятий — бренд, имидж или репутация — самое широкое?","options":["имидж как первичное представление","репутация как устойчивое мнение","бренд, включающий совокупность представлений, ценностей и характеристик","все три равнозначны и взаимозаменяемы"],"correct":2,"expl":"Бренд — самое широкое понятие, включающее совокупность характеристик, в том числе имидж и репутацию. Это устойчивый образ в сознании, объединяющий ценности, уникальность, отличительные характеристики.","ref":24},{"q":"Что такое ребрендинг?","options":["Полное изменение бизнес-модели компании","Изменение существующего бренда: названия, логотипа, стиля, позиционирования, ценностей","Освежение визуального стиля без изменения позиционирования","Расширение бренда на новые товарные категории"],"correct":1,"expl":"Ребрендинг — это комплексное изменение существующего бренда, включающее смену названия, логотипа, фирменного стиля, позиционирования, ценностей. Только визуальное обновление — это рестайлинг (часть ребрендинга). Расширение на категории — line extension.","ref":25},{"q":"Жизненный цикл товара по Теодору Левитту включает 5 стадий. В каком порядке они идут?","options":["Внедрение → Разработка → Рост → Зрелость → Спад","Разработка → Внедрение → Рост → Зрелость → Спад","Идея → Прототип → Внедрение → Зрелость → Спад","Разработка → Тестирование → Запуск → Рост → Спад"],"correct":1,"expl":"Модель Левитта: Разработка → Внедрение → Рост → Зрелость → Спад. Разработка идёт ПЕРЕД внедрением (товар создаётся до выхода на рынок). Тестирование и прототипирование — внутри стадии разработки.","ref":42},{"q":"Что такое позиционирование по Котлеру?","options":["Размещение товара в каналах сбыта для максимальной видимости","Действия по обеспечению товару конкурентоспособного положения в сознании ЦА","Сегментирование рынка и выбор целевых сегментов","Формирование уникального торгового предложения (УТП)"],"correct":1,"expl":"Позиционирование по Котлеру — действия по обеспечению товару конкурентоспособного места именно В СОЗНАНИИ целевой аудитории. Размещение в каналах — мерчандайзинг. Сегментирование — отдельный этап (предшествующий). УТП — инструмент позиционирования.","ref":41},{"q":"Что такое «зонтичный бренд»?","options":["Локализованный бренд для одного региона","Бренд, объединяющий товары разных продуктовых линий или различающихся по назначению","Бренд-лидер в категории, под который выпускают суббренды","Премиальный бренд внутри широкого портфеля компании"],"correct":1,"expl":"Зонтичный бренд объединяет под одним именем товары разных продуктовых линий или одной линии с разным назначением (например, Samsung — телефоны, телевизоры, техника). Прочие варианты описывают другие стратегии брендинга.","ref":39},{"q":"Что такое брендинг?","options":["Деятельность по регистрации товарных знаков и защите интеллектуальной собственности","Маркетинговая деятельность по созданию долгосрочного предпочтения и лояльности к бренду","Разработка визуальной идентичности и фирменного стиля","Управление коммуникациями для поддержания узнаваемости"],"correct":1,"expl":"Брендинг — это именно маркетинговая деятельность по созданию у ЦА особого отношения, формирующего долгосрочное предпочтение и лояльность. Регистрация знаков, визуальная идентичность и коммуникации — инструменты, а не сам брендинг.","ref":43},{"q":"Что такое репутация (в отличие от имиджа)?","options":["Образ, который компания целенаправленно продвигает","Общее мнение о достоинствах и недостатках, складывающееся из реальных действий и фактов","Эмоциональное восприятие бренда аудиторией","Совокупность визуальных и вербальных атрибутов компании"],"correct":1,"expl":"Репутация именно формируется из реальных действий и фактов — этим она объективнее имиджа (целенаправленно создаваемого образа). Эмоциональное восприятие и атрибуты — части имиджа.","ref":65},{"q":"Имидж присущ:","options":["только крупным компаниям, инвестирующим в PR","любому публичному объекту, независимо от того, занимается ли он его формированием","только тем организациям, которые активно работают со СМИ","только успешным брендам с устойчивой репутацией"],"correct":1,"expl":"Имидж присущ любому публичному объекту (человеку, компании, товару, городу, государству) независимо от того, занимается он его формированием или нет. Если не управлять имиджем — он сложится стихийно.","ref":67},{"q":"Репозиционирование бренда происходит в рамках:","options":["рестайлинга визуальных атрибутов","ребрендинга / изменения позиционирования","расширения товарной линейки","трансформации бизнес-модели"],"correct":1,"expl":"Репозиционирование — изменение характеристик бренда и закрепление новых в сознании ЦА — рассматривается как ключевой аспект ребрендинга. Рестайлинг касается только визуала. Расширение линейки и бизнес-модель — отдельные процессы.","ref":37},{"q":"Каковы типичные причины ребрендинга?","options":["Рост продаж и расширение клиентской базы","Устаревший стиль, смена стратегии, выход на новые рынки, репутационный кризис","Снижение затрат на маркетинг и оптимизация","Уход с рынка топ-менеджеров и смена команды"],"correct":1,"expl":"Причины ребрендинга: изменение стратегии, выход на новые рынки, устаревший стиль, слияние, репутационный кризис, смена ЦА, отстройка от конкурентов. Рост продаж — не повод, а оптимизация и смена менеджеров — другие задачи.","ref":25},{"q":"Какие задачи решает брендинг?","options":["оптимизация издержек на коммуникации","выделить среди конкурентов, сформировать имидж, повысить доверие, создать эмоциональную связь","увеличить долю рекламного бюджета на digital-каналы","расширить штат маркетингового отдела"],"correct":1,"expl":"Задачи брендинга: выделить компанию среди конкурентов, сформировать имидж, повысить доверие, создать эмоциональную связь, обеспечить единый стиль. Затраты и штат — операционные вопросы, не цели брендинга.","ref":43},{"q":"Кто автор концепции жизненного цикла товара?","options":["Филип Котлер","Теодор Левитт","Питер Друкер","Майкл Портер"],"correct":1,"expl":"Пятиступенчатую модель ЖЦТ предложил Теодор Левитт, работавший в Гарвардской школе бизнеса. Котлер развивал маркетинг-менеджмент и описывал ЖЦТ, но не он автор. Друкер — теоретик менеджмента, Портер — конкурентного анализа.","ref":42},{"q":"Какая стратегия позиционирования делает акцент на отличиях характеристик товара?","options":["позиционирование по выгоде","позиционирование по атрибуту","позиционирование по потребителю","позиционирование по цене"],"correct":1,"expl":"Позиционирование по атрибуту подчёркивает характеристики, отличающие товар от конкурентов (минус — их могут скопировать, нужен патент). По выгоде — описывает то, ЧТО получает покупатель; по потребителю — для какого сегмента; по цене — соотношение цены.","ref":41},{"q":"На чём опирается репутация в отличие от имиджа?","options":["на маркетинговые сообщения и рекламные кампании","на реальные действия и факты","на оценки экспертов и лидеров мнений","на медиа-присутствие и охваты"],"correct":1,"expl":"Репутация именно складывается из реальных действий и фактов. Имидж формируется через сообщения и рекламу — это разные вещи. Оценки экспертов и медиаприсутствие могут влиять на оба, но не определяют их сущности.","ref":65},{"q":"Какие три скоординированных направления важны в управлении репутацией?","options":["мониторинг, аналитика, отчётность","формирование, поддержание, защита","построение, измерение, корректировка","прогнозирование, реагирование, восстановление"],"correct":1,"expl":"В управлении репутацией важны именно эти три направления: формирование (создание), поддержание (постоянная работа), защита (от негатива и кризисов). Прочие варианты описывают другие процессы (аналитика, метрики, антикризис).","ref":65},{"q":"На стадии зрелости жизненного цикла товара компании стараются:","options":["максимизировать охват ЦА и набирать долю рынка","удержать долю рынка и лояльность покупателей","снять товар с производства, перенаправив ресурсы","выйти на новые географические рынки"],"correct":1,"expl":"На зрелости темпы роста замедляются, рынок насыщается, конкуренция растёт — компании именно удерживают долю и лояльность. Набор доли — стадия роста, снятие — спад, выход на новые рынки — отдельная стратегия (может продлить ЖЦТ, но это не общая задача).","ref":42},{"q":"Почему ребрендинг не должен быть просто «сменой картинки»?","options":["он должен сопровождаться рекламной кампанией","он должен отражать реальные изменения внутри компании","он должен включать смену юридического названия","он должен быть согласован с регуляторами"],"correct":1,"expl":"Ключевая идея: ребрендинг должен отражать реальные изменения внутри компании, иначе у аудитории возникнет недоверие и ощущение искусственности. Рекламная кампания — следствие; смена названия — необязательна; регуляторы — крайние случаи.","ref":25},{"q":"Какая стратегия позиционирования описывает преимущества покупателя?","options":["по атрибуту","по выгоде","по цене","по условиям использования"],"correct":1,"expl":"Позиционирование по выгоде описывает преимущества, которые получает покупатель от приобретения товара. Атрибут — характеристики продукта; цена — соотношение цены к качеству/конкурентам; условия использования — связка с ситуацией (например, Twix — пауза в работе).","ref":41},{"q":"Имидж по А. Н. Чумикову — это:","options":["воспринятая аудиторией позиция организации","заявленная (идеальная) позиция, которую субъект собирается продвигать","совокупность визуальных и вербальных коммуникаций","эмоциональный отклик аудитории на бренд"],"correct":1,"expl":"По Чумикову, имидж — заявленная (идеальная) позиция, которую субъект собирается продвигать. ЕЙ ПРОТИВОПОСТАВЛЯЕТСЯ репутация как воспринятая позиция (то, что реально осело в сознании). Это ключевое различие в его терминологии.","ref":68},{"q":"Что относится к механизмам формирования репутации?","options":["частота упоминаний и тональность в СМИ","отношение к клиентам, политика компании, профессионализм, финансовая стабильность","количество подписчиков в социальных сетях","узнаваемость логотипа и фирменного стиля"],"correct":1,"expl":"Механизмы репутации — это реальные характеристики: отношение к клиентам, политика, позиционирование, профессионализм, финансовая стабильность, участие в соцакциях. Упоминания и узнаваемость — индикаторы имиджа, а не механизмы репутации.","ref":65},{"q":"Чем визуальный сторителлинг отличается от обычной картинки?","options":["использует более качественную графику","разворачивает сюжет с героем, ситуацией, конфликтом и выводом","всегда содержит логотип бренда","предназначен только для социальных сетей"],"correct":1,"expl":"Визуальный сторителлинг не просто показывает объект, а разворачивает сюжет: герой, ситуация, проблема/конфликт, развитие, смысловой вывод. Качество графики, логотип и канал распространения — несущественные характеристики.","ref":88}]},{"category":"Маркетинг","questions":[{"q":"Что такое сегментация рынка?","options":["анализ конкурентного окружения и доли рынка","разделение общего рынка на однородные группы потребителей со схожими потребностями","классификация товаров по категориям и подкатегориям","выбор приоритетных каналов сбыта продукции"],"correct":1,"expl":"Сегментация — разделение рынка на группы потребителей со схожими потребностями, поведением, характеристиками. Цель — точнее нацеливать продукт, цену, продвижение. Анализ конкурентов, классификация товаров и выбор каналов — другие задачи.","ref":40},{"q":"В каком порядке идут этапы цикла Деминга (PDCA)?","options":["Plan → Do → Check → Act","Plan → Check → Do → Act","Do → Check → Act → Plan","Plan → Act → Do → Check"],"correct":0,"expl":"PDCA = Plan (Планируй) → Do (Делай) → Check (Проверяй) → Act (Действуй). Цикл непрерывного улучшения У. Деминга, основанный на идеях У. Шухарта. Это итеративная модель — после Act начинается новый Plan.","ref":44},{"q":"Что НЕ относится к демографическим критериям сегментации?","options":["возраст и пол","уровень дохода","стиль жизни и ценности","образование и профессия"],"correct":2,"expl":"Стиль жизни и ценности — это психографические критерии. К демографии относятся: возраст, пол, доход, образование, семейное положение, профессия, размер семьи, национальность.","ref":33},{"q":"Целевая аудитория в маркетинге — это:","options":["все потенциальные потребители на рынке","группа людей с общими характеристиками, на которых направлены маркетинговые усилия","сегмент с самой высокой покупательной способностью","действующая база лояльных клиентов компании"],"correct":1,"expl":"ЦА в маркетинге — группа людей с общими характеристиками, на которых направлены рекламные усилия и сообщения. Это НЕ все потребители (все — это рынок), не только самые богатые (могут быть и эконом-сегменты) и не только текущие клиенты.","ref":32},{"q":"Выборка, анкета/интервью и анализ результатов — это элементы:","options":["маркетингового исследования","социологического исследования","медиамониторинга","психографического профилирования"],"correct":1,"expl":"Эти 4 элемента — основа социологического исследования: выборка (репрезентативность), анкета или интервью (сбор данных), анализ результатов. Это строгая научная методология, отличающая социсследование от опросов и от других видов исследований.","ref":35},{"q":"На чём основано коммуникативное качество бренда (обещание)?","options":["на ценовой стратегии и каналах сбыта","на способности поддерживать отношения с потребителями, суммируя функциональное, индивидуальное и социальное качество","на объёме рекламных инвестиций и охвате аудитории","на узнаваемости визуальной идентичности"],"correct":1,"expl":"Коммуникативное качество (обещание) основано именно на способности поддерживать отношения, суммируя три типа качества: функциональное (назначение), индивидуальное (ценность для потребителя), социальное (уважение, принадлежность к группе).","ref":38},{"q":"Кто создал цикл PDCA?","options":["Уильям Эдвардс Деминг (на основе идей Шухарта)","Уолтер Шухарт самостоятельно","Питер Друкер","Тайити Оно (Toyota Production System)"],"correct":0,"expl":"PDCA создан Демингом в середине XX века на основе идей Уолтера Шухарта (PDSA). Хотя первоначально идеи сформулировал Шухарт, именно Деминг развил их в целостную методологию. Друкер и Оно — другие направления управленческой мысли.","ref":44},{"q":"Что делают на этапе Plan в цикле PDCA?","options":["внедряют план в малом масштабе для проверки","определяют цели и процессы, анализируют условия и проблемы","оценивают результаты сравнением с целями","масштабируют успешные изменения на всю систему"],"correct":1,"expl":"Plan (Планирование) — определение целей и процессов, анализ текущих условий, идентификация проблем и возможностей, разработка плана действий. Внедрение — этап Do, оценка — Check, масштабирование — Act.","ref":44},{"q":"Как цикл PDCA помогает в маркетинге?","options":["заменяет необходимость традиционных исследований","позволяет тестировать гипотезы и оптимизировать кампании через повторяющиеся итерации","сокращает время на согласование решений","автоматизирует медиапланирование"],"correct":1,"expl":"В маркетинге PDCA помогает именно через итеративность: тестировать гипотезы, оптимизировать кампании, повышать эффективность через повторяющиеся циклы. Не заменяет исследования, а дополняет их. Согласования и автоматизация — другие задачи.","ref":44},{"q":"К какому типу критериев относится «уровень дохода»?","options":["психографическому","демографическому","поведенческому","географическому"],"correct":1,"expl":"Уровень дохода — это демографический критерий (как возраст, пол, образование, семейное положение). Психография — это ценности, стиль жизни, личностные черты. Поведение — отношение к продукту, частота покупок. География — место проживания.","ref":33},{"q":"Какие критерии относятся к психографической сегментации?","options":["возраст, пол, доход, образование","стиль жизни, ценности, тип личности, интересы","география, плотность населения, климат","частота покупок, лояльность, повод для покупки"],"correct":1,"expl":"Психография — это стиль жизни, ценности, тип личности, интересы и увлечения. Первый список — демография, третий — география, четвёртый — поведенческая сегментация.","ref":33},{"q":"Чем социологическое исследование отличается от случайных опросов?","options":["использует только закрытые вопросы","строгой методологией и репрезентативной выборкой","проводится только в академической среде","результаты не публикуются открыто"],"correct":1,"expl":"Социсследование отличается именно строгой методологией и опорой на репрезентативную выборку (мини-модель общества), что позволяет делать достоверные обобщения. Тип вопросов, среда и публикация — частные особенности конкретных исследований.","ref":35},{"q":"Для чего нужна выборка в социологическом исследовании?","options":["сократить расходы на сбор данных","обеспечить, чтобы мини-модель точно отражала всё изучаемое общество","ускорить процесс обработки результатов","получить количественные данные вместо качественных"],"correct":1,"expl":"Главная задача выборки — репрезентативность: мини-модель должна точно отражать всё изучаемое общество, иначе выводы будут ложными (даже на большой выборке). Экономия и скорость — побочные эффекты, а не цель.","ref":35},{"q":"Какие качества бренда суммирует коммуникативное качество (обещание)?","options":["рекламное, медийное, цифровое","функциональное, индивидуальное и социальное качество","ценовое, ассортиментное, сервисное","эмоциональное, рациональное, эмпирическое"],"correct":1,"expl":"Коммуникативное качество объединяет именно функциональное (назначение/выполнение задачи), индивидуальное (ценность для конкретного потребителя), социальное (уважение, принадлежность). Прочие списки — про каналы, маркетинг-микс или типы сообщений.","ref":38},{"q":"На какой стадии жизненного цикла товара компания решает обновить продукт или снять его с производства?","options":["на стадии зрелости","на стадии спада","на стадии внедрения","на стадии разработки"],"correct":1,"expl":"Именно на стадии спада продажи снижаются, интерес падает — и компания принимает решение: либо обновить товар (продлить ЖЦТ), либо снять с производства. На зрелости — удерживают долю; на внедрении и разработке — выводят на рынок.","ref":42}]},{"category":"Интегрированные коммуникации","questions":[{"q":"Что такое интегрированные маркетинговые коммуникации (ИМК)?","options":["централизованное управление маркетингом компании","согласованное использование всех коммуникационных инструментов в единой системе","объединение рекламного и PR-бюджетов","автоматизация всех маркетинговых процессов"],"correct":1,"expl":"ИМК — концепция именно согласованного использования всех инструментов (реклама, PR, стимулирование сбыта, личные продажи, бренд-коммуникации) в единой системе, передающих единые сообщения. Не централизация управления и не объединение бюджетов.","ref":31},{"q":"Какой эффект является ключевой целью ИМК?","options":["оптимизация маркетингового бюджета","синергетический эффект от согласованных каналов","максимальный охват аудитории","персонализация коммуникаций"],"correct":1,"expl":"Ключевая цель ИМК — именно синергетический эффект: координация каналов усиливает совокупное воздействие, и сумма больше слагаемых. Оптимизация бюджета, охват и персонализация — производные выгоды, но не суть концепции.","ref":31},{"q":"Что из перечисленного НЕ является инструментом интегрированных коммуникаций?","options":["связи с общественностью (PR)","бухгалтерский и налоговый учёт","стимулирование сбыта","прямой маркетинг (direct)"],"correct":1,"expl":"Учёт не входит в ИМК. Инструменты ИМК: реклама, PR, стимулирование сбыта, прямой маркетинг, личные продажи, digital, SMM, event-маркетинг, спонсорство, бренд-коммуникации.","ref":27},{"q":"Что необходимо проанализировать при построении стратегии ИМК?","options":["только бюджет и конкурентов","SWOT, ЦА, текущие коммуникации, конкурентов, точки контакта","только аудиторию и продукт","финансовые показатели за последние 3 года"],"correct":1,"expl":"При построении ИМК анализируется комплекс: положение компании (SWOT), ЦА, текущие коммуникации, результаты, конкуренты, точки контакта с клиентом. Узкий анализ только бюджета или только аудитории недостаточен.","ref":46},{"q":"Какой вид коммуникаций лучше использовать для информирования приоритетных целевых аудиторий?","options":["широкую массовую рекламу через ТВ и наружку","прямые и персонализированные коммуникации (direct, CRM, таргетинг)","вирусный маркетинг и user-generated content","спонсорство крупных мероприятий"],"correct":1,"expl":"Для приоритетных ЦА эффективны именно прямые персонализированные коммуникации: direct-маркетинг, CRM, таргетированная digital-реклама, личные продажи. Массовая реклама и виральность — для широкого охвата, спонсорство — для имиджа.","ref":76},{"q":"В чём сущность ИМК как концепции?","options":["в максимальном количестве каналов коммуникации","в координации и интеграции инструментов, где каждый контакт усиливает другой","в выборе одного главного канала и концентрации на нём","в равномерном распределении бюджета между каналами"],"correct":1,"expl":"Сущность ИМК — не набор отдельных мероприятий и не максимальное количество каналов, а именно их координация и интеграция: каждый контакт с потребителем усиливает другой, формируя целостный образ бренда.","ref":31},{"q":"Что относится к event-коммуникациям в составе ИМК?","options":["рассылки и push-уведомления","организация мероприятий, выставок, презентаций, спонсорство","реклама в местах продаж","телефонные продажи и обзвоны"],"correct":1,"expl":"Event-коммуникации (событийный маркетинг) — именно организация специальных мероприятий, выставок, презентаций и спонсорских проектов как инструмента прямого взаимодействия. Прочие варианты — direct, BTL, personal selling.","ref":27},{"q":"Что анализируют через SWOT при построении стратегии ИМК?","options":["возрастные группы и демографию ЦА","сильные и слабые стороны компании, возможности и угрозы внешней среды","медиаканалы и их стоимость","конкурентные преимущества по 5 силам Портера"],"correct":1,"expl":"SWOT — это именно Strengths/Weaknesses (внутренние сильные и слабые стороны) и Opportunities/Threats (внешние возможности и угрозы). Демография — отдельный анализ, медиаканалы — медиапланирование, 5 сил Портера — другая модель.","ref":46}]},{"category":"Различия PR, маркетинга, рекламы","questions":[{"q":"Чем реклама принципиально отличается от PR?","options":["реклама работает с большим охватом, PR — с узкими аудиториями","реклама — платная коммуникация с прямым призывом, PR — формирование доверия без прямой оплаты размещения","реклама эмоциональна, PR — рационален","реклама работает с потребителями, PR — со СМИ"],"correct":1,"expl":"Главное различие — в платности и характере: реклама всегда платная с прямым призывом «купи». PR — материалы СМИ публикуют бесплатно, если инфоповод интересен, и работают с доверием в долгую. Охват, эмоции и аудитории — производные.","ref":28},{"q":"На какой вопрос отвечает маркетинг?","options":["«Как заставить купить здесь и сейчас?»","«Что и для кого производить?»","«Почему этой компании доверять в долгую?»","«Через какие каналы общаться с аудиторией?»"],"correct":1,"expl":"Маркетинг — стратегия, отвечающая на «что и для кого производить?». Реклама — «как заставить купить прямо сейчас?». PR — «почему доверять в долгую?». Каналы — это инструменты, а не вопрос стратегии.","ref":28},{"q":"Что включает в себя маркетинг как система?","options":["только продажи и работу с клиентами","анализ рынка, ЦА, позиционирование, ценообразование, ассортимент, каналы сбыта (включая рекламу и PR)","рекламу, PR и SMM как основные направления","брендинг и коммуникационную стратегию"],"correct":1,"expl":"Маркетинг — широкая стратегическая система, включающая анализ рынка, выбор ЦА, позиционирование, ценообразование, ассортимент, каналы сбыта. Реклама и PR — его инструменты, а не равноправные части. Брендинг — направление внутри маркетинга.","ref":28}]},{"category":"Спонсорство и исследования","questions":[{"q":"Чем спонсорство отличается от благотворительности?","options":["спонсорство всегда дороже благотворительности","спонсорство предполагает встречную рекламу спонсора, благотворительность — безвозмездна","спонсорство адресовано бизнесу, благотворительность — частным лицам","спонсорство регулируется налоговым кодексом, благотворительность — нет"],"correct":1,"expl":"По ст. 19 ФЗ-38 спонсорский вклад признаётся платой за рекламу — это взаимовыгодное сотрудничество. Благотворительность по ФЗ-1995 — безвозмездная передача без обязательств. Сумма, адресат и налоги — несущественные различия.","ref":29},{"q":"Деятельность на безвозмездной основе без финансовых обязательств получателя — это:","options":["спонсорство","благотворительность","меценатство","корпоративная социальная ответственность"],"correct":1,"expl":"Благотворительность по ФЗ-135 «О благотворительной деятельности» — добровольная безвозмездная передача имущества/средств без обязательств получателя. Спонсорство возмездно (за рекламу). Меценатство — поддержка искусства. КСО — широкая концепция.","ref":71},{"q":"По типу данных маркетинговые исследования делятся на:","options":["платные и бесплатные","количественные и качественные","устные и письменные","полевые и кабинетные"],"correct":1,"expl":"По типу данных — именно количественные (числовые, статистика: опросы, веб-аналитика) и качественные (мотивы, причины: интервью, фокус-группы). Полевые/кабинетные — по способу сбора (первичные/вторичные), это другая классификация.","ref":26},{"q":"Когда проводится pre-testing в рекламных исследованиях?","options":["после окончания кампании","до запуска рекламы для оценки сообщения и снижения риска","в середине кампании для оптимизации","через год после кампании"],"correct":1,"expl":"Pre-testing (предварительные исследования) проводят именно ДО запуска: тестируют рекламное сообщение, понятность, запоминаемость, эмоции. После — это post-testing, в середине — сопровождающие исследования.","ref":26},{"q":"Чем количественные исследования отличаются от качественных?","options":["количественные дороже и точнее","количественные дают измеримые числа, качественные — понимание причин и мотивов","количественные используются только в B2C, качественные — в B2B","количественные — для запуска продукта, качественные — для поддержания"],"correct":1,"expl":"Главное различие в типе данных: количественные дают измеримые числа (% потребителей, рейтинги), качественные — глубинное понимание причин, мотивов, инсайтов. Стоимость, отрасль и стадия — не определяющие различия.","ref":26},{"q":"Какова роль коммуникаций в создании бренда?","options":["вспомогательная, технического характера","центральная и стратегическая — бренд формируется в сознании именно через коммуникацию","связана только с этапом выхода на рынок","ограничивается визуальной идентичностью"],"correct":1,"expl":"Роль коммуникаций центральна: бренд — это устойчивый образ и репутация, которые формируются ИСКЛЮЧИТЕЛЬНО в сознании потребителя через коммуникацию. Без коммуникации нет бренда, есть только продукт.","ref":30},{"q":"Когда проводится post-testing в рекламных исследованиях?","options":["до запуска кампании","вместо проведения кампании при отсутствии бюджета","после завершения кампании для оценки результата","в момент пиковой активности кампании"],"correct":2,"expl":"Post-testing проводится именно после кампании для оценки её эффекта: узнаваемость, изменение отношения, влияние на продажи. До запуска — pre-testing, в момент пика — это сопровождающие исследования.","ref":26},{"q":"Какое преимущество получают компании от благотворительности и спонсорства?","options":["прямой рост выручки в краткосрочной перспективе","репутационное преимущество и улучшение имиджа","налоговые льготы по всем направлениям","эксклюзивный доступ к госконтрактам"],"correct":1,"expl":"Главная выгода — именно репутационное преимущество, улучшение имиджа, благосклонность общества и власти. Прямого роста выручки спонсорство и благотворительность обычно не дают, налоговые льготы есть, но ограничены, госконтракты не гарантированы.","ref":29},{"q":"Как ФЗ «О рекламе» определяет спонсорский вклад?","options":["как пожертвование","как плату за рекламу","как инвестицию в социальные проекты","как маркетинговый расход без определения"],"correct":1,"expl":"По ст. 19 ФЗ-38 спонсорский вклад признаётся именно платой за рекламу, а спонсор и спонсируемый — рекламодателем и рекламораспространителем. Это принципиально отличает спонсорство от пожертвований и инвестиций.","ref":29}]},{"category":"Реклама","questions":[{"q":"Что означает формула AIDA в копирайтинге?","options":["Awareness, Image, Decision, Acquisition","Attention, Interest, Desire, Action","Audience, Insight, Differentiation, Approach","Analysis, Inspiration, Design, Activation"],"correct":1,"expl":"AIDA: Attention (внимание) → Interest (интерес) → Desire (желание) → Action (действие). Это классическая схема продающего текста, по которой нужно последовательно провести покупателя. Прочие аббревиатуры — придуманные дистракторы.","ref":83},{"q":"Какая основная цель у стимулирующей рекламы?","options":["долгосрочное формирование лояльности к бренду","активизация спроса и побуждение к покупке здесь и сейчас","напоминание о существовании бренда","подкрепление выбора после совершения покупки"],"correct":1,"expl":"Стимулирующая реклама направлена именно на конкретную реакцию в ближайшее время: купить, заказать, перейти. Примеры — «скидка до 15 мая», «2 по цене 1». Долгосрочная лояльность — имиджевая реклама, напоминание — напоминающая, подкрепление — подкрепляющая.","ref":60},{"q":"Что предполагает ATL-реклама?","options":["прямые продажи через личное взаимодействие","массовое воздействие через ТВ, радио, прессу, наружную рекламу","нативное размещение у блогеров и инфлюенсеров","BTL-активности и промо в местах продаж"],"correct":1,"expl":"ATL (Above The Line) — реклама с массовым охватом и низкой персонализацией: ТВ, радио, пресса, наружка, транспорт. BTL — наоборот, точечные активности (промо, директ, события). Личные продажи и инфлюенсеры — другие инструменты.","ref":34},{"q":"Что НЕ относится к визуальному сторителлингу?","options":["серия фотографий, рассказывающая историю","рекламный видеоролик с сюжетом","обычное фото товара на белом фоне","комикс или иллюстрированная история"],"correct":2,"expl":"Визуальный сторителлинг — это сюжет с героем, ситуацией, конфликтом и развитием. Простое фото товара на белом фоне — это визуальный контент, но без истории. Серия фото, ролик с сюжетом и комикс — все они разворачивают повествование.","ref":88},{"q":"Что содействует лаконичности рекламного текста?","options":["развёрнутые объяснения с обилием деталей","короткие предложения, активный залог, императивы","использование специализированной терминологии","многоуровневые сложные предложения с придаточными"],"correct":1,"expl":"Лаконичность достигается короткими предложениями, активным залогом («Купите!»), императивами и сильными словами. Активный залог короче пассивного, императивы создают непосредственный призыв. Сложные конструкции и терминология делают текст тяжёлым.","ref":84},{"q":"Как закон 38-ФЗ определяет рекламу?","options":["платное размещение коммерческой информации в СМИ","информация любым способом, адресованная неопределённому кругу лиц, для привлечения внимания к объекту","коммуникация с целью побуждения к покупке","сообщение от рекламодателя к рекламораспространителю"],"correct":1,"expl":"По ст. 3 ФЗ-38, реклама — информация, распространённая любым способом, в любой форме, адресованная НЕОПРЕДЕЛЁННОМУ кругу лиц, для привлечения внимания к объекту рекламирования и его продвижения. Платность и СМИ — не обязательные признаки.","ref":61},{"q":"Для каких жанров медиатекстов характерны взвешенность фактов, доказательность и чёткая авторская позиция?","options":["информационные жанры","аналитические жанры (статья, обзор, рецензия)","художественно-публицистические жанры","новостные жанры"],"correct":1,"expl":"Аналитические жанры (статья, обзор, рецензия, комментарий, расследование) требуют доказательности и авторской позиции. Информационные/новостные — оперативное и нейтральное сообщение факта. Художественно-публицистические — образность, эмоциональность.","ref":85},{"q":"Что требуется для успешного рекламного текста?","options":["максимальное использование терминологии для повышения экспертности","УТП, ориентация на ЦА, лаконичность, призыв к действию (CTA), достоверность","максимально подробное описание характеристик продукта","эмоциональный накал и яркие метафоры на каждой строке"],"correct":1,"expl":"Успешный текст: чёткая цель и ЦА, УТП с аргументацией, лаконичность, оригинальность, CTA, достоверность и соответствие закону. Чрезмерная терминология, перечисление характеристик или эмоциональный перегруз — типичные ошибки.","ref":86},{"q":"В чём специфика сторителлинга в B2B (в отличие от B2C)?","options":["короткий цикл сделки и эмоциональное вовлечение","фокус на цифрах, ROI, кейсах и бизнес-результатах при длительном цикле сделки","массовая аудитория и развлекательный характер","брендинг через узнаваемость героя и эмоций"],"correct":1,"expl":"B2B-сторителлинг ориентирован на ЛПР и экспертов, делает акцент на цифрах, метриках, ROI, кейсах и бизнес-результатах при длительном цикле сделки. Короткий цикл, массовость и эмоции — характерны для B2C.","ref":87},{"q":"В каком виде рекламы чаще всего используется сторителлинг?","options":["в баннерной поисковой рекламе","в видеорекламе и имиджевых роликах","в SEO-оптимизированных текстах","в наружной рекламе на билбордах"],"correct":1,"expl":"Сторителлинг чаще всего применяется в видеорекламе и имиджевых роликах: видеоформат позволяет за 30-40 секунд развернуть сюжет с героем и эмоциональным финалом. Баннеры, SEO и билборды слишком статичны и кратки для полноценной истории.","ref":89},{"q":"Что такое стимулирующая реклама по своей цели?","options":["формирование долгосрочного имиджа бренда","побуждение к покупке или целевому действию в ближайшее время","напоминание о существующем продукте","убеждение в правильности уже сделанного выбора"],"correct":1,"expl":"Стимулирующая реклама побуждает к покупке/действию в ближайшее время, стимулируя спрос. Долгосрочный имидж — имиджевая реклама, напоминание — напоминающая, убеждение в правильности выбора после покупки — подкрепляющая.","ref":60},{"q":"Что такое ключевое сообщение рекламной кампании?","options":["главный слоган, который не меняется на протяжении кампании","система информационных элементов («конструктор»), из которых под ситуацию создаются обращения","заголовок главного рекламного материала","юридически согласованная формулировка о продукте"],"correct":1,"expl":"Ключевое сообщение — это система элементов («конструктор»), из которых под ситуацию, канал и ЦА создаются конкретные обращения. Это не один слоган, не заголовок и не юридическая формулировка — это вариативная стратегическая система.","ref":59},{"q":"Что означает буква D в формуле AIDA?","options":["Differentiation (отстройка)","Desire (желание)","Demand (спрос)","Decision (решение)"],"correct":1,"expl":"D в AIDA — Desire (желание): акцент на выгодах для клиента, почему ему нужен этот продукт. Дистракторы — реальные маркетинговые понятия, но не из формулы AIDA.","ref":83},{"q":"Откуда происходит термин ATL (Above The Line)?","options":["из военной стратегии XX века","из бухгалтерской практики 1950-х, где медийные расходы отделяли линией","из методологии Procter & Gamble 1980-х","из академического маркетинга 1960-х"],"correct":1,"expl":"ATL («над чертой») происходит именно из бухгалтерской практики 1950-х: расходы на массовые медиа отделяли линией от других маркетинговых затрат в финотчётах. Не из военной стратегии или академии.","ref":34},{"q":"Что относится к визуальному сторителлингу?","options":["логотип бренда сам по себе","серия фото с сюжетом, видеоролик с историей, комикс с развитием действия","фирменные цвета и шрифты","статичный портрет основателя компании"],"correct":1,"expl":"К визуальному сторителлингу относится всё, где разворачивается сюжет: серия фото с сюжетом, видеоролик с историей, комикс. Логотип, цвета, шрифты и статичный портрет — элементы фирменного стиля без повествования.","ref":88},{"q":"Какие три типа коммуникационных сообщений выделяют в комплексной коммуникации?","options":["рекламное, PR, маркетинговое","рациональное, эмоциональное, эмпирическое","устное, письменное, визуальное","короткое, среднее, длинное"],"correct":1,"expl":"Три типа сообщений: рациональное (факты, доводы), эмоциональное (ценности бренда), эмпирическое (потребительский опыт — вкус, запах, ощущения). Они работают в комплексе, формируя целостный образ. Прочие классификации — про каналы и форматы.","ref":59},{"q":"Какие метрики измеряют эффективность ATL-кампаний?","options":["CTR, CPC, конверсия","Reach (охват), Frequency (частота), GRP, Brand Awareness","CPL, CPA, ROAS","Engagement Rate, Reach, Saves"],"correct":1,"expl":"Для ATL — Reach (охват), Frequency (частота контактов), GRP (совокупный рейтинг), Brand Awareness (узнаваемость). CTR/CPC/CPA — метрики performance-кампаний в digital; ER и Saves — метрики SMM. Это разные парадигмы.","ref":34},{"q":"Какие способы помогают достичь лаконичности рекламы?","options":["добавление поясняющих деталей и контекста","фокус на главном, сильные слова, визуальные элементы, цифры","максимальная информативность сообщения","использование сложных профессиональных терминов"],"correct":1,"expl":"Лаконичность: фокус на главном, сильные слова, визуальные элементы (быстрее текста), призывы к действию, эллиптические конструкции, цифры. Детали, информативность и термины — наоборот, утяжеляют текст.","ref":84},{"q":"Для каких товаров оптимальна ATL-реклама?","options":["сложных B2B-решений с длительным циклом","товаров массового спроса (FMCG) и для быстрого масштабирования знания о бренде","нишевых премиальных продуктов","услуг по подписке с автопродлением"],"correct":1,"expl":"ATL оптимальна для товаров массового спроса (FMCG), быстрого масштабирования знания о бренде, запуска в новых категориях. Сложные B2B-решения и ниши требуют точечного контента, подписки — performance и retention-маркетинг.","ref":34},{"q":"Какой тип сообщения передаёт потребительский опыт (вкус, запах, ощущения)?","options":["рациональное","эмоциональное","эмпирическое","ассоциативное"],"correct":2,"expl":"Эмпирическое сообщение передаёт именно потребительский опыт, демонстрируя осязаемый мир бренда: запах, вкус, текстуру, звук. Рациональное — про факты, эмоциональное — про ценности и чувства. «Ассоциативное» — не из этой классификации.","ref":59},{"q":"Какой формат рекламного текста использует императивы вроде «Купите!»?","options":["научно-популярный","рекламный, для лаконичности и прямого призыва","юридический","художественный"],"correct":1,"expl":"Императивы создают эффект непосредственного обращения и повышают убедительность при минимальном объёме — это характерно именно для рекламного текста. Научный, юридический и художественный стили избегают прямых призывов.","ref":84},{"q":"Какой тип сторителлинга наиболее убедителен в B2B?","options":["сказочно-метафорическая история","кейс-история (Case Study) с конкретными результатами клиента","анекдотическая короткая история","персональная драматическая история"],"correct":1,"expl":"В B2B наиболее убедительна кейс-история (Case Study): «клиент столкнулся с проблемой Y, решение Z, результат +N%». Это сочетает нарратив и доказательную базу. Сказочные, анекдотические и драматические форматы — для B2C.","ref":87}]},{"category":"Коммуникации и тексты","questions":[{"q":"Что такое слоган?","options":["развёрнутое описание миссии компании","короткая фраза-девиз с главным сообщением бренда","официальное название бренда в юридических документах","обязательный элемент любого пресс-релиза"],"correct":1,"expl":"Слоган — короткая фраза-девиз с главным сообщением бренда (например, «Just Do It» Nike). Это не миссия (она развёрнутая), не название (это нейминг) и не часть пресс-релиза.","ref":18},{"q":"Чем нарратив отличается от сторителлинга?","options":["нарратив — это эмоция, сторителлинг — структура","нарратив — структура (каркас) повествования, сторителлинг — техника его подачи","нарратив используется в кино, сторителлинг — в текстах","нарратив длинный, сторителлинг короткий"],"correct":1,"expl":"Нарратив — структурированный каркас повествования (что произошло, в какой последовательности). Сторителлинг — техника подачи каркаса с эмоциональным вовлечением. Сторителлинг практически реализует нарратив. Прочие различия — мифы.","ref":108},{"q":"Что такое контент в маркетинге и коммуникациях?","options":["исключительно текстовые материалы","любой информационный продукт (текст, фото, видео, аудио, интерактив)","только видео и графика","рекламные сообщения, размещаемые в медиа"],"correct":1,"expl":"Контент — любой информационный продукт, создаваемый и распространяемый через медиа-каналы: тексты, изображения, видео, аудио, интерактивные элементы. Сводить его только к одному формату или к рекламе — ошибка.","ref":82},{"q":"Что такое UGC-контент?","options":["контент от лидеров мнений, оплаченный брендом","контент, создаваемый самими пользователями (комментарии, отзывы, фото, обзоры)","контент, генерируемый алгоритмами на основе пользовательских данных","официальные ответы поддержки на запросы пользователей"],"correct":1,"expl":"UGC (User-Generated Content) — материалы, создаваемые самими посетителями/потребителями: комментарии, отзывы, обзоры, фото, видео. Ценен естественностью. Контент инфлюенсеров — это influencer marketing, алгоритмический — AI-generated.","ref":82},{"q":"Что такое коммуникация?","options":["устный диалог между двумя или более людьми","процесс передачи информации от одного человека к другому по каналам связи посредством общей системы знаков","способ публичного выступления","взаимодействие в социальных сетях"],"correct":1,"expl":"Коммуникация — процесс передачи информации между людьми по каналам связи посредством общей системы знаков. Это широкое определение, включающее устную, письменную, невербальную, массовую, межличностную, цифровую и другие виды.","ref":79},{"q":"На какой вопрос отвечает модель коммуникации Г. Лассуэлла?","options":["«Зачем коммуникация состоялась?»","«Кто — что — по какому каналу — кому — с каким эффектом?»","«Какова цель сообщения и его эффект?»","«Каков контекст и обратная связь?»"],"correct":1,"expl":"Модель Лассуэлла: «Who says What to Whom in Which channel with What effect». Достоинство — развёрнутый план акта; недостаток — монологичность, нет учёта обратной связи. Прочие вопросы — из других моделей коммуникации.","ref":79},{"q":"Что такое креативность как характеристика?","options":["умение быстро находить решения нестандартных задач","уровень творческой одарённости как устойчивая характеристика личности","способность к работе в команде над творческими проектами","набор приобретённых навыков в искусстве и дизайне"],"correct":1,"expl":"Креативность — именно уровень творческой одарённости, устойчивая характеристика личности, способность создавать новое нетрадиционными способами. Компоненты: оригинальность, утилитарность, конфликт. Это не просто скорость или навыки.","ref":78},{"q":"Графический способ быстрой передачи сложной информации схемами и рисунками — это:","options":["сторителлинг","инфографика","визуальный нейминг","брендбук"],"correct":1,"expl":"Инфографика — графический способ быстрой и чёткой передачи сложной информации с помощью схем и рисунков. Сторителлинг — повествование. Нейминг — создание имени. Брендбук — руководство по фирменному стилю.","ref":73},{"q":"По какому каналу передаются слухи?","options":["по официальным корпоративным каналам","по неформальному межличностному каналу («сарафанное радио», grapevine)","только по цифровым мессенджерам","через лидеров общественного мнения"],"correct":1,"expl":"Слухи передаются по неформальному межличностному каналу (grapevine, «сарафанное радио»). Высокая скорость, но искажения. Официальные каналы — для проверенной информации. Мессенджеры — лишь часть, лидеры мнений — отдельная роль.","ref":74},{"q":"Что чаще всего НЕ отображается в контент-плане?","options":["дата и время публикации","полные готовые тексты постов","формат контента и канал размещения","ответственный за публикацию"],"correct":1,"expl":"В контент-плане обычно нет полных готовых текстов — это документ для планирования, а не хранения контента. Готовые материалы хранят отдельно. План содержит: дату, тему, формат, канал, ответственного, статус, KPI.","ref":53},{"q":"Что такое «вовлечение» (engagement) в соцсетях?","options":["количество подписчиков на странице","любое действие сверх простого просмотра — взаимодействие в ответ на контент","объём публикуемого контента в месяц","затраты на продвижение публикаций"],"correct":1,"expl":"Вовлечение — любое действие, выходящее за рамки простого воздействия (exposure), подразумевающее взаимодействие в ответ на контент: лайк, комментарий, репост, сохранение, переход, реакция. Подписчики и бюджет — другие метрики.","ref":54},{"q":"Зачем заранее знакомиться со списком вопросов перед интервью?","options":["чтобы отказаться от неудобных вопросов","для качественной подготовки, контроля над беседой и содержательности интервью","для подготовки заведомо ложных ответов","чтобы согласовать материал с PR-службой"],"correct":1,"expl":"Главная цель — определить цель беседы, собрать информацию, продумать последовательность, предугадать реакцию, сохранить контроль над интервью. Отказ от вопросов и согласование — частные практики, не цель ознакомления.","ref":77},{"q":"К какому типу относится контент по назначению?","options":["короткий, средний, длинный","коммерческий, информационный, развлекательный","платный и бесплатный","для новых клиентов и для лояльных"],"correct":1,"expl":"По назначению: коммерческий (продающий), информационный (полезный, обучающий), развлекательный (вовлекающий). Прочие классификации — по объёму, стоимости и сегментам ЦА.","ref":82},{"q":"Что такое уникальный контент?","options":["контент с высокой стоимостью производства","контент без аналогов, с уникальным способом передачи информации","эксклюзивный контент только для платных подписчиков","контент, защищённый авторским правом"],"correct":1,"expl":"Уникальный контент не имеет аналогов; даже если информация не эксклюзивна, способ её передачи уникален. Важен для ранжирования в поиске. Стоимость, эксклюзивность подписки и защита авторским правом — не определяющие признаки.","ref":82},{"q":"Кто разработал линейную модель коммуникации (передатчик → канал → приёмник)?","options":["Гарольд Лассуэлл","Клод Шеннон и Уоррен Уивер","Роман Якобсон","Чарльз Осгуд и Уилбур Шрамм"],"correct":1,"expl":"Линейную модель разработали Шеннон и Уивер в 1949 г. для описания телефонной связи. Учитывает шум, но без обратной связи. Лассуэлл — формула «5W». Якобсон — функциональная модель. Осгуд и Шрамм — модель с обратной связью.","ref":79},{"q":"В какой модели коммуникации впервые учтён принцип обратной связи?","options":["в модели Лассуэлла","в модели Шеннона-Уивера","в модели Осгуда-Шрамма","в модели Якобсона"],"correct":2,"expl":"Достоинство модели Осгуда-Шрамма — именно учёт принципа обратной связи, в отличие от линейных монологичных моделей (Лассуэлла и Шеннона-Уивера). Якобсон выделил функции языка, но обратная связь — это Осгуд-Шрамм.","ref":79},{"q":"Какие уровни креативности включает модель «4C»?","options":["слабая, средняя, сильная, исключительная","mini-c (личная), little-c (бытовая), Pro-C (профессиональная), Big-C (великая)","начинающий, средний, продвинутый, эксперт","детская, юношеская, зрелая, поздняя"],"correct":1,"expl":"Модель «4C»: mini-c (субъективные открытия), little-c (бытовая), Pro-C (профессиональная), Big-C (великая, меняющая культуру). Это качественные различия, а не просто уровни мастерства или возраста.","ref":78},{"q":"Что такое дивергентное мышление?","options":["поиск единственно верного решения проблемы","генерирование множества идей из одной проблемы","последовательное решение задач шаг за шагом","мышление через ассоциации и метафоры"],"correct":1,"expl":"Дивергентное мышление — именно генерирование множества идей из одной проблемы. В отличие от конвергентного, ориентированного на поиск ЕДИНСТВЕННОГО верного решения. Последовательное и ассоциативное — другие характеристики мышления.","ref":78},{"q":"Что значит «мультимедийный» материал?","options":["длинный и подробный текст","материал, сочетающий два и более формата (текст + видео + фото)","материал, опубликованный сразу в нескольких каналах","видео с субтитрами"],"correct":1,"expl":"Мультимедийный материал представлен в разных форматах одновременно — например, текст с видео и инфографикой. Длинный текст — лонгрид. Кросс-канальное размещение — омниканальность. Видео с субтитрами — просто видео.","ref":82},{"q":"Что такое «копипаст» в контексте контента?","options":["авторский переработанный материал (рерайт)","наполнение ресурса чужим контентом без переработки (часто признаётся плагиатом)","автоматически сгенерированный контент","повторная публикация собственного контента"],"correct":1,"expl":"Копипаст — наполнение ресурса чужим контентом без переработки. Обычное копирование без разрешения — плагиат; «белый» копипаст требует ссылки на источник. Рерайт — переработка. AI-generation и репост — другие явления.","ref":82},{"q":"Сколько компонентов у модели коммуникации Якобсона?","options":["четыре","шесть","три","пять"],"correct":1,"expl":"Модель Якобсона включает шесть компонентов: адресант, адресат, сообщение, код, контекст, контакт. Каждому соответствует функция языка: экспрессивная, конативная, поэтическая, метаязыковая, референтная, фатическая.","ref":79},{"q":"Что такое беглость как параметр креативности?","options":["скорость, с которой проявляются результаты творчества","количество идей, генерируемых за единицу времени","способность к чёткому изложению идей","степень детализации одной идеи"],"correct":1,"expl":"Беглость — параметр креативности: количество идей за единицу времени. Другие параметры: гибкость (переключение), разработанность (детализация), дивергентное мышление. Чёткость изложения — отдельный навык.","ref":78},{"q":"Чем неформальный канал передачи слухов отличается от официального?","options":["он медленнее, но достовернее","высокой скоростью распространения, но возможным искажением информации","он защищён законом о СМИ","он используется только в кризисных ситуациях"],"correct":1,"expl":"Неформальный канал (сарафанное радио) — высокая скорость, но искажения. Официальные каналы — медленнее, но надёжнее. Защита законом о СМИ касается официальных каналов. Используется не только в кризисах — постоянно.","ref":74}]},{"category":"Digital и SMM","questions":[{"q":"Что такое SMM?","options":["Strategic Market Management — стратегическое управление рынком","Social Media Marketing — продвижение через социальные медиа","Search Marketing Method — метод поискового маркетинга","Sales Management Manual — руководство по управлению продажами"],"correct":1,"expl":"SMM (Social Media Marketing) — направление интернет-маркетинга по продвижению в соцсетях, блогах, форумах, видеохостингах. Прочие аббревиатуры — придуманные дистракторы.","ref":105},{"q":"В чём отличие SERM от ORM?","options":["SERM работает с офлайн-репутацией, ORM — только с онлайн","ORM — управление онлайн-репутацией в целом, SERM — управление только поисковой выдачей","SERM включает все каналы соцсетей, ORM — только сайт","ORM работает с негативом, SERM — с позитивом"],"correct":1,"expl":"ORM (Online Reputation Management) шире — управление репутацией во всём интернете (соцсети, форумы, отзовики, СМИ). SERM (Search Engine Reputation Management) — узко: только результаты поисковой выдачи Яндекс/Google.","ref":118},{"q":"Что такое SEO?","options":["платная контекстная реклама в поисковых системах","оптимизация сайта для роста позиций в поисковой выдаче и органического трафика","анализ конкурентов в поисковой выдаче","техническая настройка серверов для скорости загрузки"],"correct":1,"expl":"SEO (Search Engine Optimization) — комплекс методов оптимизации сайта для повышения позиций в выдаче и роста ОРГАНИЧЕСКОГО (бесплатного) трафика. Контекстная реклама — это SEM/PPC; анализ — лишь часть; техническая настройка — лишь часть SEO.","ref":119},{"q":"Что такое ORM?","options":["управление офлайн-репутацией через работу со СМИ","комплекс мер по формированию положительного образа бренда в сети и нейтрализации негатива","оптимизация рекламных кампаний в digital","анализ метрик в социальных сетях"],"correct":1,"expl":"ORM (Online Reputation Management) — именно комплекс мер по управлению онлайн-репутацией: формирование позитива и нейтрализация негатива во всех онлайн-источниках. Не путать с медиарилейшнз (офлайн), оптимизацией кампаний и аналитикой.","ref":106},{"q":"Что такое OOH-реклама?","options":["реклама в интернете и мобильных приложениях","Out Of Home — наружная реклама вне дома (билборды, транспорт, метро)","реклама через email-рассылки","реклама в офисах и местах продаж"],"correct":1,"expl":"OOH (Out Of Home) — визуальная реклама ВНЕ ДОМА: билборды, остановки, метро, экраны в городе. DOOH — цифровая разновидность. Интернет — не OOH (наоборот, индорная). Email — direct. В местах продаж — POS-материалы.","ref":107},{"q":"Что НЕ относится к инструментам SMM?","options":["таргетированная реклама в соцсетях","короткие вертикальные видео и Stories","печать билбордов и наружные конструкции","чат-боты и посевы у блогеров"],"correct":2,"expl":"Печать билбордов — это OOH/ATL, не SMM. Инструменты SMM: посты, короткие видео, Stories, таргетинг, посевы у блогеров, чат-боты, AR-маски, прямые эфиры.","ref":48},{"q":"Какие цели у диджитал-маркетинга?","options":["только продажи онлайн","рост продаж, привлечение клиентов, узнаваемость, конверсии, удержание","только привлечение трафика на сайт","только сбор данных о пользователях"],"correct":1,"expl":"Цели digital: рост продаж и прибыли, привлечение новых клиентов, узнаваемость, удержание, генерация трафика и конверсии, взаимодействие с аудиторией. Сводить к одной цели — упрощение.","ref":56},{"q":"В каком порядке идут этапы модели pRACE в digital?","options":["Reach → Act → Convert → Engage","Plan → Do → Check → Act","Research → Action → Communicate → Evaluate","Reach → Engage → Act → Convert"],"correct":0,"expl":"RACE в digital (Дейв Чаффи): Reach (охват) → Act (действие) → Convert (конверсия) → Engage (вовлечение/удержание). С предваряющим Planning — pRACE. Это не PDCA и не PR-RACE (Research, Action, Communication, Evaluation).","ref":57},{"q":"Какую информацию дают отчёты Яндекс.Метрики?","options":["только показатели посещаемости","посещаемость, источники трафика, аудиторию, поведение, цели и конверсии, e-commerce","только данные о платных рекламных кампаниях","статистику упоминаний бренда в интернете"],"correct":1,"expl":"Яндекс.Метрика показывает: посещаемость, источники трафика, поисковые запросы, аудиторию, поведение на сайте, цели и конверсии, данные e-commerce. Это не только посещаемость, не только реклама и не упоминания (последнее — медиамониторинг).","ref":51},{"q":"Что такое цифровые спецпроекты?","options":["технические доработки сайтов под мобильные устройства","нестандартные креативные digital-активности (игры, квесты, AR, тесты)","масштабные digital-кампании с большим бюджетом","разовые акции с промокодами и скидками"],"correct":1,"expl":"Спецпроекты — это именно нестандартные креативные активности (мини-игры, квесты, тесты, AR-опыт), которые вовлекают аудиторию, а не просто информируют. Не технические работы, не бюджет и не скидки.","ref":52},{"q":"Что такое ретаргетинг (ремаркетинг)?","options":["перенацеливание рекламной кампании на новую ЦА","возврат пользователей, которые уже взаимодействовали с сайтом, но не совершили целевое действие","настройка таргетинга по интересам и поведению","автоматическая оптимизация ставок в рекламном кабинете"],"correct":1,"expl":"Ретаргетинг — кампании по «возврату» пользователей, ранее посещавших сайт или совершавших действия, но не завершивших покупку. Это не смена ЦА (это ребрифинг), не таргетинг по интересам (это просто таргетинг) и не оптимизация ставок.","ref":58},{"q":"Что такое внутренний сайт (интранет)?","options":["сайт компании для зарегистрированных клиентов","корпоративный ресурс для сотрудников с внутренней информацией","закрытый раздел сайта для партнёров","локальная версия сайта для одного региона"],"correct":1,"expl":"Внутренний сайт (интранет) — именно корпоративный ресурс для сотрудников, обеспечивающий внутренние коммуникации и доступ к рабочим материалам. Клиентский кабинет, партнёрский раздел и региональная версия — другие типы.","ref":55},{"q":"Что является основой системы метрик коммуникационной стратегии?","options":["охваты и лайки в социальных сетях","KPI (ключевые показатели эффективности)","количество публикаций в месяц","рейтинг бренда среди конкурентов"],"correct":1,"expl":"Основа системы метрик — именно KPI, переводящие коммуникационные цели в измеримые показатели. Охваты и лайки — лишь некоторые из KPI. Количество публикаций — операционный показатель. Рейтинг — итоговый комплексный индикатор.","ref":49},{"q":"Кто разработал модель RACE для digital-маркетинга?","options":["Филип Котлер в 2000-х","Дейв Чаффи (Smart Insights) в 2010 году","Уильям Деминг в середине XX века","Сет Годин в начале 2000-х"],"correct":1,"expl":"Модель digital RACE разработал именно Дейв Чаффи, соучредитель Smart Insights, в 2010 году, обнаружив, что у многих компаний нет чёткой digital-стратегии. Котлер — основатель маркетинг-менеджмента; Деминг — PDCA; Годин — пермишн-маркетинг.","ref":57},{"q":"Что является целью этапа Reach в модели RACE?","options":["оформление покупки и доставка","увеличение посещений и осведомлённости о бренде","возврат клиентов и программы лояльности","анализ поведения покупателей"],"correct":1,"expl":"Цель этапа Reach (охват) — увеличить посещения ресурсов и осведомлённость о бренде через все каналы: SEO, соцсети, контекст, медиа, email. Оформление покупки — Convert, лояльность — Engage, анализ — Evaluate/Plan.","ref":57},{"q":"На какие группы делятся инструменты SMM?","options":["визуальные и текстовые","платные (Performance) и условно-бесплатные (Organic)","ручные и автоматизированные","открытые и закрытые"],"correct":1,"expl":"Инструменты SMM делятся именно на платные (Performance: таргетинг, посевы) и условно-бесплатные (Organic: посты, истории, видео). Прочие классификации — по форматам, степени автоматизации или доступа.","ref":48},{"q":"Что такое look-alike в таргетированной рекламе?","options":["копия успешного объявления конкурента","показ рекламы аудитории, похожей по характеристикам на существующих клиентов","рекламный креатив, имитирующий нативный контент","ретаргетинг на тех, кто посмотрел сайт"],"correct":1,"expl":"Look-alike — таргетинг на пользователей, ПОХОЖИХ по характеристикам на текущих клиентов (алгоритм находит «двойников»). Имитация конкурентов — копипаст, нативная имитация — нативная реклама, ретаргетинг — про вернувшихся.","ref":48},{"q":"Какие виды цифровых маркетинговых кампаний существуют?","options":["только SEO и контекст","SEM, SMM, контент-маркетинг, email, видео, ретаргетинг, партнёрский, омниканальные","только баннерная реклама","только email и пуш-уведомления"],"correct":1,"expl":"Виды digital-кампаний: поисковые (SEO/PPC), SMM, контент-маркетинг, email, видео, медийные, вирусный, ретаргетинг, партнёрский, омниканальные. Сводить к одному-двум — упрощение.","ref":58},{"q":"На каком уровне находятся поведенческие и бизнес-метрики в системе метрик?","options":["на самом нижнем — техническом","на наиболее важном — влияющем на бизнес-результаты","на среднем — для тактической оптимизации","они не входят в систему метрик коммуникаций"],"correct":1,"expl":"Поведенческие и бизнес-метрики — наиболее важный уровень: заявки, лиды, продажи, повторные покупки, удержание. Они связывают коммуникации с бизнес-результатами. Технический уровень — операционные метрики (показы, частота публикаций).","ref":49},{"q":"Что важно сделать, чтобы контент заинтересовал аудиторию?","options":["использовать самые модные приёмы и тренды","определить мотивы, аргументы и основную идею (лозунг), понятные ЦА","максимально увеличить объём контента","использовать профессиональную лексику для подчёркивания экспертности"],"correct":1,"expl":"Нужно именно определить мотивы и аргументы в пользу покупки, основную идею (лозунг), применять формы, понятные ЦА. Не гнаться за модой (примерять к покупателю), не увеличивать объём (важна суть), не злоупотреблять терминологией.","ref":50},{"q":"Что показывает раздел «Цели и конверсии» в Яндекс.Метрике?","options":["финансовые показатели компании","сколько раз достигнута цель и процент посетителей, выполнивших нужное действие","рейтинги конкурентов в поиске","настройки рекламного кабинета"],"correct":1,"expl":"Раздел показывает именно сколько раз достигнута цель (форма, звонок, покупка) и какой % посетителей выполнил действие. Это ключевой раздел для оценки эффективности сайта и рекламы.","ref":51},{"q":"Что является целью этапа Convert в модели RACE?","options":["максимизация охвата и трафика","превращение потенциальных клиентов в платёжеспособных покупателей","развитие сообщества «адвокатов» бренда","сбор обратной связи от существующих клиентов"],"correct":1,"expl":"Цель этапа Convert — именно превратить потенциальных клиентов в платёжеспособных, обеспечив комфортное получение и использование. Охват — Reach, сообщество и обратная связь — Engage.","ref":57},{"q":"Что относится к этапу Engage в RACE?","options":["первое привлечение трафика на сайт","развитие долгосрочных отношений: программа лояльности, повторные покупки, сообщество","показ первых рекламных объявлений новым пользователям","сбор данных для аналитики и отчётности"],"correct":1,"expl":"Engage — этап долгосрочного взаимодействия: welcome-цепочки, программа лояльности, повторные покупки, сообщество «адвокатов» бренда. Первый трафик — Reach, первая реклама — Reach, аналитика — Evaluate.","ref":57},{"q":"Что такое посевы в SMM?","options":["автоматическая публикация контента по расписанию","покупка рекламных мест в тематических сообществах или у блогеров (инфлюенс-маркетинг)","распространение контента через комментарии конкурентов","создание контента на основе пользовательских запросов"],"correct":1,"expl":"Посевы — именно покупка рекламных мест в тематических сообществах или у лидеров мнений (инфлюенс-маркетинг). Это форма ручного или автоматического размещения через биржи. Не путать с автопостингом и UGC.","ref":48},{"q":"Чем дополняют SERM для лучшего результата?","options":["только увеличением бюджета на SEO","другими инструментами, особенно ORM (управление всей онлайн-репутацией)","офлайн-PR и работой со СМИ","автоматизированными чат-ботами"],"correct":1,"expl":"SERM нужно комбинировать с другими инструментами, особенно с ORM (комплексная онлайн-репутация). Только SERM (поисковая выдача) не даст полного эффекта. Бюджет SEO, офлайн-PR и боты — отдельные направления.","ref":118},{"q":"Что такое DOOH?","options":["цифровая реклама в офисах (Digital Office Of Home)","Digital Out-of-Home — цифровая наружная реклама на экранах в городе","Direct Outreach — прямой охват аудитории","Daily Online Hub — ежедневный онлайн-хаб новостей"],"correct":1,"expl":"DOOH (Digital Out-of-Home) — цифровая наружная реклама: цифровые экраны в городе, разновидность OOH. Прочие аббревиатуры — придуманные дистракторы.","ref":107},{"q":"Каков первый этап работы ORM?","options":["удаление негативных отзывов с площадок","подбор репутационных запросов и аудит поисковой выдачи","привлечение лидеров мнений для нейтрализации негатива","запуск рекламной кампании в защиту бренда"],"correct":1,"expl":"Этапы ORM: 1) подбор репутационных запросов, 2) аудит поисковой выдачи, 3) анализ информации, 4) формирование стратегии, 5) анализ результатов. Удаление, инфлюенсеры и реклама — возможные тактики на 4-м этапе.","ref":106}]},{"category":"Правовые основы","questions":[{"q":"Каким Федеральным законом регулируется реклама в России?","options":["ФЗ № 149-ФЗ «Об информации»","ФЗ № 38-ФЗ «О рекламе» от 13.03.2006","ФЗ № 135-ФЗ «О защите конкуренции»","ФЗ № 2300-1 «О защите прав потребителей»"],"correct":1,"expl":"Основа регулирования — именно ФЗ от 13.03.2006 № 38-ФЗ «О рекламе». Прочие законы тоже касаются рекламы (ФЗ-135 — конкуренция, ФЗ-149 — информация, ФЗ-2300-1 — защита потребителей), но 38-ФЗ — главный.","ref":61},{"q":"Реклама каких товаров НЕ допускается по ФЗ-38?","options":["алкогольной продукции крепче 5 градусов","табака, наркотиков, услуг по абортам, цифровой валюты","банковских и финансовых услуг","детских товаров без сертификата"],"correct":1,"expl":"Ст. 7 ФЗ-38 прямо запрещает рекламу табака, наркотиков, услуг по прерыванию беременности, цифровой валюты, иностранных агентов, нелицензированных товаров. Реклама алкоголя ограничена, но не запрещена полностью; финуслуги и детские товары — допустимы при соблюдении требований.","ref":109},{"q":"Какой процент годового объёма рекламы должен составлять договор на распространение социальной рекламы?","options":["1%","5%","10%","до договорённости сторон"],"correct":1,"expl":"По ч.3 ст.10 ФЗ-38 заключение договора на распространение социальной рекламы обязательно для рекламораспространителя и составляет именно 5% годового объёма рекламы.","ref":63},{"q":"Какая ответственность предусмотрена за нарушение ФЗ «О рекламе»?","options":["только уголовная","гражданско-правовая и административная","только дисциплинарная для сотрудников","ответственность не предусмотрена"],"correct":1,"expl":"Ст. 38 ФЗ-38: предусмотрены именно гражданско-правовая (иски, контрреклама) и административная ответственность (КоАП 14.3). Уголовная — только в крайних случаях. Дисциплинарная — внутреннее дело компании.","ref":117},{"q":"Что такое товарный знак?","options":["любой рекламный слоган компании","обозначение, зарегистрированное в Роспатенте для индивидуализации товаров","логотип компании, используемый в рекламе","коммерческое название продукта"],"correct":1,"expl":"Товарный знак — обозначение (словесное, изобразительное и т.д.), прошедшее РЕГИСТРАЦИЮ в Роспатенте, для индивидуализации товаров. Без регистрации логотип не является товарным знаком и не имеет правовой защиты.","ref":72},{"q":"Через сколько лет неиспользования товарный знак могут аннулировать?","options":["1 год","3 года","5 лет","10 лет"],"correct":1,"expl":"Если товарный знак не используется более 3 лет, его правовую защиту могут аннулировать (ст. 1486 ГК РФ). 10 лет — срок действия регистрации с правом продления.","ref":72},{"q":"Как реализуется принцип законности в регулировании рекламы?","options":["реклама должна получать предварительное одобрение государства","реклама должна быть добросовестной, достоверной, не нарушать запреты ФЗ-38, контролируется ФАС","реклама обязана проходить экспертизу СРО","реклама должна полностью соответствовать ГОСТам"],"correct":1,"expl":"Принцип законности: реклама должна быть добросовестной, достоверной, не нарушать запреты ФЗ-38, контролируется ФАС, за нарушения — ответственность. Предварительное одобрение и обязательная экспертиза не требуются; ГОСТы касаются товаров, а не рекламы.","ref":64},{"q":"Обязателен ли для рекламораспространителя договор на распространение социальной рекламы?","options":["нет, заключается по желанию сторон","да, обязателен (в пределах 5% годового объёма)","да, обязателен только для государственных СМИ","обязателен только в период избирательных кампаний"],"correct":1,"expl":"Да, по ч.3 ст.10 ФЗ-38 заключение договора на соцрекламу обязательно для всех рекламораспространителей в объёме 5% годового объёма рекламы — независимо от формы собственности и периода.","ref":63},{"q":"Что составляет правовую основу рекламной деятельности в РФ?","options":["только Федеральный закон «О рекламе»","совокупность конституционных, гражданских, антимонопольных, административных и специальных рекламных норм","Гражданский кодекс и КоАП","решения и постановления ФАС"],"correct":1,"expl":"Правовые основы — это совокупность конституционных, гражданских, антимонопольных, административных и специальных рекламных норм; ядро — ФЗ-38, но в системе также ГК, КоАП, ФЗ-135, ФЗ-2300-1, ФЗ-149 и другие.","ref":62},{"q":"Сколько лет действует товарный знак с возможностью продления?","options":["5 лет","10 лет","20 лет","бессрочно после регистрации"],"correct":1,"expl":"Товарный знак действует 10 лет, после чего его можно продлевать неограниченное число раз (ст. 1491 ГК РФ). Без продления — теряет защиту.","ref":72},{"q":"Какая реклама признаётся недобросовестной по ФЗ-38?","options":["содержащая яркие визуальные образы","с некорректными сравнениями с конкурентами и порочащей информацией","имеющая большой бюджет на размещение","использующая иностранные слова в тексте"],"correct":1,"expl":"Недобросовестная реклама: некорректные сравнения с конкурентами, порочащая информация о них, использование чужих результатов интеллектуальной деятельности без разрешения. Яркие образы, бюджет и иностранные слова сами по себе не нарушение.","ref":62},{"q":"Какой орган контролирует соблюдение закона о рекламе?","options":["Минцифры","антимонопольный орган (ФАС)","Роспотребнадзор","Роскомнадзор"],"correct":1,"expl":"Государственный контроль за соблюдением закона о рекламе осуществляет именно антимонопольный орган (ФАС), который возбуждает дела, выдаёт предписания и обращается в суд. Прочие ведомства имеют смежные, но не основные полномочия.","ref":62},{"q":"Освобождает ли уплата штрафа от исполнения предписания о прекращении нарушения?","options":["да, штраф полностью закрывает вопрос","нет, не освобождает","зависит от размера штрафа","зависит от решения регионального ФАС"],"correct":1,"expl":"По ч.10 ст.38 ФЗ-38, уплата штрафа НЕ освобождает от исполнения предписания о прекращении нарушения законодательства о рекламе. Это две отдельные меры воздействия.","ref":117},{"q":"Что относится к недостоверной рекламе?","options":["реклама с противоречивым подбором цветов","ложные сведения о товаре, цене, скидках, сертификатах, акциях","реклама без указания контактов компании","реклама без обязательного логотипа"],"correct":1,"expl":"Недостоверная реклама содержит не соответствующие действительности сведения о товаре, его стоимости, условиях, скидках, сроках акций. Цвета, контакты и логотипы — не критерии достоверности (они могут отсутствовать без нарушения закона).","ref":62},{"q":"На принципе чего строится современное регулирование интернет-рекламы (ст. 18.1)?","options":["свободы и минимального регулирования","прослеживаемости и маркировки (учёт в ЕРИР)","обязательного предварительного согласования","региональной автономии в регулировании"],"correct":1,"expl":"Современное регулирование интернет-рекламы строится именно на принципе прослеживаемости: передача данных в уполномоченный орган, присвоение идентификатора, учёт в Едином реестре интернет-рекламы (ЕРИР). Это введено относительно недавно.","ref":62},{"q":"Из чьей позиции исходит судебная практика при оценке рекламы?","options":["профессионального эксперта в маркетинге","обычного потребителя","юриста, специализирующегося на рекламе","представителя рекламной индустрии"],"correct":1,"expl":"Судебная практика исходит именно из позиции ОБЫЧНОГО потребителя, поэтому мелкий нечитаемый текст или сложные оговорки не спасают рекламодателя — это считается отсутствием существенной информации.","ref":62},{"q":"Что такое социальная реклама по ФЗ-38?","options":["реклама в социальных сетях","информация, направленная на достижение благотворительных и общественно полезных целей","реклама от социальных предпринимателей","реклама для социально незащищённых групп"],"correct":1,"expl":"Социальная реклама по ФЗ-38 — информация, адресованная неопределённому кругу лиц, направленная на достижение БЛАГОТВОРИТЕЛЬНЫХ и общественно полезных целей, а также обеспечение интересов государства. Не путать с рекламой В соцсетях или ОТ соцпредпринимателей.","ref":63}]},{"category":"История и политика PR","questions":[{"q":"Кто первым ввёл в оборот термин «паблик рилейшнз» (PR)?","options":["Эдвард Бернейс в 1920-х","Томас Джефферсон в 1807 году (в обращении к Конгрессу)","Айви Ли в 1900-х","Дорман Итон в 1882 году"],"correct":1,"expl":"Большинство исследователей считают, что термин впервые употребил президент США Томас Джефферсон в 1807 г. в «Седьмом обращении к конгрессу». Бернейс — «отец» современного PR (1920-е). Итон применял термин в 1882 г. (альтернативная версия). Айви Ли — «Декларация принципов» 1906 г.","ref":96},{"q":"Что НЕ использовалось в Российской империи накануне Первой мировой войны?","options":["печатная реклама (плакаты, листовки, газетные объявления)","массовые PR-кампании с использованием радио и телевидения","выставочная деятельность как инструмент продвижения","фирменный стиль и брендинг товаров"],"correct":1,"expl":"Радио и ТВ для рекламы, профессиональные PR-агентства западного типа и системный политический PR не существовали — телевидения не было, радио в зачаточном состоянии. Печатная реклама, выставки, фирменный стиль — активно использовались.","ref":92},{"q":"Что означал термин «реклам-конструктор» в СССР во времена НЭПа?","options":["художника, оформляющего витрины госмагазинов","творческий метод и специалистов конструктивизма в рекламе (как Маяковский + Родченко)","инженера-проектировщика рекламных конструкций","редактора рекламных текстов"],"correct":1,"expl":"«Реклам-конструктор» — творческий метод и одноимённое агентство Маяковского (тексты) и Родченко (графика) в стиле конструктивизма. Союз слова и изображения, например «Нигде, кроме как в Моссельпроме!». Не путать с инженером и оформителем.","ref":93},{"q":"Кем был Анастас Микоян, повлиявший на «советскую рекламу» в 1930-е?","options":["главным редактором газеты «Правда»","народным комиссаром пищевой промышленности СССР","директором фабрики «Большевик»","главным художником ВДНХ"],"correct":1,"expl":"Микоян был наркомом пищевой промышленности; инициировал массовое производство мороженого, «докторской» колбасы, соков, кукурузных хлопьев и считается «отцом» советской рекламы — курировал «Книгу о вкусной и здоровой пище».","ref":94},{"q":"Какова была цель рекламных кампаний банка «Империал» в 1990-е?","options":["информирование о ставках и условиях вкладов","узнаваемость бренда, имидж надёжного и престижного банка","привлечение молодой аудитории через юмор","объяснение сложных финансовых продуктов"],"correct":1,"expl":"Ролики Бекмамбетова для «Империала» формировали именно узнаваемость бренда и имидж надёжного, престижного банка, ориентируясь на зрелую обеспеченную аудиторию, ценящую традиции. Не информирование о продуктах и не молодёжная аудитория.","ref":95},{"q":"Что НЕ относится к принципам политического PR в органах власти?","options":["открытость и прозрачность","манипуляция и сокрытие информации в интересах отдельных чиновников","приоритет общественного интереса","двусторонний диалог с гражданами"],"correct":1,"expl":"Манипуляция, закрытость и искажение информации в интересах отдельных лиц НЕ являются принципами политического PR в госорганах. Принципы: открытость/гласность, приоритет общественного интереса, диалог, достоверность.","ref":97},{"q":"Что такое политическая коммуникация?","options":["официальные публичные выступления политиков","процесс передачи политической информации между субъектами политики (государством, партиями, гражданами)","предвыборная агитация и пропаганда","работа пресс-служб политических партий"],"correct":1,"expl":"Политическая коммуникация — широкий процесс передачи политической информации, идей, ценностей между субъектами политики (государство, партии, лидеры, граждане). Выступления, агитация и пресс-службы — частные проявления.","ref":98},{"q":"Какие предпосылки вызвали появление PR в России?","options":["развитие интернета и социальных сетей","переход к демократии и рынку, политическая конкуренция, развитие СМИ","государственная программа развития коммуникаций","заимствование западных корпоративных практик"],"correct":1,"expl":"PR в России возник как ответ на переход к демократии и рынку, политическую конкуренцию, развитие СМИ — это заменило советскую пропагандистскую мод
