Тимуром Бекмамбетовым для банка «Империал».","category":"Реклама"},{"num":96,"title":"Кто первый ввел в оборот термин «паблик рилейшенз»?","answer":"Большинство исследователей считают, что термин «паблик рилейшнз» (public relations)\nвпервые ввел в оборот третий президент США Томас Джефферсон в 1807 году. [1, 2]\n\nКлючевые факты:\n\n● Контекст: Джефферсон использовал это выражение в черновике своего\n«Седьмого обращения к конгрессу», заменив им формулировку «состояние\nмысли» (thought).\n● Альтернативная версия: Иногда в литературе встречается утверждение, что\nпонятие впервые использовал юрист Дорман Итон в 1882 году, призывая\nвыпускников Йельского университета к служению обществу.\n● «Отец» пиара: Эдвард Бернейс считается «отцом» современного PR как\nиндустрии и дисциплины, систематизировавшим методы в XX веке, но автором\nсамого термина признан Джефферсон\n\nИсточник","hint":"Большинство исследователей считают, что термин «паблик рилейшнз» (public relations) впервые ввел в оборот третий президент США Томас Джефферсон в 1807 году.","category":"Прочее"},{"num":97,"title":"К принципам политического пиара в органах государственной власти не относится…","answer":"Среди главных принципов работы государственных структур — прозрачность и\nгласность\nИсточник:\nnih-organov/\n\nОтносится к принципам:\n- Открытость и прозрачность (гласность) — регулярное информирование граждан\nо деятельности.\n- Приоритет общественного интереса — деятельность через призму пользы для\nграждан.\n- Двусторонний диалог — не только информирование, но и изучение реакции.\n- Системность и достоверность — создание устойчивого доверия к власти.\n\nЭксперты ЕС отмечают, что в странах Евросоюза, особенно при проведении\nизбирательных кампаний разного уровня, политический PR концентрируется на\nдоведении до широких слоев электората результатов социологических опросов и\nпрогнозов; открытая ложь не имеет место, но активно применяется методика\nсознательного манипулирования информацией за счет сокрытия ее определенной\nчасти или распространения наполовину правдивых сообщений. Каждый второй\nспециалист в области западноевропейского политического PR признает, что в той или\nиной степени использует в зависимости от обстоятельств тактику сокрытия\nопределенного характера информации и прибегает к методам отвлечения от нее\nвнимания журналистов. Если все же такая информация становится достоянием\nобщественности, то в 61-ом проценте случаев это становится результатом\nпрофессиональных недостатков в работе самих PR-специалистов и только в 23-ех\nпроцентах следствием исключительно самостоятельного поиска информации\nпредставителями СМИ.\n\nПри этом указывается, что деятельность служб PR в центральных и местных органах\nвласти не должна носить политический характер. Она призвана способствовать\nразвитию демократии, открытости деятельности власти и расширению\nинформированности общества, а не быть на службе интересов отдельных чиновников\nи политических партий\n\nИсточник:\nВсе, что связано с манипуляцией, закрытостью, искажением информации и служением\nинтересам отдельных политических партий или чиновников не является принципом\nполитического пиара в органах государственной власти.","hint":"Среди главных принципов работы государственных структур — прозрачность и гласность Источник: nih-organov/ Относится к принципам: - Открытость и прозрачность (гласность) — регулярное информирование граждан о деятельности.","category":"PR-деятельность"},{"num":98,"title":"Политическая коммуникация – это…","answer":"Политическая коммуникация - это процесс передачи политической информации, идей,\nценностей и решений между различными субъектами политической деятельности\n(государством, партиями, институтами гражданского общества, лидерами,\nгражданами)\n\nИсточник:\n\no-polya/viewer","hint":"Политическая коммуникация - это процесс передачи политической информации, идей, ценностей и решений между различными субъектами политической деятельности (государством, партиями, институтами гражданского общества, лидерами, гражданами) Источник: o-polya/viewer","category":"Коммуникации и тексты"},{"num":99,"title":"Какие элементы включает в себя имидж политического деятеля?","answer":"Имидж политического деятеля состоит из:\n\n1. Внешнего (визуального) образа\n2. Речи и коммуникации\n3. Поведения\n4. Ценностей и убеждений\n5. Репутации и биографии\n6. Образа в СМИ\n\nВ политической сфере отмечается:\n\n● имидж связан с ценностями и идеологией\n● строится через медиапространство\n● ориентирован на массовую аудиторию и электорат\n\nИсточник: Интегрированные коммуникации:\nреклама, паблик рилейшнз, брендинг: Учебное пособие. 3-е изд., стер.","hint":"реклама, паблик рилейшнз, брендинг: Учебное пособие. 3-е изд., стер.","category":"Бренд и репутация"},{"num":100,"title":"Целями политической коммуникации являются…","answer":"Целями политической коммуникации являются целенаправленное воздействие на\nопределенную аудиторию (граждан, электорат) с целью формирования определенного\nобщественного мнения, обеспечения поддержки власти и влияния на политический\nпроцесс.\n\nИсточник:","hint":"Целями политической коммуникации являются целенаправленное воздействие на определенную аудиторию (граждан, электорат) с целью формирования определенного общественного мнения, обеспечения поддержки власти и влияния на политический процесс.","category":"Коммуникации и тексты"},{"num":101,"title":"Основные принципы (этапы) построения пиар-кампаний.","answer":"Основными этапами построения PR компаний являются:\n\n1. Определение задач и целей\n\nЦели должны быть реальными и измеримыми, как пример, целью может быть\nповышения лояльности бренда, вывести новый продукт на рынок и т.д. Проводится,\nнепосредственно, анализ, сбор и оценка информации, необходимой для достижения\nпоставленных целей.\n\n2. Определение аудитории\n\nНа данном этапе необходимо задать вопрос: «На кого нацелены наши усилия и к чему\nмы стремимся?». Целевой аудиторией кампании могут быть лояльные покупатели,\nпотенциальные клиенты, инвесторы или органы власти. Лучше планировать одну\nPR‑кампанию на одну‑две группы целевой аудитории.\n\n3. Выбор основной темы пиар-кампании\n\n4. Выбор каналов распространения\n\nЗависит от целевой аудитории кампании, поэтому стоит публиковать материалы в тех\nканалах, где их увидит необходимая аудитория. Также стоит учесть характер самой\nпиар кампании и распространять ее в тех ресурсах, что схожи с самой кампанией.\n\n5. Планирование бюджета\n\nПодсчет необходимых средств на производство, размещение и проведение самой\nпиар-кампании. Также следует закладывать запас средств а непредвиденные случаи.","hint":"Основными этапами построения PR компаний являются: 1.","category":"PR-деятельность"},{"num":102,"title":"Особенности и жанры пиар-текстов для СМИ.","answer":"Особенности:\nPR-тексты для СМИ – это материалы, которые создаются пресс-службами и\nPR-специалистами для передачи журналистам и редакциям. Их задача состоит в\nинформировании общественности, формировании имиджа, поддержании репутации и\nвыстраивании отношений организации со СМИ.\n\nPR-тексты для СМИ отличаются:\n● информационностью\n(PR-текст должен содержать новость, факт, событие или общественно\nзначимую информацию, а не просто хвалить организацию),\n● достоверностью и фактичностью\n(PR-текст должен опираться на проверяемые факты: даты, цифры, имена,\nдолжности, цитаты, названия проектов, конкретные действия организации. Если\nтекст построен только на оценочных фразах вроде «лучшая компания»,\n«уникальный продукт», «революционное решение», он начинает звучать как\nреклама и теряет ценность для СМИ),\n● нейтральным стилем\n(PR-текст для СМИ не должен быть слишком рекламным, эмоциональным или\nнавязчивым. Он должен быть удобен для журналистской переработки. То есть\nPR-текст должен звучать так, чтобы журналист мог использовать его как основу\nдля новости, заметки, интервью или аналитического материала),\n● четкой структурой\n(Обычно используется принцип «перевернутой пирамиды»: сначала самое\nглавное, затем подробности и справочная информация),\n● ориентацией на журналистов и репутационной направленностью\n(Даже если PR-текст внешне выглядит как информационный материал, он\nвсегда связан с задачами имиджа и репутации. Через такие тексты организация\nдемонстрирует свою экспертность, социальную ответственность, открытость,\nстабильность, лидерство или готовность к диалогу.).\n\nЖанры:\nК основным жанрам PR-текстов для СМИ относятся пресс-релиз, пресс-анонс,\nпост-релиз, бэкграундер, факт-лист, пресс-кит, заявление для СМИ, экспертный\nкомментарий, интервью и авторская статья. Все эти жанры используются в системе\nмедиарилейшнз и помогают организации управлять публичной коммуникацией,\nимиджем и репутацией.\n\nИсточники: Иншакова «Рекламный и пиар-текст», 2014; Чумиков «Медиарилейшнз»,\n2014; Синяева «Паблик-рилейшенз: толковый словарь», 2023; Шарков\n«Интегрированные коммуникации», 2022","hint":"Особенности: PR-тексты для СМИ – это материалы, которые создаются пресс-службами и PR-специалистами для передачи журналистам и редакциям.","category":"PR-деятельность"},{"num":103,"title":"Политические коммуникации: сущность и направления деятельности пиар-специалистов.","answer":"Политические коммуникации — это система обмена информацией между\nсубъектами политики (властью, обществом, партиями, лидерами, СМИ), направленная\nна формирование общественного мнения, легитимацию власти и управление\nполитическим поведением граждан. Это важнейший элемент функционирования\nполитической системы, поскольку именно через коммуникацию осуществляется\nвзаимодействие государства и общества.\n\nСущность политических коммуникаций заключается в целенаправленной передаче\nполитически значимой информации с использованием различных каналов\n(традиционные СМИ, интернет, социальные сети, публичные выступления и др.) с\nцелью воздействия на установки, ценности и поведение аудитории. Политические\nкоммуникации включают как формальные (официальные заявления, законы,\nпресс-релизы), так и неформальные (слухи, инсайды, неофициальные комментарии)\nформы.\n\nОсновные направления деятельности PR-специалистов в политической сфере:\n● Имиджмейкинг — создание и поддержание привлекательного образа\nполитика, партии или государственного органа.\n● Медиа-рилейшнз — взаимодействие со средствами массовой\nинформации: подготовка пресс-релизов, организация интервью, пресс-конференций.\n● Стратегическое планирование коммуникаций — разработка\nкоммуникационных стратегий и кампаний (например, избирательных).\n● Кризисные коммуникации — управление информацией в условиях\nкризиса, минимизация репутационных потерь.\n● Работа с общественным мнением — проведение социологических\nисследований, анализ настроений аудитории.\n● Digital-коммуникации — ведение социальных сетей, работа с\nонлайн-аудиторией, использование новых медиа.\n● Лоббизм и GR (government relations) — выстраивание отношений с\nорганами власти и другими политическими субъектами.\n● Организация публичных мероприятий — митинги, форумы, встречи с\nизбирателями.\n\n87%D0%B5%D1%81%D0%BA%D0%B8%D0%B9_%D0%BF%D0%B8%D0%B0%D1%80?\nutm_source","hint":"Политические коммуникации — это система обмена информацией между субъектами политики (властью, обществом, партиями, лидерами, СМИ), направленная на формирование общественного мнения, легитимацию власти и управление политическим поведением граждан.","category":"PR-деятельность"},{"num":104,"title":"Понятие «имидж» и его составляющие. Соотношение имиджа и медиаобраза.","answer":"Имидж — это устойчивый образ объекта (человека, компании, бренда), который\nформируется в сознании аудитории и включает рациональные и эмоциональные\nпредставления.\nОсновные составляющие имиджа:\n● внешний (визуальный) — внешний вид, стиль, символика;\n● вербальный — речь, коммуникация, тон сообщений;\n● поведенческий — действия, стиль взаимодействия;\n● ценностный — миссия, принципы, репутация;\n● эмоциональный — чувства и ассоциации, которые вызывает объект.\nСоотношение имиджа и медиаобраза:\nМедиаобраз — это образ, сформированный именно средствами массовой\nинформации. Он является частью имиджа, но не равен ему.\nРазница:\n● имидж формируется из разных источников (личный опыт, слухи, реклама,\nсоцсети);\n● медиаобраз — только через СМИ и медиа-контент;\n● медиаобраз может усиливать, искажать или даже противоречить реальному\nимиджу.\nПроще:\nмедиаобраз = отражение имиджа в СМИ, но не весь имидж.\nИЛИ\nИМИДЖ (от англ. image – образ), в теории и практике массовой коммуникации –\nцелостный, эмоционально нагруженный образ презентируемого или рекламируемого\nчеловека, товара, бренда (торговой марки) и др. объектов, к которым ставится задача\nсформировать определённое (как правило, позитивное) отношение.\nИсточник:\nИЛИ\nИмидж — это целенаправленно формируемый образ человека, организации, продукта\nили другого социального объекта, который складывается в сознании людей и содержит\nэмоционально окрашенную информацию. Цель имиджа — создать определённое\nотношение к объекту в массовом сознании, повлиять на поведение аудитории.\nСоставляющие имиджа\nСуществует несколько подходов к выделению структурных компонентов имиджа.\nНапример, по классификации А. Ю. Панасюка, личный имидж включает следующие\nсоставляющие:\n● Габитарная (от лат. habitus — внешность) — одежда, причёска, обувь,\nаксессуары, макияж, парфюмерия, силуэт.\n● Речевая — культура устной и письменной речи, грамотность, стиль, почерк.\n● Средовая — созданная человеком среда обитания (интерьер квартиры,\nоформление кабинета, порядок на рабочем столе и т. п.).\n\n● Овеществлённая — продукты труда человека (например, написанные им\nписьма, визитные карточки, подарки).\nИсточник:","hint":"Имидж — это устойчивый образ объекта (человека, компании, бренда), который формируется в сознании аудитории и включает рациональные и эмоциональные представления.","category":"Медиа и теория"},{"num":105,"title":"SMM (Social Media Marketing) – это самостоятельное направление интернет-маркетинга, охватывающее полный спектр целей и задач в сфере продвижения в социальных медиа.","answer":"Официальное определение гласит, что маркетинг в социальных медиа — это\nиспользование сайтов социальных медиа для продвижения корпоративного или\nличного бренда среди определенной целевой аудитории. SMM может быть направлен\nне только на продвижение товаров и услуг, но и на создание и поддержание имиджа\nорганизации, а также увеличение лояльности целевой аудитории и привлечение новых\nсегментов потребителей.\n\nВ SMM акцент делается на создании контента, который пользователи будут\nраспространять через социальные медиа самостоятельно, без участия автора. Это\nвызывает больше доверия у потенциальных потребителей товара или услуги ввиду\nтого, что человек склонен доверять своему окружению, которое, в свою очередь,\nпубликует на своих страницах информацию определенной компании. Такой контент не\nвоспринимается потенциальными потребителями в качестве навязчивой рекламы и,\nсоответственно, практически не вызывает негативных эмоций.\n\nКроме того, SMM — это продвижение не только в социальных сетях, но и во всех\nвозможных социальных медиа (блогах, форумах, фото- и видеохостингах,\nгеолокационных сервисах и пр.). Омникальность продвижения позволяет компаниям\nвыделиться из большого количества конкурентов, привлечь потенциальных\nпотребителей и значительно сократить затраты на рекламу в Интернете.\n\nИсточник: SMM-маркетинг : учебное пособие для вузов / Е. С. Милинчук. — Москва :\nИздательство Юрайт, 2024. — 216 с. — (Высшее образование). — Текст :\nнепосредственный. ISBN 978-5-534-17395-6","hint":"Официальное определение гласит, что маркетинг в социальных медиа — это использование сайтов социальных медиа для продвижения корпоративного или личного бренда среди определенной целевой аудитории.","category":"Медиа и теория"},{"num":106,"title":"ORM (Online Reputation Management) – это…","answer":"Управление онлайн-репутацией (ORM, Online Reputation Management) – это\nкомплекс стратегий и мероприятий, направленных на формирование и поддержку\nположительного образа компании или бренда в сети. Проще говоря, ORM помогает\nсоздать у аудитории благоприятное впечатление о бизнесе, его товарах и услугах,\nнейтрализовать негативную информацию и активнее продвигать позитивные\nупоминания в интернете. Грамотно выстроенная стратегия увеличивает доверие\nклиентов и защищает репутацию компании от кризисов и информационных атак.\n\nЭтапы работы\n1.Подбор репутационных запросов;\n2. Аудит поисковой выдачи (ручной и автоматизированный мониторинг);\n3. Анализ информации (классификация ресурсов, типы ресурсов, определение %\nнегатива, подробное описание ресурсов);\n4. Формирование стратегии работы.\n5. Анализ полученных результатов и корректировка стратегии.\n\nЦели:\n● Формирование положительного имиджа — публикация экспертных статей,\nкейсов и благодарственных отзывов.\n● Устранение негативных отзывов — оперативное реагирование на критику,\nобнаружение фейковых и ложных отзывов и при необходимости их удаление\nили корректировка.\n● Создание доверия аудитории — через открытый диалог с клиентами, честные\nответы на вопросы и активное участие в обсуждениях бренд повышает доверие\nк себе.\n● Повышение узнаваемости бренда — регулярное появление положительных\nматериалов и отзывов обеспечивает устойчивое присутствие компании в\nинформационном поле.\n● Инструменты:\n● Специальные сервисы для отслеживания упоминаний в социальных сетях,\nблогах, отзовиках и СМИ.\n● SEO-методы для продвижения позитивного контента в верхние позиции\nвыдачи, чтобы уменьшить видимость негативных материалов.\n● Работу с отзывами — оперативный ответ на негативные комментарии,\nпредложение решений проблем и поощрение довольных клиентов оставлять\nположительные отклики.\n● Анализ социальных сетей — позволяет понять настроения аудитории и\nбыстро отреагировать на волну недовольства или выяснить причины\nположительных отзывов.\n\nИсточники:\n%BB%D0%B5%D0%BD%D0%B8%D0%B5_%D1%80%D0%B5%D0%BF%D1%83%D1%8\n2%D0%B0%D1%86%D0%B8%D0%B5%D0%B9_%D0%B2_%D0%98%D0%BD%D1%82%\nD0%B5%D1%80%D0%BD%D0%B5%D1%82%D0%B5?ysclid=mosc8zs8wf184291746\n\n%2Fyandex.ru%2F","hint":"Управление онлайн-репутацией (ORM, Online Reputation Management) – это комплекс стратегий и мероприятий, направленных на формирование и поддержку положительного образа компании или бренда в сети.","category":"Digital и SMM"},{"num":107,"title":"OOH (Out Of Home) — это…","answer":"OOH – это сокращение от «out-of-home» (вне дома), визуальная форма рекламы,\nкоторая привлекает внимание потребителей, когда они находятся вне дома и вдали от\nсвоих устройств, просто занимаясь своими повседневными делами.\n\nОбщие примеры OOH включают:\n● Билборды и щиты вдоль дорог\n● Реклама на остановках транспорта\n● Баннеры на зданиях\n● Реклама в метро, автобусах, поездах\n● Цифровые экраны в городе (DOOH — digital out-of-home)\n● Реклама в аэропортах и ТЦ\n\nПреимущество OOH рекламы заключается в том, что она привлекает потребителей,\nкогда они даже не ищут ее. Размещенная стратегически, OOH может нацеливаться на\nключевую аудиторию и привлекать ее полное внимание, не беспокоясь о конкуренции\nс множеством других подобных объявлений.\n\nЭтот сегмент по праву считается самым динамично растущим среди других\nвидов маркетинговых коммуникаций, связанных с распространением\nпродающей информации. Как утверждает статистика, основная масса\nэкономически активных граждан находится 70% времени за пределами своего\nжилища. Кроме того, OOH стимулирует вовлеченность, как никакая другая форма\nрекламы. Исследования показали, что потребители более склонны нажимать на\nонлайн-объявление, если они сначала столкнулись с той же компанией в опыте\nрекламы вне дома.\n\nИсточники:\n\nrs-173012.html","hint":"Общие примеры OOH включают: ● Билборды и щиты вдоль дорог ● Реклама на остановках транспорта ● Баннеры на зданиях ● Реклама в метро, автобусах, поездах ● Цифровые экраны в городе (DOOH — digital out-of-home) ● Реклама в аэропортах и ТЦ Преимущество OOH рекламы заключается в том, что она привлекает потребителей, когда они даже не ищут ее.","category":"Прочее"},{"num":108,"title":"Соотношение нарратива и сторителлинга.","answer":"Нарратив и сторителлинг — связанные, но не тождественные понятия. Они связаны\nчерез процесс создания и передачи историй, но имеют разные акценты и функции.\n\nvestnik.journ.msu.ru\n\nthecontentauthority.com\n\nНарратив — это структурированное повествование о взаимосвязанных событиях,\nкоторое имеет смысл для слушателя или читателя. Это более абстрактное понятие,\nкоторое включает в себя способ организации информации, хронотоп (время и место\nсобытий), выбор средств выражения и акцентов, формирующих восприятие истории.\nНарратив может быть линейным или нелинейным, линейным — где события следуют\nодно за другим, нелинейным — с перепутанными временными линиями или\nрассказами из разных точек зрения.\n\nvestnik.journ.msu.ru\n\nproza.ru\n\ndzen.ru\n\nСторителлинг (от англ. storytelling — «рассказ истории») — это искусство и техника\nрассказывания историй, процесс передачи повествования устно, письменно или с\nпомощью визуальных средств. Сторителлинг не просто создаёт рассказ, а делает его\nпривлекательным, захватывающим, полным эмоций, смыслов и неожиданностей. Это\nстратегия эмоционального вовлечения аудитории, умение управлять её вниманием,\nвыстраивать напряжение и динамику, чтобы удерживать интерес на протяжении всей\nистории.\n\ndzen.ru\n\nНекоторые различия:\n\n● Нарратив — это структура или концепция повествования, организация событий\nи времени.\n\n● Сторителлинг — это процесс передачи истории, включающий выбор способов\nподачи, эмоциональную составляющую, управление восприятием аудитории.\n\ndzen.ru\n\nМожно сказать, что нарратив — это каркас, структура истории, а сторителлинг — это\nспособ подачи этого каркаса, техника создания увлекательного повествования.\n\nНапример, в книгах Джорджа Мартина («Песнь льда и огня») или в фильмах\n«Мстители» используются разнообразные методы сторителлинга для создания\nглубоких, многослойных нарративов с несколькими точками зрения и множеством\nнеожиданных поворотов.\n\ndzen.ru\n\nВ некоторых случаях сторителлинг может использовать нарративные структуры,\nадаптируя их под конкретные цели — например, в журналистике, маркетинге или\nцифровых медиа. Таким образом, сторителлинг можно рассматривать как\nпрактическую реализацию нарратива с акцентом на вовлечение и эмоциональное\nвоздействие на аудиторию.","hint":"Нарратив и сторителлинг — связанные, но не тождественные понятия.","category":"Коммуникации и тексты"},{"num":109,"title":"Закон 38-ФЗ «О рекламе» НЕ допускает рекламу следующих товаров…","answer":"Статья 7. Объекты рекламирования, реклама которых не допускается\nНе допускается реклама:\n\n1) товаров, производство и (или) реализация которых запрещены законодательством\nРоссийской Федерации;\n\n2) наркотических средств, психотропных веществ и их прекурсоров, растений,\nсодержащих наркотические средства или психотропные вещества либо их прекурсоры,\nи их частей, содержащих наркотические средства или психотропные вещества либо их\nпрекурсоры, а также новых потенциально опасных психоактивных веществ;\n(в ред. Федеральных законов от 19.05.2010 N 87-ФЗ, от 01.05.2019 N -ФЗ)\n\n3) взрывчатых веществ и материалов, за исключением пиротехнических изделий;\n\n4) органов и (или) тканей человека в качестве объектов купли-продажи;\n\n5) товаров, подлежащих государственной регистрации, в случае отсутствия такой\nрегистрации;\n\n6) товаров, подлежащих обязательной сертификации или иному обязательному\nподтверждению соответствия требованиям технических регламентов, в случае\nотсутствия такой сертификации или подтверждения такого соответствия, а также работ\nили услуг по оценке (подтверждению) соответствия, в том числе по приему и\nрассмотрению документов, необходимых для выполнения указанных работ и (или)\nоказания услуг, осуществляемых лицами, не имеющими аккредитации в национальной\nсистеме аккредитации (в случае, если получение такой аккредитации предусмотрено\nзаконодательством Российской Федерации), либо аккредитованными лицами, но без\nуказания наименования аккредитованного юридического лица или фамилии, имени и\n\n(если имеется) отчества аккредитованного индивидуального предпринимателя и\nуникального номера записи об аккредитации в реестре аккредитованных лиц;\n(в ред. Федерального закона от 29.07.2018 N 262-ФЗ)\n\n7) товаров, на производство и (или) реализацию которых требуется получение\nлицензий или иных специальных разрешений, в случае отсутствия таких разрешений;\nКонсультантПлюс: примечание.\nО запрете рекламы и стимулирования продажи табака, спонсорства табака см.\nФедеральный закон от 23.02.2013 N 15-ФЗ.\n\n8) табака, табачной продукции, табачных изделий, никотинсодержащей продукции,\nкурительных принадлежностей, в том числе трубок, сигаретной бумаги, зажигалок, а\nтакже устройств для потребления никотинсодержащей продукции, кальянов;\n(п. 8 введен Федеральным законом от 21.10.2013 N 274-ФЗ; в ред. Федерального\nзакона от 31.07.2020 N 303-ФЗ)\n\n9) медицинских услуг по искусственному прерыванию беременности;\n(п. 9 введен Федеральным законом от 25.11.2013 N 317-ФЗ)\n\n10) услуг по подготовке и написанию выпускных квалификационных работ, научных\nдокладов об основных результатах подготовленных научно-квалификационных работ\n(диссертаций) и иных работ, предусмотренных государственной системой научной\nаттестации или необходимых для прохождения обучающимися промежуточной или\nитоговой аттестации;\n(п. 10 введен Федеральным законом от 30.10.2018 N 383-ФЗ)\n\n11) иностранных лиц, осуществляющих деятельность в\nинформационно-телекоммуникационной сети \"Интернет\" на территории Российской\nФедерации, и (или) их информационных ресурсов в качестве объектов\nрекламирования, направленная на привлечение внимания потребителей рекламы,\nнаходящихся на территории Российской Федерации, в случае принятия федеральным\nорганом исполнительной власти, осуществляющим функции по контролю и надзору в\nсфере средств массовой информации, массовых коммуникаций, информационных\nтехнологий и связи, решения о запрете на распространение такой рекламы и\nвключения информации о таком решении в перечень иностранных лиц,\nосуществляющих деятельность в информационно-телекоммуникационной сети\n\"Интернет\" на территории Российской Федерации, в соответствии с Федеральным\nзаконом от 1 июля 2021 года N 236-ФЗ \"О деятельности иностранных лиц в\nинформационно-телекоммуникационной сети \"Интернет\" на территории Российской\nФедерации\";\n(п. 11 введен Федеральным законом от 02.07.2021 N 347-ФЗ; в ред. Федерального\nзакона от 08.08.2024 N 303-ФЗ)\n\n12) информационных ресурсов иностранных агентов;\n(п. 12 введен Федеральным законом от 11.03.2024 N 42-ФЗ)\n\n13) цифровой валюты, а также товаров (работ, услуг) в целях организации обращения\nи (или) обращения цифровой валюты;\n(п. 13 введен Федеральным законом от 08.08.2024 N 221-ФЗ)\n\n14) цифровых финансовых активов, указанных в части 1.1 статьи 3 Федерального\nзакона от 31 июля 2020 года N 259-ФЗ \"О цифровых финансовых активах, цифровой\n\nвалюте и о внесении изменений в отдельные законодательные акты Российской\nФедерации\".\n(п. 14 введен Федеральным законом от 08.08.2024 N 221-ФЗ)","hint":"Объекты рекламирования, реклама которых не допускается Не допускается реклама: 1) товаров, производство и (или) реализация которых запрещены законодательством Российской Федерации; 2) наркотических средств, психотропных веществ и их прекурсоров, растений, содержащих наркотические средства или психотропные вещества либо их прекурсоры, и их частей, содержащих наркотические...","category":"Реклама"},{"num":110,"title":"Внутрикорпоративный пиар: задачи, каналы внутрифирменного информирования.","answer":"Внутрикорпоративный пиар — это система коммуникаций внутри организации,\nнаправленная на формирование благоприятного психологического климата,\nукрепление корпоративной культуры и поддержание эффективного взаимодействия\nмежду руководством и сотрудниками.\n\nЕго главная цель заключается в создании единого информационного пространства\nкомпании, повышении лояльности персонала и формировании чувства причастности\nработников к деятельности организации.\n\nВнутрикорпоративный PR играет важную роль в деятельности любой компании,\nпоскольку именно сотрудники являются носителями корпоративных ценностей и\nимиджа организации. Если внутри коллектива отсутствует доверие,\nинформированность и взаимопонимание, это отрицательно влияет как на рабочую\nатмосферу, так и на репутацию компании во внешней среде.\n\nОсновные задачи внутрикорпоративного пиара\n1. Информирование сотрудников\nОдной из главных задач является своевременное и достоверное информирование\nперсонала о событиях внутри компании:\n● изменениях в структуре организации;\n\n● новых проектах;\n\n● кадровых перестановках;\n\n● целях и стратегии развития;\n\n● достижениях компании.\n\nСотрудники должны понимать, что происходит в организации и какую роль они играют\nв её деятельности.\n\n2. Формирование корпоративной культуры\nВнутренний PR способствует развитию общих ценностей, норм поведения и традиций\nкомпании. Это помогает формировать командный дух, поддерживать единый стиль\nобщения и укреплять корпоративную идентичность.\n\n3. Повышение мотивации персонала\nЧерез систему внутренних коммуникаций руководство может поддерживать\nзаинтересованность сотрудников в результатах труда, поощрять инициативу и\nсоздавать благоприятную рабочую атмосферу.\n\n4. Укрепление лояльности работников\nКогда сотрудники чувствуют внимание со стороны руководства и получают\nнеобходимую информацию, повышается их доверие к компании и желание работать в\nней длительное время.\n\n5. Предотвращение конфликтов и слухов\nНедостаток информации часто приводит к возникновению слухов и напряжённости в\nколлективе. Внутрикорпоративный PR помогает снизить уровень недопонимания и\nсвоевременно объяснять происходящие изменения.\n\n6. Развитие обратной связи\nВажной задачей является организация коммуникации не только «сверху вниз», но и\n«снизу вверх». Руководство должно получать мнение сотрудников, учитывать\nпредложения и реагировать на проблемы коллектива.\n\n7. Адаптация новых сотрудников\nВнутренний PR помогает новым работникам быстрее освоиться в коллективе,\nпознакомиться с правилами и ценностями организации.\n\nКаналы внутрифирменного информирования\nДля эффективного внутрикорпоративного PR используются различные каналы\nкоммуникации.\n1. Корпоративные издания\nЭто:\n● внутрифирменные газеты;\n\n● журналы;\n\n● информационные бюллетени;\n\n● электронные рассылки.\n\nОни содержат новости компании, интервью с сотрудниками, информацию о\nдостижениях и планах организации.\n\n2. Корпоративный сайт и интранет\nВнутренняя сеть компании позволяет быстро распространять информацию среди\nсотрудников:\n● публиковать документы;\n\n● размещать объявления;\n\n● вести корпоративные форумы;\n\n● организовывать обучение.\n\nИнтранет является одним из самых удобных современных каналов внутренней\nкоммуникации.\n\n3. Электронная почта и мессенджеры\nС помощью электронной почты и корпоративных чатов сотрудники получают\nоперативную информацию, задания, уведомления и могут быстро связываться друг с\nдругом.\n\n4. Собрания и совещания\nЛичные встречи позволяют обсуждать рабочие вопросы, информировать коллектив о\nрешениях руководства и обеспечивать обратную связь.\n\n5. Информационные стенды\nВо многих организациях используются стенды с объявлениями, графиками работы,\nприказами, новостями и поздравлениями.\n\n6. Корпоративные мероприятия\nПраздники, тренинги, тимбилдинги, спортивные соревнования и конкурсы помогают\nукреплять коллектив и поддерживать корпоративную культуру.\n\n7. Социальные сети и корпоративные платформы\nНекоторые компании создают внутренние социальные сети или используют\nспециальные платформы для общения сотрудников и обмена информацией.\n\n8. Корпоративное радио и видео\nВ крупных организациях могут использоваться видеоновости, внутренние подкасты\nили корпоративное телевидение.\n\nЗначение внутрикорпоративного пиара\nЭффективный внутренний PR способствует:\n● повышению производительности труда;\n\n● улучшению морально-психологического климата;\n\n● снижению текучести кадров;\n\n● укреплению репутации компании;\n\n● формированию сплочённого коллектива.\n\nТаким образом, внутрикорпоративный пиар является важной частью системы\nуправления организацией. Он обеспечивает эффективное взаимодействие между\nруководством и сотрудниками, формирует корпоративную культуру и способствует\nуспешному развитию компании.\nИсточник: ГПТ","hint":"Внутрикорпоративный пиар — это система коммуникаций внутри организации, направленная на формирование благоприятного психологического климата, укрепление корпоративной культуры и поддержание эффективного взаимодействия между руководством и сотрудниками.","category":"PR-деятельность"},{"num":111,"title":"Правовые основы связей с общественностью.","answer":"Законодательные акты, регулирующие деятельность в сфере связей с\nобщественностью в России:\n1. Конституция РФ (статья 29) — гарантирует права физических и юридических\nлиц «свободно искать, получать, передавать, производить и распространять\nинформацию любым законным способом».\n2. Федеральный закон «О рекламе» от 13.03.2006 №38-ФЗ. Предъявляет\nобщие требования к рекламе, определяет, какая реклама недопустима,\nрассматривает особенности отдельных способов распространения рекламы.\n3. Закон «О средствах массовой информации» («О СМИ»). Содержит\nограничения на размещение рекламных и PR-материалов, основания для\nограничений — соблюдение государственной тайны, охрана частной жизни и\nдр.\n4. Законы, охраняющие государственную, служебную и коммерческую тайну.\nНапример, закон «О государственной тайне» содержит перечень сведений,\nсбор и распространение которых запрещены.\n\n5. Законодательство об авторском праве и смежных правах. Пресс-релизы,\nстатьи, доклады, слоганы, сценарии видеороликов — произведения,\nохраняемые этим законом. Например, в Гражданском Кодексе РФ дано\nопределение авторских прав и их границы. («Интеллектуальные права на\nпроизведения науки, литературы и искусства являются авторскими\nправами.»)\n\nВ большинстве случаев PR-деятельность регулируется косвенно — через смежные\nобласти деятельности. Например, для политического PR — выборное\nзаконодательство, регулирующее деятельность политических партий в период\nпредвыборных кампаний и между ними.\n\nЗа деятельностью в сфере связей с общественностью в России осуществляют\nконтроль следующие организации:\n· Федеральная антимонопольная служба (ФАС России) — контролирует\nсоблюдение законодательства о рекламе и недобросовестную конкуренцию\nв сфере связей с общественностью.\n· Российская ассоциация по связям с общественностью (РАСО) — регулирует\nдеятельность в сфере связей с общественностью, выпускает\nпрофессиональные стандарты и этические кодексы.\n· Управление Президента РФ по общественным связям и коммуникациям —\nсамостоятельное подразделение Администрации Президента РФ,\nзанимается анализом позиции СМИ и общественного мнения, координацией\nинформационной работы государственных органов.\nИсточники:\n\nef78313363ee73/","hint":"Законодательные акты, регулирующие деятельность в сфере связей с общественностью в России: 1.","category":"Правовые основы"},{"num":112,"title":"Что означает термин «фандрайзинговая деятельность»?","answer":"Фандрайзинговая деятельность — это деятельность по привлечению финансовых и\nиных ресурсов (деньги, товары, услуги, время людей) для реализации социальных,\nкультурных, благотворительных или общественно значимых проектов.\nПроще: это всё, что связано с тем, чтобы найти поддержку и ресурсы для проекта.\n\nОсновные источники фандрайзинга:\n• частные доноры (люди),\n• компании и спонсоры,\n• гранты от фондов и организаций,\n• государственная поддержка,\n• краудфандинг.\n\nПримеры:\n— благотворительный фонд собирает пожертвования\n— организация ищет спонсора для мероприятия\n— запуск проекта через платформы типа «сбер вместе»/ «planets.ru» / «kickstarter» (\n\nКак это работает:\n1. Автор выкладывает идею (например: фильм, игра, стартап, книга).\n\n2. Указывает, сколько денег нужно.\n3. Люди (доноры) могут поддержать проект, отправив любую сумму.\n4. Взамен часто получают бонусы: продукт, мерч или участие в проекте.\n\nВажный момент:\nесли проект не набирает нужную сумму — деньги обычно возвращаются обратно\nспонсорам.\n\nПример:\nкто-то хочет снять короткометражный фильм — вместо поиска одного крупного\nинвестора он собирает небольшие суммы от сотен людей.\n\nЭто хороший пример фандрайзинга, потому что:\n— ресурсы привлекаются из разных источников\n— есть чёткая цель\n— строится коммуникация с аудиторией)\n\nИсточник :","hint":"Фандрайзинговая деятельность — это деятельность по привлечению финансовых и иных ресурсов (деньги, товары, услуги, время людей) для реализации социальных, культурных, благотворительных или общественно значимых проектов.","category":"Прочее"},{"num":113,"title":"С какой целью проводится пресс-конференция?","answer":"Пресс-конференция — это форма коллективного интервью. Она позволяет получить\nофициальный комментарий из первых уст.\n\nВ отличие от других видов интервью, пресс-конференция — строго тематическое и\nформализованное мероприятие. Его цель — распространить конкретную информацию\nпо СМИ. Журналистам заранее объявляют повод и круг вопросов, которые готовы\nобсуждать организаторы.\n\nПресс-конференции организуют крупные компании и медийные личности: политики,\nспортсмены, музыканты. То есть игроки, чьи действия могут повлиять на рынок и\nпривлечь внимание массовой аудитории.\n\nИсточник:\n\npodgotovki/?utm_source=chatgpt.com","hint":"Пресс-конференция — это форма коллективного интервью.","category":"Прочее"},{"num":114,"title":"К константам фирменного/корпоративного стиля относятся…","answer":"Основные константы:\n● Товарный знак\n● Логотип\n● Слоган\n● Фирменные цвета\n● Шрифт\n● Маскот\n\n● Гайдлайн (брендбук) (детальное описание фирменного стиля компании,\nопределяющее правила использования основных его элементов, разрешенные\nкомбинации и правила расположения логотипа и текста)\n\nИз самого названия понятно, что константы — это неизменные компоненты\nфирменного стиля. Простыми словами: это элементы, по которым мы узнаём\nкомпанию, проект или продукт при любом контакте. Нужны они для того, чтобы лучше\nвас запомнить, т. е. выстроить связь между конкретным цветом или шрифтом с вашей\nкомпанией\nКонстанты помогают запомнить вашу компанию, делают её узнаваемой, выделяют\nсреди конкурентов. Не нужно напрягать память, чтобы вспомнить какой сотовый\nоператор использует жёлтый цвет, а какой красный.","hint":"Основные константы: ● Товарный знак ● Логотип ● Слоган ● Фирменные цвета ● Шрифт ● Маскот ● Гайдлайн (брендбук) (детальное описание фирменного стиля компании, определяющее правила использования основных его элементов, разрешенные комбинации и правила расположения логотипа и текста) Из самого названия понятно, что константы — это неизменные компоненты фирменного стиля.","category":"Прочее"},{"num":115,"title":"Укажите, какая реклама должна использоваться на стадии насыщения рынка товаром фирмы?","answer":"Основные типы рекламы по целям:\n\n● Информативная реклама (первоначальная): Направлена на информирование\nпотребителей о новом продукте, услуге или бренде, разъяснение принципов\nдействия и формирование первичного спроса.\n● Убеждающая реклама (конкурентная): Создает избирательный спрос, выделяя\nтовар среди аналогичных, убеждает купить именно этот продукт, подчеркивая\nпреимущества перед конкурентами.\n● Напоминающая реклама: Поддерживает спрос, заставляет потребителя\nвспоминать о товаре, особенно на стадии зрелости продукта.\n● Подкрепляющая реклама: Убеждает нынешних покупателей в правильности\nих выбора, снижая когнитивный диссонанс после покупки.\n\nКакая реклама нужна на стадии насыщения рынка?\nНа стадии насыщения рынка товаром фирмы в основном применяется\nнапоминающая (поддерживающая) реклама, а также имиджевая реклама.\n\nНапоминающая реклама нужна, чтобы:\n● не дать покупателям забыть о товаре;\n● поддерживать текущий спрос и лояльность;\n● сохранять долю рынка в условиях жесткой конкуренции.\nИмиджевая реклама помогает:\n● укрепить доверие к бренду;\n● подчеркнуть престиж и надежность фирмы;\n● удерживать существующих клиентов, когда рынок уже насыщен и рост продаж\nзамедляется.\nИсточник:\nikla_tovara.html ,","hint":"Основные типы рекламы по целям: ● Информативная реклама (первоначальная): Направлена на информирование потребителей о новом продукте, услуге или бренде, разъяснение принципов действия и формирование первичного спроса.","category":"Реклама"},{"num":116,"title":"Рекламная кампания – это комплекс (система) взаимосвязанных рекламных мероприятий, объединённых общей целью, концепцией и идеей, реализуемых в течение определённого периода времени с использованием различных средств рекламы и направленных на достижение конкретных маркетинговых целей организации.","answer":"Как правило, результатом рекламной кампании является убеждение потребителя в\nтом, что ему необходимо приобрести продвигаемый продукт или услугу.\n\nИмиджевая Продуктовая Торговая\n\nЧто продвигает Торговую марку Продукт или Конкретного\nкатегорию целом продавца\n\nЧто делает Формирует Информирует о Удовлетворяет спрос\nотношение к бренду, товарах или\nспрос\n\nЧем оперирует Атрибутами торговой Характеристиками Условиями покупки\nмарки продукта\n\nЦелевая аудитория Потенциально могла Могла бы купить Покупает сейчас\nбы купить\n\n•Имиджевая рекламная кампания направлена на формирование положительного\nобраза бренда и повышение лояльности аудитории через узнаваемые элементы\n(логотип, слоган). Обычно носит долгосрочный характер и не ориентирована напрямую\nна рост продаж; чаще используется крупными компаниями.\n\n•Торговая рекламная кампания направлена на продвижение конкретной точки продаж и\nстимулирование покупки. Делает акцент на выгодах (скидки, акции, доставка и т.д.) и\nориентирована на потребителей, уже знакомых с товаром. Требует меньших затрат и\nподходит для малого и среднего бизнеса.\n\n•Продуктовая рекламная кампания сосредоточена на продвижении конкретного товара\nили услуги. Основная цель — информировать аудиторию, особенно при выводе нового\nпродукта на рынок, подчёркивая его особенности и новизну.","hint":"Как правило, результатом рекламной кампании является убеждение потребителя в том, что ему необходимо приобрести продвигаемый продукт или услугу.","category":"Реклама"},{"num":117,"title":"Какая ответственность предусмотрена за нарушение положений 38-ФЗ «О рекламе»?","answer":"В соответствии со статьей 38 Федерального закона N 38-ФЗ \"О рекламе\" за нарушение\nположений Федерального закона предусмотрена следующие виды несения\nответственности:\n1. Гражданско-правовая ответственность\n2. Административная ответственность\n3. Федеральными законами за умышленное нарушение законодательства\nРоссийской Федерации о рекламе могут быть установлены иные меры\nответственности\n\nПоложения статьи 38, Федерального закона N 38-ФЗ \"О рекламе\":\n\n1. Нарушение физическими или юридическими лицами законодательства Российской\nФедерации о рекламе влечет за собой ответственность в соответствии с гражданским\nзаконодательством.\n\n2. Лица, права и интересы которых нарушены в результате распространения\nненадлежащей рекламы, вправе обращаться в установленном порядке в суд или\nарбитражный суд, в том числе с исками о возмещении убытков, включая упущенную\nвыгоду, о возмещении вреда, причиненного здоровью физических лиц и (или)\nимуществу физических или юридических лиц, о компенсации морального вреда, о\nпубличном опровержении недостоверной рекламы (контррекламе).\n\n3. В случае установления антимонопольным органом факта распространения\nнедостоверной рекламы и выдачи соответствующего предписания антимонопольный\nорган вправе обратиться в установленном порядке в суд или арбитражный суд с иском\nк рекламодателю о публичном опровержении недостоверной рекламы (контррекламе)\nза счет рекламодателя. При этом суд или арбитражный суд определяет форму, место и\nсроки размещения такого опровержения.\n\n4. Нарушение рекламодателями, рекламопроизводителями,\nрекламораспространителями, лицами, указанными в части 3.13 статьи 10 настоящего\nФедерального закона, законодательства Российской Федерации о рекламе влечет за\nсобой ответственность в соответствии с законодательством Российской Федерации об\nадминистративных правонарушениях.\n\n5. Федеральными законами за умышленное нарушение законодательства Российской\nФедерации о рекламе могут быть установлены иные меры ответственности.\n\n9. Суммы штрафов за нарушение законодательства Российской Федерации о рекламе\nи неисполнение предписаний антимонопольного органа зачисляются в бюджеты\nбюджетной системы Российской Федерации в порядке, предусмотренном Бюджетным\nкодексом Российской Федерации.\n\n10. Уплата штрафа не освобождает от исполнения предписания о прекращении\nнарушения законодательства Российской Федерации о рекламе.","hint":"В соответствии со статьей 38 Федерального закона N 38-ФЗ \"О рекламе\" за нарушение положений Федерального закона предусмотрена следующие виды несения ответственности: 1.","category":"Реклама"},{"num":118,"title":"SERM (Search Engine Reputation Management) – это…","answer":"SERM (Search Engine Reputation Management) — это управление репутацией бренда\nили компании в поисковых системах. Цель SERM — сформировать положительный\n\nимидж бренда, контролировать и улучшать то, что пользователи видят в поисковой\nвыдаче, а также минимизировать влияние негативной информации.\nКлючевые аспекты:\n\n● Фокус на результатах поисковой выдачи. В отличие от ORM (Online\nReputation Management), который работает с онлайн-репутацией в целом\n(форумы, соцсети, блоги, СМИ), SERM сосредоточен исключительно на\nрезультатах поиска в поисковых системах (например, в Яндексе и Google).\n● Комплексный подход. Включает элементы SEO, PR и антикризисного\nуправления.\n● Цель — вытеснить негативную информацию и продвинуть позитивную.\nЗадача — сделать так, чтобы при поиске информации о компании пользователи\nнаходили больше позитивных и меньше негативных результатов.\n● Использование различных инструментов и стратегий. Среди них —\nмониторинг упоминаний, работа с отзывами, создание и продвижение\nпозитивного контента, SEO-продвижение материалов, взаимодействие с\nлидерами мнений.\n● Необходимость постоянного мониторинга и корректировки стратегии.\nАлгоритмы поисковых систем регулярно меняются, появляются новые\nупоминания, что требует адаптации подходов.\n\nОсновные инструменты:\n\n● Аналитика и мониторинг. Это основа любого SERM. Важно отслеживать все\nупоминания бренда в Сети, анализировать тональность и выявлять\nпроблемные зоны. Регулярный аудит позволяет понимать общее настроение\nаудитории и оперативно реагировать на негатив.\n● Чёткое позицонирование бренда. В маркетинге SERM начинается с того,\nкакой образ компания формирует сама. Важно донести до аудитории\nуникальные преимущества и ценности, чтобы повлиять на её восприятие.\nНапример, интернет-магазин может делать акцент на скорости доставки\nзаказов.\n● SMM. Маркетинг в социальных сетях — достаточно эффективный инструмент\nSERM. Активное присутствие в соцсетях позволяет формировать лояльное\nсообщество, быстро реагировать на обратную связь и нивелировать негатив.\n● Контент-маркетинг. Компании публикуют статьи, посты или видеоролики,\nчтобы контролировать нарратив в интернете и рассказать о себе потенциальной\nаудитории. Если контент помогает решить задачу клиента или демонстрирует\nэкспертность бренда, репутация может улучшиться. Допустим, человек читает\nкейс, что в строительстве стадиона использовали трубы от конкретного\nпроизводителя. После этого он скорее станет доверять этой организации и в\nслучае ремонта обратится к ней.\n● Работа со сторонними площадками. К ним относятся отзовики, форумы,\nмаркетплейсы и тематические порталы. Поскольку именно там часто\nсосредоточена аудитория, важно присутствовать на этих ресурсах: отвечать на\nотзывы, публиковать экспертные комментарии и исправлять неточную\nинформацию.\n● Проактивное управление отзывами. Важно активно мотивировать довольных\nпокупателей оставлять обратную связь, а также оперативно отрабатывать\nнегатив. Так другие пользователи увидят, что компания заботится о клиентах, и\nих доверие к бренду может усилиться.\n\nПреимущества:\n\n1. Помогает увеличить число конверсий. Если человеку попадаются\nпреимущественно положительные отзывы, он с большей вероятностью дойдёт\nдо конца воронки продаж.\n2. Позволяет укрепить лояльность аудитории. Когда бренды регулярно\nпроверяют и реагируют на обратную связь, доверие клиентов может вырасти.\n3. Подсвечивает проблемные точки. Объективное мнение от пользователей\nпомогает понять слабые места компании. В результате бизнес вовремя\nзамечает, что нужно исправить.\n\nНедостатки:\n\n1. Нельзя использовать одну и ту же стратегию. Результаты выдачи меняются,\nпоэтому компаниям необходимо мониторить показатели. В зависимости от\nситуации стратегию нужно пересматривать.\n2. Нужно комбинировать с другими инструментами. Особенно — с ORM. Если\nсузить работу над репутацией только до SERM, добиться нужного результата\nбудет крайне сложно.\n\nИсточники: secrets.tbank.ru , practicum.yandex.ru, skillbox.ru,","hint":"Цель SERM — сформировать положительный имидж бренда, контролировать и улучшать то, что пользователи видят в поисковой выдаче, а также минимизировать влияние негативной информации.","category":"Digital и SMM"},{"num":119,"title":"SEO (Search Engine Optimization) – это…","answer":"SEO (Search Engine Optimization) — это комплекс методов и мероприятий по\nоптимизации сайта для повышения его позиций в результатах выдачи поисковых\nсистем (например, Google или Yandex) по релевантным запросам пользователей с\nцелью увеличения органического (неплатного) трафика, роста видимости сайта,\nповышения конверсии и привлечения ЦА","hint":"SEO (Search Engine Optimization) — это комплекс методов и мероприятий по оптимизации сайта для повышения его позиций в результатах выдачи поисковых систем (например, Google или Yandex) по релевантным запросам пользователей с целью увеличения органического (неплатного) трафика, роста видимости сайта, повышения конверсии и привлечения ЦА","category":"Digital и SMM"},{"num":120,"title":"Общественное мнение – это…","answer":"С точки зрения рекламы и PR, общественное мнение — это состояние массового\nсознания, отражающее скрытое или явное отношение людей к бренду, товару или\nорганизации.\n\nЭто ключевой объект воздействия, который формируется через обсуждения и\nстереотипы, а его изучение позволяет управлять репутацией, корректировать\nкоммуникационную стратегию и прогнозировать поведение целевой аудитории.\n\nКлючевые аспекты общественного мнения для рекламы и PR:\n● Инструмент оценки: Общественное мнение помогает понять, как\nвоспринимается товар/услуга и деятельность организации.\n● Результат коммуникации: В PR-деятельности это главный индикатор\nэффективности, показывающий, насколько успешно создается позитивный\nимидж.\n● Социальная основа: Оно возникает не просто как сумма взглядов, а как\nколлективное мнение, прошедшее через дискуссию.\n● Управление через обратную связь: Мониторинг отзывов, комментариев и\nвлияние лидеров мнений используются для оперативной корректировки\nимиджа.\n\nВ отличие от рекламы, которую можно контролировать, PR работает с общественным\nмнением, которое труднопредсказуемо, но оказывает решающее влияние на успех.","hint":"С точки зрения рекламы и PR, общественное мнение — это состояние массового сознания, отражающее скрытое или явное отношение людей к бренду, товару или организации.","category":"Общественное мнение"}];
const TEST_THEMES = [{"category":"Медиа и теория","questions":[{"q":"Кто определил пропаганду как «менеджмент коллективных мнений с помощью манипуляций значимыми символами»?","options":["Эдвард Бернейс","Гарольд Лассуэлл","Уолтер Липпман","Жак Эллюль"],"correct":1,"expl":"Это определение Гарольда Лассуэлла из работы «Техника пропаганды во время мировой войны» (1927). Бернейс писал об «инжиниринге согласия», Липпман — о стереотипах и «псевдосреде», Эллюль — о тотальной пропаганде.","ref":1},{"q":"Какие две составляющие пропаганды выделял Лассуэлл?","options":["Логос и пафос","Прайминг и фрейминг","Креденды и миранды","Симулякр и симуляция"],"correct":2,"expl":"Креденды (доверие) — рациональная часть: доктрины, конституции, договоры. Миранды (мираж) — эмоциональная: ритуалы, символы, лозунги. Логос/пафос — это Аристотель, прайминг/фрейминг — теории манипуляции медиа, симулякр — Бодрийяр.","ref":1},{"q":"Какие задачи военной пропаганды выделял Лассуэлл?","options":["Поднимать боевой дух, цензурировать прессу, обучать солдат","Возбуждать ненависть к врагу, поддерживать союзников, деморализовать противника","Информировать о ходе войны, координировать тыл, готовить резервы","Объединять нацию, оправдывать потери, прославлять героев"],"correct":1,"expl":"Анализируя ПМВ, Лассуэлл выделил именно три внешних задачи: возбуждать ненависть к врагу, поддерживать отношения с союзниками и нейтральными государствами, деморализовать противника. Остальное — общие функции, но не лассуэллова триада.","ref":1},{"q":"С чем прежде всего связана роль связей с общественностью в современном обществе?","options":["С прямым стимулированием продаж через скидки и акции","С формированием позитивного имиджа и поддержанием репутации","С разработкой нормативной базы коммуникационной деятельности","С агрегацией данных о потребительском поведении"],"correct":1,"expl":"PR — это системная работа по созданию позитивного имиджа и поддержанию репутации. Стимулирование продаж — задача стимулирующей рекламы и трейд-маркетинга, нормативная база — задача GR/юристов, агрегация данных — это маркетинговая аналитика.","ref":2},{"q":"Кто разработал нормативные модели функционирования массмедиа в обществе?","options":["Уилбур Шрамм","Денис Маккуэйл","Юрген Хабермас","Гарольд Иннис"],"correct":1,"expl":"Британский социолог Денис Маккуэйл (1935–2017) разработал нормативные модели массмедиа. Шрамм — соавтор «Четырёх теорий прессы» (1956), Хабермас — теории публичной сферы, Иннис — теории смещения медиа.","ref":3},{"q":"Под «высшей формой информации» в информационном обществе чаще всего понимают:","options":["оперативные данные в реальном времени","знания, особенно научные","массовый медиаконтент","персонализированную информацию"],"correct":1,"expl":"Высшая форма информации — это знания, особенно научные, приобретённые в процессе познавательной деятельности. Знание отличается от «сырой» информации (включая оперативные данные и медиаконтент) глубиной, осмысленностью и пройденной рефлексией.","ref":6},{"q":"Кому принадлежит формула «The medium is the message» («Медиа — это сообщение»)?","options":["Мануэлю Кастельсу","Маршаллу Маклюэну","Гарольду Иннису","Нилу Постману"],"correct":1,"expl":"Это фраза Маршалла Маклюэна из книги «Понимание медиа» (1964). Иннис — его учитель, развивал близкие идеи о медиа, но эту формулировку ввёл именно Маклюэн. Кастельс писал о сетевом обществе, Постман — о деградации публичного дискурса.","ref":7},{"q":"Что НЕ относится к функциям медиа, способствующим культурному обмену?","options":["Образовательная функция","Сегрегационная функция, создающая инфо-пузыри","Интегрирующая функция","Просветительская функция"],"correct":1,"expl":"Сегрегационная функция создаёт информационные «пузыри», где аудитория получает контент только своей группы — это препятствует культурному обмену. Образовательная, интегрирующая и просветительская, наоборот, ему способствуют.","ref":8},{"q":"Согласно теории Уолтера Липпмана, существует расхождение между…","options":["элитой и массами в политическом участии","«псевдосредой» в сознании людей и реальной действительностью","скоростью передачи информации и её усвоением","медиаконтентом и пользовательским опытом"],"correct":1,"expl":"Центральный тезис Липпмана в «Общественном мнении» (1922): люди реагируют не на реальный мир, а на «псевдосреду» — упрощённую картину из новостей и стереотипов. Остальные варианты — реальные проблемы коммуникации, но не суть теории Липпмана.","ref":9},{"q":"Согласно теории ограниченных эффектов Лазарсфельда, влияние СМИ:","options":["прямо и мгновенно меняет установки большинства","не является прямым: опосредовано лидерами мнений и социальными связями","действует только в долгосрочной перспективе через культивацию","сильнее всего проявляется в кризисные периоды"],"correct":1,"expl":"Теория ограниченных эффектов (Лазарсфельд, 1940-60-е): СМИ не обладают прямым всесильным эффектом — влияние опосредовано лидерами мнений (двухступенчатая модель), соцстатусом и установками. Прямое влияние — это теория «магической пули», культивация — теория Гербнера.","ref":10},{"q":"Какую роль играют медиа на ранних стадиях согласно теории диффузии инноваций Э. Роджерса?","options":["Главный канал убеждения для большинства пользователей","Источник первичной осведомлённости о новинке","Инструмент удержания поздних последователей","Барьер на пути распространения новых идей"],"correct":1,"expl":"По Роджерсу, медиа эффективны именно на ранних стадиях — для осведомлённости (awareness) у early adopters. Для убеждения и принятия решения более важны межличностные каналы и лидеры мнений — это ключевое различие в его модели.","ref":11},{"q":"Что НЕ характерно для либертарианской модели прессы?","options":["Свободная конкуренция мнений на «рынке идей»","Лицензирование изданий и подчинение интересам государства","Право критиковать власть","Частная собственность на СМИ"],"correct":1,"expl":"Либертарианская модель (Сиберт, Питерсон, Шрамм) исходит из минимального вмешательства государства, частной собственности и свободной конкуренции мнений. Лицензирование и подчинение государству — признаки авторитарной модели.","ref":12},{"q":"Как Лассуэлл оценивал пропаганду с этической точки зрения?","options":["Как абсолютное зло, разрушающее демократию","Как инструмент, который сам по себе ни плох, ни хорош","Как необходимое средство социального прогресса","Как явление, морально оправданное только в военное время"],"correct":1,"expl":"Лассуэлл считал пропаганду инструментом, который сам по себе не может быть признан ни плохим, ни хорошим. Пагубна не пропаганда как таковая, а трансляция и насаждение неблагоприятных для общества идей.","ref":1},{"q":"В каком году вышла работа Лассуэлла «Техника пропаганды во время мировой войны»?","options":["1918","1927","1948","1954"],"correct":1,"expl":"«Propaganda Technique in the World War» вышла в 1927 году — через 9 лет после окончания ПМВ. 1948 — год другой важной работы Лассуэлла о структуре коммуникации (формула «Кто-Что-Кому-По какому каналу-С каким эффектом»).","ref":1},{"q":"В какой книге Маклюэн изложил идею «медиа — это сообщение»?","options":["«Галактика Гутенберга» (1962)","«Понимание медиа: Внешние расширения человека» (1964)","«Война и мир в глобальной деревне» (1968)","«Законы медиа» (1988)"],"correct":1,"expl":"Формула «The medium is the message» — название первой главы книги «Understanding Media: The Extensions of Man» (1964). «Галактика Гутенберга» — более ранняя работа о письменности и печати. Остальные — его поздние работы.","ref":7},{"q":"Что Липпман называл «псевдосредой»?","options":["искажённую картину мира официальной пропаганды","ментальную картинку мира из новостей, слухов и стереотипов","виртуальное пространство массовых коммуникаций","набор поверхностных стереотипов о других культурах"],"correct":1,"expl":"«Псевдосреда» по Липпману — это ментальная картинка мира в сознании каждого человека, созданная новостями, слухами и стереотипами. Это не только пропаганда и не только стереотипы — это вся ментальная карта, на которую люди реагируют вместо реального мира.","ref":9},{"q":"Кто активно развивал теорию ограниченных эффектов СМИ в 1940-60-х годах?","options":["Уилбур Шрамм","Пол Лазарсфельд","Гарольд Лассуэлл","Курт Левин"],"correct":1,"expl":"Теорию ограниченных эффектов развивал Пол Лазарсфельд в исследованиях избирательных кампаний («The People's Choice», 1944). Лассуэлл работал в парадигме сильных эффектов, Шрамм — общая теория коммуникации, Левин — групповая динамика.","ref":10},{"q":"Чем знание отличается от информации?","options":["объёмом данных и скоростью передачи","осмысленностью, структурированностью и пройденной рефлексией","способом хранения и доступности","источником происхождения"],"correct":1,"expl":"Знание — осмысленная, структурированная и проверенная информация, интегрированная с опытом через рефлексию и критическое мышление. Объём, источник и способ хранения не делают информацию знанием.","ref":6},{"q":"Что, по Лассуэллу, должно произойти с управлением пропагандой в условиях войны?","options":["должно быть передано независимым гражданским институтам","должно перейти в официальные руки научной технократии","должно быть полностью децентрализовано","должно остаться в руках военного командования"],"correct":1,"expl":"Лассуэлл предлагал передать управление пропагандой научной технократии, которая отбирала бы информацию и противостояла угрозам демократии. Не военным, не независимым институтам, не децентрализации.","ref":1},{"q":"Какова главная цель пропаганды по Лассуэллу?","options":["идеологическое перевоспитание граждан","мобилизация и консолидация масс вокруг единой цели","установление монополии на трактовку событий","формирование устойчивых стереотипов"],"correct":1,"expl":"Цель пропаганды — мобилизовать и консолидировать массы вокруг единой цели, адаптируя сообщения под разные социальные группы. Перевоспитание, монополия на трактовку и формирование стереотипов — отдельные средства, а не общая цель.","ref":1},{"q":"Что Маклюэн считал высшей формой медиа?","options":["телевидение, как синтез текста, звука и изображения","книгу, демонстрирующую опыт и экспертность автора","газету как зеркало общественной жизни","радио как «горячий» медиум прямого воздействия"],"correct":1,"expl":"Маклюэн считал книгу высшей формой медиа: сам факт её создания демонстрирует опыт и экспертность автора. ТВ и радио в его классификации — «холодный» и «горячий» медиумы соответственно, но не высшая форма.","ref":7},{"q":"За что Липпман критиковал идеал «просвещённого гражданина»?","options":["За абстрактность и недостижимость","Обычный человек не имеет времени и возможности глубоко разбираться в политике","За слепую веру в авторитеты и экспертов","За отрыв от классовых интересов"],"correct":1,"expl":"Липпман («демократический реализм») критиковал идеал просвещённого гражданина именно потому, что обычный человек не имеет ни времени, ни возможности глубоко разбираться в политике. Он выступал за участие экспертов в управлении.","ref":9},{"q":"С какой концепцией связан феномен мейнстриминга?","options":["с теорией когнитивного диссонанса Фестингера","с теорией культивации Джорджа Гербнера","с теорией использования и удовлетворения Каца","с теорией социального научения Бандуры"],"correct":1,"expl":"Мейнстриминг — феномен из теории культивации Дж. Гербнера: люди, потребляющие много однотипного контента (особенно ТВ), со временем одинаково смотрят на мир. Остальные теории — другие направления исследований медиа.","ref":5}]},{"category":"Общественное мнение","questions":[{"q":"В чём суть «навязывания повестки дня» (agenda-setting)?","options":["СМИ диктуют людям, ЧТО думать о событиях","СМИ не говорят, ЧТО думать, но определяют, О ЧЁМ думать","СМИ контролируют интерпретацию событий через выбор экспертов","СМИ задают эмоциональную окраску информации"],"correct":1,"expl":"Тонкое различие: agenda-setting не управляет содержанием мыслей (это уже фрейминг), а отбирает «5–10 главных» тем дня. Контроль интерпретаций ближе к фреймингу, эмоциональная окраска — к праймингу.","ref":5},{"q":"Что такое фрейминг в манипуляции общественным мнением?","options":["Способ упаковки информации, задающий рамку интерпретации","Технология выделения главных тем дня в новостях","Метод повторения одного сообщения через разные каналы","Приём создания эмоциональной привязки к бренду"],"correct":0,"expl":"Фрейминг — смысловая упаковка: одно событие можно подать как «борцы за свободу» или «массовые беспорядки». Выделение тем — это agenda-setting, повторение через каналы — медиапланирование, эмоциональная привязка — брендинг.","ref":5},{"q":"Что такое прайминг?","options":["Активация в памяти определённых ассоциаций перед вынесением суждения","Долгосрочное формирование картины мира через однотипный контент","Манипуляция числовыми данными для создания нужного впечатления","Технология выбора лидеров мнений для распространения сообщений"],"correct":0,"expl":"Прайминг — «предварительная настройка»: СМИ активируют нужные ассоциации непосредственно перед тем, как человек выносит суждение (например, сюжеты о коррупции перед новостью о назначении министра). Долгосрочное формирование — это культивация.","ref":5},{"q":"В чём суть мейнстриминга (связанного с теорией культивации Дж. Гербнера)?","options":["Распространение трендов через лидеров мнений","Сглаживание различий во мнениях разных групп к единому стандарту","Концентрация медиаресурсов в руках мейнстрим-СМИ","Доминирование одной темы в новостной повестке"],"correct":1,"expl":"Мейнстриминг — сглаживание различий мнений разных групп под влиянием однотипного медиаконтента, создающее иллюзию «всеобщего согласия». Это не про лидеров мнений, не про концентрацию медиа и не про повестку.","ref":5},{"q":"Кто автор концепции «спираль молчания»?","options":["Гарольд Лассуэлл","Элизабет Ноэль-Нойман","Юрген Хабермас","Пьер Бурдьё"],"correct":1,"expl":"«Спираль молчания» — концепция немецкого социолога Элизабет Ноэль-Нойман (1916–2010), основательницы Института демоскопии в Алленсбахе. Человек реже высказывает мнение, если считает его непопулярным, боясь изоляции.","ref":4},{"q":"Общественное мнение с точки зрения PR — это:","options":["усреднённая позиция большинства по социальным вопросам","состояние массового сознания, отражающее отношение к бренду или организации","статистически измеримый показатель социологических опросов","совокупность экспертных оценок в публичном пространстве"],"correct":1,"expl":"В PR-парадигме общественное мнение — это именно состояние массового сознания, отражающее скрытое или явное отношение людей к бренду, товару, организации. Это объект воздействия, а не просто статистика или экспертные оценки.","ref":120},{"q":"Чем PR принципиально отличается от рекламы в работе с общественным мнением?","options":["PR работает в долгую, реклама — на краткосрочный результат","Реклама контролируема, а PR работает с труднопредсказуемым мнением","PR использует только бесплатные каналы, реклама — только платные","PR апеллирует к разуму, реклама — к эмоциям"],"correct":1,"expl":"Ключевое различие в управляемости: реклама — контролируемое платное сообщение, а PR работает с общественным мнением, которое труднопредсказуемо. Прочие различия (срок, бюджет, апелляция) — частные, не всегда верные.","ref":120}]},{"category":"PR-деятельность","questions":[{"q":"Какой характер коммуникации принципиально отличает PR от пропаганды?","options":["Информационная насыщенность сообщений","Двусторонний характер с обратной связью и диалогом","Использование платных каналов размещения","Опора на эмоциональные апелляции"],"correct":1,"expl":"Ключевое отличие именно в характере: PR — двусторонняя коммуникация с диалогом и обратной связью, пропаганда — односторонняя без диалога. Информационная насыщенность, каналы и эмоции есть и там, и там.","ref":1},{"q":"В каком порядке идут этапы цикла RACE?","options":["Reach → Act → Convert → Engage","Research → Action planning → Communication → Evaluation","Recognition → Analysis → Concept → Execution","Review → Adapt → Communicate → Evaluate"],"correct":1,"expl":"RACE в PR = Research (Исследование) → Action planning (Планирование) → Communication (Выполнение) → Evaluation (Оценка). Не путать с RACE Дейва Чаффи в digital (Reach→Act→Convert→Engage) — это другая модель.","ref":19},{"q":"Что относится к этапу Research в модели RACE?","options":["SWOT-анализ, STEP-анализ, изучение стейкхолдеров","Постановка SMART-целей и построение «дерева целей»","Подготовка пресс-релизов и проведение мероприятий","Замер охватов, упоминаний и индекса лояльности"],"correct":0,"expl":"На этапе Research проводятся именно аналитические работы: SWOT, STEP, анализ стейкхолдеров, конкурентный анализ. SMART-цели — следующий этап (Action planning). Пресс-релизы — Communication. Замеры — Evaluation.","ref":19},{"q":"С чего начинается подготовка любого PR-мероприятия?","options":["С формирования рабочей команды и распределения ролей","С определения цели и задач, исходя из которых выбираются формат и бюджет","С анализа доступных площадок и подрядчиков","С согласования концепции с руководством"],"correct":1,"expl":"Первый шаг — определить, ЗАЧЕМ проводится мероприятие. От цели зависит формат, аудитория, бюджет и всё остальное. Команда, площадки и согласования — последующие этапы.","ref":16},{"q":"Что такое целевая аудитория (ЦА) в PR в отличие от контактной группы?","options":["Стратегически выбранная группа, на которую направлено основное воздействие","Все аудитории, потенциально влияющие на достижение целей","Группа лояльных потребителей, готовых к покупке","Сегмент аудитории с наибольшим потребительским потенциалом"],"correct":0,"expl":"ЦА — стратегически выбранная часть общественности, на которую направлено основное PR-воздействие. «Все потенциально влияющие» — это контактные группы (более широкое). Лояльные потребители и сегмент с потенциалом — маркетинговые понятия.","ref":15},{"q":"Что такое контактная группа в PR (по Котлеру)?","options":["Сегмент целевой аудитории с наибольшим коммерческим интересом","Любая группа, которая реально или потенциально влияет на достижение целей организации","База лояльных клиентов и партнёров организации","Совокупность каналов взаимодействия с потребителями"],"correct":1,"expl":"Контактные группы (publics) по Котлеру — любые группы, проявляющие интерес или влияющие на достижение целей. Среди них — благотворные, искомые и нежелательные. Это шире, чем ЦА (стратегически выбранная часть).","ref":15},{"q":"Процесс планирования и реализации коммуникационных стратегий для целей связей с общественностью — это:","options":["интегрированные маркетинговые коммуникации","PR-деятельность (паблик рилейшнз)","медиарилейшнз","коммуникационный менеджмент"],"correct":1,"expl":"Это определение именно PR-деятельности. ИМК — согласование всех каналов продвижения (шире, включает рекламу и стимулирование сбыта). Медиарилейшнз — только работа со СМИ. Коммуникационный менеджмент — общая управленческая дисциплина.","ref":17},{"q":"Короткая фраза, раскрывающая суть компании, продукта или персоны — это:","options":["миссия","слоган","тэглайн","оффер"],"correct":1,"expl":"Слоган — короткая фраза-девиз с главным сообщением бренда. Миссия — развёрнутое заявление о цели компании. Тэглайн ближе к слогану, но обычно более узкий (часто для кампании). Оффер — конкретное коммерческое предложение.","ref":18},{"q":"Медиарилейшнз — это направление PR, которое:","options":["управляет всеми внешними коммуникациями организации","выстраивает отношения со СМИ и журналистами","занимается мониторингом и анализом упоминаний в СМИ","разрабатывает контент-стратегию для собственных каналов"],"correct":1,"expl":"Медиарилейшнз (media relations) — направление PR именно по выстраиванию отношений со СМИ и журналистами. Внешние коммуникации шире (включают и прямые с ЦА). Мониторинг — лишь часть. Контент-стратегия — отдельное направление.","ref":13},{"q":"Что относится к этапу Evaluation в модели RACE?","options":["Постановка целей через SMART и «дерево целей»","Опросы ЦА, анализ продаж, мониторинг СМИ, индекс лояльности","Разработка ключевых сообщений и каналов","Анализ стейкхолдеров и конкурентов"],"correct":1,"expl":"Evaluation — финальный этап оценки эффективности: опросы ЦА, анализ продаж, медиамониторинг, NPS, конверсия. Постановка целей — Action planning, ключевые сообщения — тоже Action planning, анализ конкурентов — Research.","ref":19},{"q":"Какая функция PR обеспечивает двустороннюю связь с аудиторией?","options":["информационная","коммуникативная","репутационная","аналитическая"],"correct":1,"expl":"Именно коммуникативная функция обеспечивает двусторонний обмен между организацией и аудиторией — не только говорить, но и слушать. Информационная — донесение, репутационная — управление мнением, аналитическая — изучение.","ref":17},{"q":"Какой набор функций отражает специфику PR-деятельности?","options":["продающая, имиджевая, информационная, юридическая","коммуникативная, имиджевая, репутационная, аналитическая, прогностическая","брендинговая, рекламная, медийная, антикризисная","корпоративная, политическая, социальная, кризисная"],"correct":1,"expl":"Это классический набор функций PR: коммуникативная, имиджевая, репутационная, информационная, аналитическая, прогностическая, управленческая, кризисная. Прочие списки смешивают функции с направлениями или с другими дисциплинами.","ref":17},{"q":"Что должно быть итогом первого этапа подготовки мероприятия?","options":["Утверждённый сценарий и список спикеров","Бриф/концепция: Цель — Аудитория — Формат — Бюджет — Дата","Договор с площадкой и сметы подрядчиков","Утверждённый медиаплан и список приглашённых СМИ"],"correct":1,"expl":"Итог первого этапа — сформированный бриф или концепция с фиксированными базовыми параметрами (цель, аудитория, формат, бюджет, дата). Сценарии, договоры и медиапланы — следующие этапы, опирающиеся на этот бриф.","ref":16},{"q":"Какие функции выполняет слоган?","options":["имиджевую, продающую, эмоциональную, юридическую","информационную, имиджевую, мнемоническую, коммуникативную","рекламную, брендинговую, маркетинговую, репутационную","убеждающую, информирующую, напоминающую, подкрепляющую"],"correct":1,"expl":"Функции слогана: информационная (суть предложения), имиджевая (образ бренда), мнемоническая (запоминание), коммуникативная (связь с аудиторией). Юридическая — не его функция; убеждение/напоминание — функции рекламы в целом.","ref":18},{"q":"Что используется на этапе Action planning в RACE для постановки целей?","options":["SWOT-анализ и анализ конкурентов","Методики «Дерево целей» и SMART","Карта эмпатии и карта пути клиента","KPI и медиамониторинг"],"correct":1,"expl":"Цели на Action planning ставят через «Дерево целей» (иерархия) и SMART (конкретность, измеримость, достижимость, значимость, время). SWOT — на Research. Карты ЦА — тоже на Action planning, но для аудитории, не для целей. KPI — Evaluation.","ref":19},{"q":"Что происходит на этапе Communication в модели RACE?","options":["Анализ среды и конкурентов","Реализация кампании по плану с постоянным мониторингом","Постановка целей и разработка ключевых сообщений","Замер достигнутых результатов и индексов лояльности"],"correct":1,"expl":"Communication — этап непосредственной реализации кампании в строгом соответствии с планом, с постоянным мониторингом хода. Анализ среды — Research, цели и сообщения — Action planning, замер результатов — Evaluation.","ref":19},{"q":"Какая функция PR отвечает за предсказание реакций и предотвращение кризисов?","options":["аналитическая","прогностическая","кризисная","управленческая"],"correct":1,"expl":"Прогностическая функция направлена именно на предсказание реакций общества и предотвращение кризисов. Аналитическая — изучает текущее мнение, кризисная — работает уже в кризисе, управленческая — участие в принятии решений.","ref":17},{"q":"Сколько групп ЦА оптимально планировать на одну PR-кампанию?","options":["одну-две","три-четыре","все ключевые сегменты","зависит только от бюджета"],"correct":0,"expl":"Лучше планировать одну PR-кампанию на одну-две группы целевой аудитории — это позволяет точно адаптировать сообщения. Большее число групп размывает фокус и снижает эффективность.","ref":101}]},{"category":"Антикризисный PR","questions":[{"q":"Каков ключевой принцип антикризисного PR в первые часы?","options":["Тщательная проверка всех фактов перед заявлениями","Скорость реакции и работа на опережение","Минимизация контактов со СМИ до выяснения деталей","Привлечение независимых экспертов и юристов"],"correct":1,"expl":"Реакция должна последовать в первые сутки. Промедление создаёт информационный вакуум, заполняемый слухами. Тщательная проверка важна, но не заменяет быстрого первого комментария «мы разбираемся».","ref":23},{"q":"На что в первую очередь направлен антикризисный PR?","options":["На стабилизацию финансовых показателей компании","На минимизацию негативных последствий для репутации","На юридическую защиту от исков и претензий","На предотвращение оттока сотрудников"],"correct":1,"expl":"Главная цель — минимизация репутационных потерь, сохранение доверия и быстрое восстановление имиджа. Финансы, юридика и кадры — связанные, но отдельные задачи (антикризисный менеджмент в целом).","ref":20},{"q":"Что такое репутационный кризис с точки зрения антикризисного PR?","options":["Долгосрочное снижение лояльности после серии негативных событий","Неожиданное событие, выходящее из-под контроля и наносящее ущерб репутации","Резкое падение упоминаний бренда в позитивном контексте","Возникновение организованной негативной кампании против бренда"],"correct":1,"expl":"Репутационный кризис — именно неожиданное событие или их серия, выходящее из-под контроля, прерывающее нормальное функционирование организации. Долгосрочное снижение лояльности — это другая проблема, а не кризис.","ref":21},{"q":"Какой принцип НЕ относится к антикризисному PR?","options":["Оперативность реагирования","Замалчивание проблемы до её самоликвидации","Информационная открытость и честность","Сплочённость команды и единый голос"],"correct":1,"expl":"Замалчивание прямо противоречит антикризисному PR. Базовые принципы: оперативность, открытость, честность, инициатива, координация, работа сразу с несколькими аудиториями (СМИ, клиенты, партнёры, регуляторы).","ref":23},{"q":"Антикризисный пиар представляет собой:","options":["реактивные действия PR-отдела после возникновения проблемы","комплекс мер по прогнозированию, недопущению или преодолению кризиса репутации","систему юридической защиты деловой репутации компании","экстренные коммуникации с инвесторами в момент падения акций"],"correct":1,"expl":"Антикризисный PR — комплексная деятельность, включающая прогнозирование, профилактику И преодоление. Сводить только к реактивным действиям или к юридической защите — слишком узко.","ref":22},{"q":"Что означает принцип «инициативы» в антикризисном PR?","options":["Первым предложить план компенсации пострадавшим","Стать главным источником новостей о ситуации, даже негативных","Опередить конкурентов в публичных заявлениях","Первым обратиться в государственные органы"],"correct":1,"expl":"Принцип инициативы: нужно стать главным источником новостей о ситуации. Журналисты будут брать информацию у вас, если вы даёте её первыми и в деталях. Иначе они найдут её сами — с непредсказуемыми трактовками.","ref":23},{"q":"Что означает принцип честности в антикризисном PR?","options":["Раскрывать всю внутреннюю информацию по запросу СМИ","Открыто признать ошибку, первым дать комментарий и план действий","Не использовать платные публикации в свою защиту","Согласовывать все заявления с независимыми экспертами"],"correct":1,"expl":"Честность по антикризисному PR — это именно открытое признание ошибки + первый комментарий + публичный план действий. Не «раскрывать всё подряд» (это рискованно для интересов компании) и не отказываться от платных публикаций.","ref":23},{"q":"Какая классификация типов кризисов используется в антикризисном PR?","options":["финансовые, репутационные, операционные, кадровые","технологические, конфронтационные, кризисы
