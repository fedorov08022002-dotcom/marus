<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<title>Тренажёр ГИА 2026 — PR и коммуникации</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #F4EEDF;
  --bg-paper: #FAF5E8;
  --ink: #2A2520;
  --ink-soft: #5C5249;
  --ink-faint: #8A7F73;
  --accent: #4A6B3A;
  --accent-dark: #2F4423;
  --accent-soft: #E8E4D4;
  --ochre: #B5651D;
  --ochre-soft: #F5E6D3;
  --rule: #D9CFB8;
  --red: #A04030;
  --red-soft: #F0DCD5;
  --green: #4A6B3A;
  --green-soft: #DCE6CE;
  --amber: #C08930;
  --amber-soft: #F5E6C9;
  --shadow: 0 1px 0 rgba(42,37,32,0.04), 0 4px 16px rgba(42,37,32,0.06);
  --shadow-lg: 0 2px 0 rgba(42,37,32,0.04), 0 12px 40px rgba(42,37,32,0.10);
}

html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Manrope', -apple-system, system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.55;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}

body {
  background-image:
    radial-gradient(at 20% 10%, rgba(181,101,29,0.04) 0px, transparent 50%),
    radial-gradient(at 80% 90%, rgba(74,107,58,0.04) 0px, transparent 50%);
  background-attachment: fixed;
}

.app {
  display: grid;
  grid-template-columns: 340px 1fr;
  min-height: 100vh;
  max-width: 1440px;
  margin: 0 auto;
}

/* === SIDEBAR === */
.sidebar {
  background: var(--bg-paper);
  border-right: 1px solid var(--rule);
  padding: 24px 22px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }

.brand {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 22px;
  letter-spacing: -0.02em;
  color: var(--ink);
  line-height: 1.1;
}
.brand small {
  display: block;
  font-family: 'Manrope', sans-serif;
  font-weight: 400;
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-top: 6px;
}

/* MAIN TAB SWITCH */
.tab-switch {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: var(--ink);
  border-radius: 10px;
}
.tab-switch button {
  flex: 1;
  padding: 10px 14px;
  background: transparent;
  border: none;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  color: rgba(250, 245, 232, 0.6);
  cursor: pointer;
  border-radius: 7px;
  transition: all 0.2s;
}
.tab-switch button.active {
  background: var(--bg-paper);
  color: var(--ink);
}

/* Progress block */
.progress-wrap {
  background: var(--bg);
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 14px 14px 12px;
}
.progress-label {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 12px;
  color: var(--ink-faint);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.progress-label .pct {
  font-family: 'Fraunces', serif;
  font-size: 18px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: 0;
  text-transform: none;
}
.progress-bar {
  height: 6px;
  background: var(--rule);
  border-radius: 3px;
  overflow: hidden;
}
.progress-bar > div {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--ochre));
  transition: width 0.5s ease;
}
.progress-counts {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-top: 10px;
}
.pc {
  text-align: center;
  font-size: 11px;
  color: var(--ink-faint);
  padding: 6px 4px;
  border-radius: 5px;
}
.pc strong {
  display: block;
  font-family: 'Fraunces', serif;
  font-size: 18px;
  font-weight: 600;
  color: var(--ink);
}
.pc.known { background: var(--green-soft); color: var(--accent-dark); }
.pc.partial { background: var(--amber-soft); color: var(--ochre); }
.pc.unknown { background: var(--red-soft); color: var(--red); }

/* Mode tabs (within learn mode) */
.modes {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: var(--bg);
  border: 1px solid var(--rule);
  border-radius: 8px;
}
.modes button {
  flex: 1;
  padding: 8px 10px;
  background: transparent;
  border: none;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-soft);
  cursor: pointer;
  border-radius: 6px;
  transition: all 0.2s;
}
.modes button.active {
  background: var(--ink);
  color: var(--bg-paper);
}
.modes button:hover:not(.active) {
  background: var(--accent-soft);
}

/* Search */
.search {
  position: relative;
}
.search input {
  width: 100%;
  padding: 10px 12px 10px 36px;
  background: var(--bg);
  border: 1px solid var(--rule);
  border-radius: 8px;
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
  outline: none;
  transition: border 0.2s;
}
.search input:focus { border-color: var(--accent); }
.search::before {
  content: "";
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 14px;
  height: 14px;
  border: 1.5px solid var(--ink-faint);
  border-radius: 50%;
}
.search::after {
  content: "";
  position: absolute;
  left: 22px;
  top: 50%;
  width: 7px;
  height: 1.5px;
  background: var(--ink-faint);
  transform: translateY(2px) rotate(45deg);
}

/* Filter pills */
.filter-section {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 6px;
}
.pills {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.pill {
  font-size: 12px;
  padding: 4px 9px;
  background: var(--bg);
  border: 1px solid var(--rule);
  border-radius: 12px;
  cursor: pointer;
  color: var(--ink-soft);
  user-select: none;
  transition: all 0.15s;
}
.pill:hover { border-color: var(--accent); }
.pill.active {
  background: var(--ink);
  color: var(--bg-paper);
  border-color: var(--ink);
}

/* Question list */
.q-list {
  flex: 1;
  overflow-y: auto;
  margin: 0 -22px -24px;
  padding: 4px 22px 24px;
  min-height: 150px;
}
.q-item {
  display: grid;
  grid-template-columns: 28px 1fr 14px;
  gap: 10px;
  padding: 9px 8px;
  border-radius: 6px;
  cursor: pointer;
  margin-bottom: 2px;
  transition: background 0.15s;
  align-items: center;
}
.q-item:hover { background: var(--accent-soft); }
.q-item.current {
  background: var(--ink);
  color: var(--bg-paper);
}
.q-item.current .q-num { color: var(--bg-paper); }
.q-item.current .q-title { color: var(--bg-paper); }
.q-num {
  font-family: 'Fraunces', serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-faint);
  text-align: right;
}
.q-title {
  font-size: 13px;
  color: var(--ink);
  line-height: 1.35;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.q-status {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--rule);
}
.q-status.known { background: var(--green); }
.q-status.partial { background: var(--amber); }
.q-status.unknown { background: var(--red); }

/* === MAIN === */
.main {
  padding: 48px 64px 80px;
  max-width: 880px;
}

.crumb {
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.crumb .cat {
  background: var(--accent-soft);
  color: var(--accent-dark);
  padding: 3px 10px;
  border-radius: 12px;
  letter-spacing: 0.04em;
}
.crumb .num {
  font-family: 'Fraunces', serif;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: 0;
  text-transform: none;
}

h1.q-heading {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 34px;
  line-height: 1.2;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin-bottom: 28px;
  font-variation-settings: "opsz" 60;
}

.ornament {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 24px 0 28px;
  color: var(--ink-faint);
}
.ornament .line { flex: 1; height: 1px; background: var(--rule); }
.ornament .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ochre); }
.ornament .label {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-weight: 500;
}

.actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 28px;
}
.btn {
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  padding: 11px 20px;
  border: 1px solid var(--ink);
  background: var(--bg-paper);
  color: var(--ink);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.btn:hover { background: var(--ink); color: var(--bg-paper); }
.btn.primary { background: var(--ink); color: var(--bg-paper); }
.btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
.btn.ghost { border-color: var(--rule); color: var(--ink-soft); }
.btn.ghost:hover { background: var(--accent-soft); color: var(--ink); border-color: var(--accent); }

.hint-card {
  background: linear-gradient(135deg, var(--ochre-soft), #FAF0DC);
  border: 1px solid var(--ochre);
  border-radius: 12px;
  padding: 20px 24px;
  margin-bottom: 24px;
  position: relative;
}
.hint-card::before {
  content: "💡 ПОДСКАЗКА";
  position: absolute;
  top: -10px;
  left: 18px;
  background: var(--ochre);
  color: white;
  font-size: 10px;
  letter-spacing: 0.12em;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 4px;
}
.hint-card .hint-text {
  font-family: 'Fraunces', serif;
  font-size: 17px;
  line-height: 1.5;
  color: var(--ink);
  font-weight: 400;
  font-style: italic;
  margin-top: 6px;
}

.answer-card {
  background: var(--bg-paper);
  border: 1px solid var(--rule);
  border-radius: 12px;
  padding: 30px 34px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
  position: relative;
}
.answer-card::before {
  content: "📖 ПОЛНЫЙ ОТВЕТ";
  position: absolute;
  top: -10px;
  left: 24px;
  background: var(--accent);
  color: white;
  font-size: 10px;
  letter-spacing: 0.12em;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 4px;
}
.answer-text {
  font-size: 15.5px;
  line-height: 1.7;
  color: var(--ink);
  white-space: pre-wrap;
  word-wrap: break-word;
}

.assessment { margin: 24px 0; }
.assessment-label {
  font-family: 'Fraunces', serif;
  font-size: 18px;
  font-weight: 500;
  text-align: center;
  margin-bottom: 14px;
  color: var(--ink);
}
.assess-buttons {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.assess-btn {
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  padding: 14px 16px;
  border: 2px solid;
  background: transparent;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.assess-btn .ic { font-size: 20px; }
.assess-btn.unknown { border-color: var(--red); color: var(--red); }
.assess-btn.unknown:hover, .assess-btn.unknown.active { background: var(--red); color: white; }
.assess-btn.partial { border-color: var(--amber); color: var(--amber); }
.assess-btn.partial:hover, .assess-btn.partial.active { background: var(--amber); color: white; }
.assess-btn.known { border-color: var(--green); color: var(--green); }
.assess-btn.known:hover, .assess-btn.known.active { background: var(--green); color: white; }

.current-status {
  text-align: center;
  font-size: 12px;
  color: var(--ink-faint);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.current-status .badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
}
.current-status .badge.known { background: var(--green-soft); color: var(--accent-dark); }
.current-status .badge.partial { background: var(--amber-soft); color: var(--ochre); }
.current-status .badge.unknown { background: var(--red-soft); color: var(--red); }
.current-status .badge.new { background: var(--rule); color: var(--ink-soft); }

.nav-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 28px;
  border-top: 1px solid var(--rule);
  margin-top: 28px;
}
.nav-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: inherit;
  font-size: 14px;
  color: var(--ink-soft);
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px 14px;
  border-radius: 8px;
  transition: all 0.15s;
}
.nav-btn:hover { background: var(--accent-soft); color: var(--ink); }
.nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.nav-btn .arrow { font-family: 'Fraunces', serif; font-size: 18px; }
.nav-info { font-family: 'Fraunces', serif; font-size: 14px; color: var(--ink-faint); }

.reset-btn {
  background: none;
  border: none;
  font-family: inherit;
  font-size: 11px;
  color: var(--ink-faint);
  cursor: pointer;
  text-decoration: underline;
  letter-spacing: 0.05em;
  padding: 4px;
}
.reset-btn:hover { color: var(--red); }

.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--ink-faint);
}
.empty h2 {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  margin-bottom: 8px;
  color: var(--ink);
}

.mobile-toggle {
  display: none;
  position: fixed;
  top: 14px;
  left: 14px;
  z-index: 100;
  background: var(--ink);
  color: var(--bg-paper);
  border: none;
  width: 42px;
  height: 42px;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
  box-shadow: var(--shadow);
}

/* ===== TEST MODE ===== */
.test-intro {
  margin-bottom: 28px;
}
.test-intro p {
  font-size: 16px;
  color: var(--ink-soft);
  line-height: 1.6;
}

.theme-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
  margin: 24px 0;
}
.theme-card {
  background: var(--bg-paper);
  border: 1px solid var(--rule);
  border-radius: 12px;
  padding: 20px 22px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.theme-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, transparent 60%, var(--accent-soft) 100%);
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}
.theme-card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
}
.theme-card:hover::before { opacity: 0.5; }
.theme-card .t-cat {
  font-family: 'Fraunces', serif;
  font-size: 19px;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 8px;
  line-height: 1.25;
}
.theme-card .t-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--ink-faint);
  letter-spacing: 0.04em;
}
.theme-card .t-score {
  font-family: 'Fraunces', serif;
  font-size: 13px;
  color: var(--accent-dark);
  background: var(--green-soft);
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}

/* Quiz card */
.quiz-question {
  background: var(--bg-paper);
  border: 1px solid var(--rule);
  border-radius: 16px;
  padding: 36px 38px;
  box-shadow: var(--shadow);
  margin-bottom: 24px;
}
.quiz-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--ink-faint);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 18px;
}
.quiz-header .progress-dots {
  display: flex;
  gap: 5px;
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--rule);
}
.dot.done { background: var(--accent); }
.dot.current { background: var(--ink); transform: scale(1.4); }
.dot.wrong { background: var(--red); }

.quiz-q {
  font-family: 'Fraunces', serif;
  font-size: 24px;
  font-weight: 500;
  line-height: 1.35;
  color: var(--ink);
  margin-bottom: 24px;
  font-variation-settings: "opsz" 36;
}

.quiz-options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.quiz-opt {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 16px 20px;
  background: var(--bg);
  border: 2px solid var(--rule);
  border-radius: 12px;
  cursor: pointer;
  font-size: 15px;
  text-align: left;
  font-family: inherit;
  color: var(--ink);
  line-height: 1.45;
  transition: all 0.15s;
}
.quiz-opt:hover:not(:disabled) {
  border-color: var(--ink-faint);
  background: var(--bg-paper);
}
.quiz-opt .letter {
  flex-shrink: 0;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-paper);
  border: 1px solid var(--rule);
  border-radius: 50%;
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 14px;
  color: var(--ink-soft);
}
.quiz-opt .opt-text { flex: 1; padding-top: 3px; }
.quiz-opt:disabled { cursor: default; opacity: 0.7; }
.quiz-opt.correct {
  border-color: var(--green);
  background: var(--green-soft);
  color: var(--accent-dark);
}
.quiz-opt.correct .letter {
  background: var(--green);
  color: white;
  border-color: var(--green);
}
.quiz-opt.wrong {
  border-color: var(--red);
  background: var(--red-soft);
  color: var(--red);
}
.quiz-opt.wrong .letter {
  background: var(--red);
  color: white;
  border-color: var(--red);
}

.feedback {
  margin-top: 20px;
  padding: 18px 22px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.55;
  animation: slideIn 0.3s ease;
}
.feedback.correct {
  background: var(--green-soft);
  border-left: 4px solid var(--green);
  color: var(--accent-dark);
}
.feedback.wrong {
  background: var(--red-soft);
  border-left: 4px solid var(--red);
  color: var(--red);
}
.feedback strong {
  display: block;
  font-family: 'Fraunces', serif;
  font-size: 16px;
  margin-bottom: 6px;
}
.feedback .ref-link {
  display: inline-block;
  margin-top: 8px;
  padding: 4px 10px;
  background: rgba(255,255,255,0.5);
  color: inherit;
  font-size: 12px;
  border-radius: 12px;
  cursor: pointer;
  text-decoration: none;
  font-weight: 600;
}
.feedback .ref-link:hover { background: rgba(255,255,255,0.9); }

@keyframes slideIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

.quiz-actions {

<script>
// === DATA ===
const QUESTIONS = [{"num":1,"title":"Г. Лассуэлл о пропаганде. Основные различия пиара и пропаганды.","answer":"О Г. Лассуэлле:\nГарольд Дуайт Лассуэлл (англ. Harold Dwight Lasswell; 13 февраля 1902,\nДоннеллсон, Иллинойс, США — 18 декабря 1978, Нью-Йорк, США) — американский\nполитолог, один из основоположников современной политологии, представитель\nбихевиоралистского подхода в политической науке и один из основателей Чикагской\nшколы социологии, теоретик междисциплинарного подхода к исследованию поведения\nличности в различных сферах деятельности. Был почётным профессором права\nЙельского университета, одним из директоров Центра политических наук в Нью-Йорке.\nЕго работа «Техника пропаганды во время мировой войны» («Propaganda Technique in\nthe World War», 1927) стало классическим сочинением по изучению массовой\nкоммуникации.\n\nО самой теории пропаганды Лассуэлла:\nЛассуэлл определял пропаганду как «менеджмент коллективных мнений с\nпомощью манипуляций значимыми символами». В основе его подхода лежали два\nтезиса:\n1. Люди реагируют на пропагандистское воздействие более-менее сходным\nобразом из-за принципиального сходства базовых инстинктов.\n2. Сознание «среднего человека» уязвимо, особенно в кризисных ситуациях\n(экономических, политических, военных).\n\nЛассуэлл считал, что в условиях войны, экономического кризиса или\nполитического конфликта люди становятся особенно восприимчивыми к\nпропаганде, так как она выступает для них источником успокоения и способом\nсправиться с угрозой.\n\nЦель пропаганды — мобилизовать и консолидировать массы вокруг единой\nцели. При этом эта цель может быть специфической для каждой социальной группы\nили слоя, и пропагандист должен адаптировать сообщения под разные аудитории.\n\nЛассуэлл выделял две составляющие пропаганды:\n● Креденды (доверие) — рациональная составляющая, которая включает\nполитические доктрины, уставы, конституции, декларации, договоры. Они\nобращаются к разуму и формируют доверие к власти на когнитивном уровне.\n● Миранды (мираж, сверхъестественное) — эмоциональная составляющая,\nкоторая включает ритуалы, символы, лозунги, образы лидеров. Она рассчитана\nна пробуждение чувств лояльности.\n\nВ работе «Техника пропаганды в мировой войне» (1927) Лассуэлл проанализировал\nпропагандистские усилия воюющих держав в Первой мировой войне. Он выделил\nзадачи военной пропаганды:\n● возбуждать ненависть к врагу;\n● поддерживать дружественные отношения с союзниками и нейтральными\nгосударствами;\n● деморализовать противника.\n\nЛассуэлл считал, что в условиях войны власть над формированием общественного\nмнения должна перейти в официальные руки, чтобы избежать разобщённости и\nпораженческих настроений. Он предлагал передать управление пропагандой в СМИ\nнаучной технократии, которая будет отбирать информацию и тем самым\nпротивостоять угрозам демократии.\n\nС этической точки зрения Лассуэлл рассматривал пропаганду как инструмент, который\nсам по себе не может быть признан ни плохим, ни хорошим. Пагубно для общества\nне само применение пропаганды, а трансляция и насаждение неблагоприятных для\nнего идей.\n\n%D1%80%D0%BE%D0%BF%D0%B0%D0%B3%D0%B0%D0%BD%D0%B4%D1%8B_%D\n0%9B%D0%B0%D1%81%D1%81%D1%83%D1%8D%D0%BB%D0%BB%D0%B0\n\nЧто такое пиар:\nPR (public relations, паблик рилейшнз) — это стратегическая коммуникационная\nдеятельность, направленная на создание позитивного имиджа и поддержания\nрепутации компании или персоны. С английского public relations переводится как\n«связи с общественностью».\n\nЗадача пиара — сформировать позитивное мнение о бренде или личности не только\nу потенциальных клиентов, но и у журналистов, инвесторов, избирателей,\nпредставителей госструктур.\n\nКлючевые черты PR:\n● Двусторонняя коммуникация. PR предполагает диалог и обратную связь с\nаудиторией.\n● Этические нормы. Опора на достоверную информацию и прозрачность;\nфальсификация фактов недопустима.\n● Долгосрочная стратегия. Цель — не сиюминутный результат, а устойчивое\nдоверие и лояльность.\n● Разнообразные инструменты: работа со СМИ, контент‑маркетинг,\nмероприятия, социальные сети, кризисные коммуникации и др.\n● Непрямое влияние. PR не продаёт напрямую, а создаёт благоприятную среду\nдля продаж и сотрудничества.\n\ndlya-vseh-kto-s-ney-neznakom/?ysclid=moo417sc822232833\n\nЧто такое пропаганда:\nПропаганда — это целенаправленное распространение идей, взглядов, информации\nили слухов с целью формирования определенного общественного мнения,\nманипулирования сознанием или изменения поведения людей. Термин\nпроисходит от латинского propaganda («подлежащее распространению»), которое, в\nсвою очередь, образовано от глагола propago («распространяю»).\nКлючевые черты пропаганды:\n● Односторонняя коммуникация. Нет диалога с аудиторией; цель — внушение,\nа не обсуждение.\n● Манипуляция. Часто включает выборочную подачу информации,\nэмоциональные апелляции, стереотипы.\n● Идеологическая направленность. Служит продвижению определенной\nидеологии, политической линии или интересов группы/лидера.\n● Контроль над нарративом. Стремление исключить альтернативные точки\nзрения и установить единую трактовку событий.\n\n● Краткосрочная мобилизация. Часто используется в кризисных ситуациях\n(войны, выборы) для быстрой консолидации масс.\n\nD0%BD%D0%B4%D0%B0\n\nКлючевые отличия пиар и пропаганды:\nКритерий PR (Public Relations) Пропаганда\n\nЦель Построить позитивный Навязать идеологию,\nимидж; достичь мобилизовать массы на\nвзаимопонимания, доверия поддержку конкретной\nи лояльности; построить линии или интересов\nрепутацию. группы/лидера.\n\nХарактер Двусторонняя Односторонняя\nкоммуникации коммуникация, диалог с коммуникация,\nаудиторией, наличие манипуляция,\nобратной связи. отсутствие диалога.\n\nЭтика Опора на правдивую Часто включает\nинформацию, прозрачность, искажение фактов,\nискренность и открытость (в дезинформацию,\nрамках закона). выборочную подачу\nинформации.\n\nДолгосрочност Нацелен на долгосрочное Часто используется для\nь построение репутации и краткосрочной\nотношений. мобилизации (в\nкризисах, войнах,\nвыборах).\n\nОтношение к Рассматривает аудиторию Рассматривает\nаудитории как партнера, стремится к аудиторию как объект\nдобровольному принятию воздействия, стремится\nидей. к контролю над\nсознанием и\nповедением.\n\nИнструменты Работа со СМИ, Ритуалы, лозунги,\nконтент-маркетинг, эмоциональные апелляции,\nмероприятия, социальные стереотипы, демонизация\nсети, кризисные оппонентов.\nкоммуникации и др.\n\nРоль в Используется в бизнесе, Часто связана с\nобществе государственных структурах политикой, религией,\nдля формирования тоталитарными\nпозитивного имиджа и режимами; инструмент\nподдержания диалога с социального контроля.\nобщественностью.\n\nЗак-ое рег-ие Регулируется этическими Может нарушать\nкодексами и нормами этические нормы, часто\nделового оборота. действует в рамках\nдвойной морали.","hint":"Лассуэлл определял пропаганду как «менеджмент коллективных мнений с помощью манипуляций значимыми символами». Главное отличие PR от пропаганды: PR — двусторонняя коммуникация и опора на правдивую информацию; пропаганда — односторонняя коммуникация с целью внушения.","category":"Медиа и теория"},{"num":2,"title":"Роль связей с общественностью в современном обществе.","answer":"PR (public relations, паблик рилейшнз) — это системная работа по созданию\nпозитивного имиджа и поддержанию репутации компании или персоны. С английского\npublic relations переводится как «связи с общественностью».\n\nЗадача — сформировать позитивное мнение о бренде или личности не только у\nпотенциальных клиентов, но и у журналистов, инвесторов, избирателей,\nпредставителей госструктур. За пиар обычно отвечают отдельные пиар-менеджеры\nили специальный PR-отдел; также эту функцию могут передавать PR-агентствам.\nСовременными учёными выделяется пять основных функций PR:\n- Аналитически-прогностическая функция обеспечивает проведение политики\nинформирования, разработку ее тактики и стратегии. Благодаря ей событие\nдинамично развивается, обеспечивается изучение социальных групп, входящих в\nорбиту события; анализируются возможные при осуществлении PR-деятельности\nситуации; дается оценка общественного мнения и осуществляется его контроль и\nмониторинг; подготавливаются данные для принятия и реализации эффективных\nрешений.\n\n- Организационно-технологическая функция способствует организации\nвзаимодействия с общественностью и проведению PR-кампаний, акций, выставок и\nт.д.; обеспечивает постоянное взаимодействие с социальными группами в интересах\nсубъектов PR–взаимодействия.\n\n- Управленческая функция – центральная функция связей с общественностью. Её\nзадача – добиться взаимопонимания и доверия в вопросах определения и понимания\nистинных интересов организации и общественной среды, а также достигнуть\nкомпромисса в их реализации.\n\n- Информационно-коммуникативная нужна для формирования и поддержания\nконструктивного климата в общественной среде, соблюдения этикета и морали. Также\nпредусматривает обеспечение создания и тиражирование информации, необходимой\nPR-коммуникаторам.\n\n- Консультативно-методическая функция предусматривает проведение\nконсультационной деятельности и методологических работ по осуществлению и\nподдержке взаимоотношений субъекта PR-воздействия и общественности.\n\nОсобенности современного PR\n- Двусторонний характер коммуникации. В отличие от пропаганды, PR предполагает\nдиалог и учёт мнения аудитории, а не навязывание точки зрения.\n\n- Использование цифровых технологий. В условиях цифровой трансформации PR\nактивно применяет инструменты на базе искусственного интеллекта для мониторинга\nупоминаний, анализа тональности, автоматизации рутинных задач и персонализации\nконтента.\n\n- Персонализация. Современные PR-кампании стремятся создать эмоциональную\nсвязь с аудиторией через адаптацию сообщений под интересы конкретных сегментов.\n\n- Проактивный подход. Вместо традиционного реактивного PR компании стремятся\nпредвосхищать потребности аудитории и реагировать на социальные изменения до их\nвозникновения.\n\nКлючевые направления и задачи PR сегодня.\n- Управление репутацией\n○ Мониторинг упоминаний в СМИ и соцсетях\n○ Быстрая реакция на кризисные ситуации\n○ Формирование единого образа бренда\n- Кризисная коммуникация\n○ Подготовка сценариев и шаблонов заявлений\n○ Оперативная коммуникация с медиа, сотрудниками, партнерами\n○ Минимизация ущерба репутации и восстановление доверия\n- Сплетение коммуникаций с различными аудиториями\n○ СМИ, инвесторы, клиенты, сотрудники, партнеры\n○ Адаптация мессджей под интересы и ценности каждой группы\n○ Персонализация каналов (пресс-релизы, соцсети, мероприятия)\n- Контент-стратегия и бренд-история\n○ Разработка смыслов, ценностей и миссии бренда\n○ Создание качественного контента: кейсы, экспертные материалы,\nистории клиентов\n○ Единый стиль коммуникаций и визуальной идентичности\n- Управление коммуникационными каналами\n○ Пресс-релизы, брифы, письма СМИ\n○ Социальные сети, блог, подкасты, вебинары\n○ Внутренние коммуникации: корпоративная культура, мотивация\nсотрудников\n- Измерение эффективности\n○ Метрики узнаваемости, охвата, тональности, вовлеченности\n○ ROI PR-активностей: стоимость привлечения внимания, лидогенерация\n○ Аналитика и корректировка стратегии на основе данных\n- Этические и правовые аспекты\n○ Честность, прозрачность, соблюдение регуляций\n○ Защита конфиденциальной информации и персональных данных\n○ Ответственность за ложные или вводящие в заблуждение материалы\n\n- Роль в цифровой трансформации\n○ Использование данных и аналитики для таргетинга и персонализации\n○ Автоматизация и робастность процессов: медиапланирование,\nмониторинг\n○ Кризис-менеджмент в эпоху быстрых изменений в медиа-ландшафте","hint":"С английского public relations переводится как «связи с общественностью».","category":"Общественное мнение"},{"num":3,"title":"Модели функционирования массмедиа в обществе по Д. Маккуэйлу.","answer":"Денис Маккуэйл (1935–2017) — британский социолог, теоретик массовой\nкоммуникации, который разработал несколько моделей функционирования\nмассмедиа в обществе.\n\nОбщая идея Маккуэйла\nДенис Маккуэйл рассматривает массмедиа не просто как каналы передачи\nинформации, а как социальный институт, встроенный в систему отношений между\nвластью, обществом, рынком и аудиторией. Его подход важен тем, что он не сводит\nмедиа к одной «правильной» функции: для разных обществ, исторических условий и\nполитических режимов нужны разные нормативные модели функционирования СМИ.\nПоэтому у Маккуэйла речь идет не об одной универсальной теории, а о наборе\nмоделей, которые описывают, как СМИ должны работать в обществе и на каких\nценностях эта работа строится.\n\nНормативный подход\nНормативные теории отвечают на вопрос не «как медиа работают фактически?», а\n«как они должны работать?». У Маккуэйла центральным становится общественный\nинтерес: медиа оцениваются через их вклад в свободу выражения, качество\nинформации, плюрализм, социальную ответственность и общественную\nкоммуникацию.\n\nОсновные модели\n\nПри этом учёный вырабатывает универсальные законы функционирования медиа,\nактуальные для всех моделей:\n● Во всех системах взаимодействия власти и общества медиа — агенты групп,\nоблечённых политической или экономической властью; медиа могут обладать\nнезависимым подходом, но полной независимости они иметь не могут;\n● Все системы основаны на представлении о свободе выражения мнений, но\nвезде существуют определенные пределы этой свободы;\n● Все системы одобряют доктрину теории социальной ответственности;\n● Системы транслируют идеологию и ценности, характерные для общества, в\nкоторых они функционируют;\n\nСвобода и ответственность\nОдна из ключевых идей Маккуэйла — свобода медиа не может пониматься как\nабсолютная независимость от общества и институтов. Он связывает свободу с равным\nдоступом к информации, отсутствием цензуры, защитой журналистской автономии и\nнедопущением скрытого давления собственников или политической власти. Но\nсвобода, по Маккуэйлу, должна быть уравновешена ответственностью: СМИ обязаны\n\nобеспечивать правдивость, точность, объективность и баланс, иначе они перестают\nвыполнять общественную функцию. Отсюда возникает понятие social responsibility —\nсоциальной ответственности медиа перед обществом.\n\nИсточники:\n\nvetstvennosti-sovetskaya-kommunisticheskaya-model-media-razvitiya-i-model-demokratiche\nskogo-uchastiya.html","hint":"Денис Маккуэйл (1935–2017) — британский социолог, теоретик массовой коммуникации, который разработал несколько моделей функционирования массмедиа в обществе.","category":"Медиа и теория"},{"num":4,"title":"Общественное мнение. Технологии влияния на общественное мнение в медиа. «Спираль молчания» Нойель-Нойманн.","answer":"Общественное мнение — это состояние массового сознания, в котором выражается\nотношение (скрытое или явное) различных совокупностей людей, именуемых\nобщественностью, к явлениям, событиям и фактам социальной действительности,\nзатрагивающим их потребности и интересы. В обыденном употреблении понятие\n«общественное мнение» чаще всего подразумевает точку зрения общества по тому\nили иному общественно значимому вопросу.\n\nФормирование и развитие общественного мнения происходит как целенаправленно\n— в результате воздействия политических организаций и социальных институтов\nи учреждений на сознание общественных групп, так и стихийно- под\nнепосредственным влиянием жизненных обстоятельств, социального опыта и\nтрадиций\n\nТехнологии формирования общественного мнения представляют собой\nсовокупность последовательных приемов, способов и методов, направленных на\nвыработку в определенной группе людей или обществе в целом требуемых субъектам\nвлияния взглядов, убеждений и отношения к тем или иным фактам, событиям,\nявлениям действительности.\n\nОсобую роль в этом процессе играют средства массовой информации и Интернет,\nкоторые в настоящее время являются не только каналами выражения\nобщественного мнения, но и основными инструментами его формирования. Их\nглавенствующая роль в информационном пространстве обусловливается широким\nохватом аудитории, скоростью передачи информации, интерактивностью\nпроцесса передачи информации. Но главным фактором является их доступность.\n\nТехнологии влияния на общественное мнение можно рассматривать на двух уровнях\n— в целом в обществе и в медиа, и разница между ними связана с тем, как именно\nформируется и передаётся влияние. В широком смысле влияние на общественное\nмнение — это социальный процесс. Оно формируется через повседневное общение,\nкультуру, образование, нормы и авторитеты. Здесь задействованы разные участники:\nлюди, группы, институты. Мнение возникает постепенно — через социализацию,\nдавление окружения, доверие к значимым фигурам. Такой процесс часто не имеет\nчёткой цели и развивается естественно внутри общества.\n\nВлияние в медиа — это уже более узкий и управляемый процесс. Оно осуществляется\nчерез средства массовой коммуникации: новости, социальные сети, цифровые\nплатформы. Здесь важную роль играет не только содержание информации, но и то,\nкак она отобрана, оформлена и подана. Используются конкретные механизмы:\nвыделение тем (agenda-setting), интерпретация событий (framing), задание критериев\nоценки (priming), повторение и эмоциональная подача. В отличие от общего\nсоциального влияния, здесь воздействие чаще целенаправленно и масштабируется на\nбольшую аудиторию.\n\nТаким образом, общее влияние — это широкий социальный процесс формирования\nвзглядов, а влияние в медиа — это инструментальное управление восприятием\nчерез информацию и её подачу.\n\nТехнологии могут варьироваться от самых простых как: искажение или утаивание\nинформации, избирательной подачи и метода создания фактов, манипуляции числом и\nт. д.; до более сложных: метод семантического манипулирования, спираль молчания,\nметод сэндвичей:\n\n• Формирование повестки (agenda-setting) — медиа определяют, какие темы аудитория\nсчитает важными.\n\n• Фрейминг (framing) — подача информации через определённую «рамку» меняет её\nсмысл и интерпретацию.\n\n• Прайминг (priming) — задаются критерии, по которым аудитория оценивает события\nи людей.\n\n• Эффект повторения — часто повторяемая информация воспринимается как более\nдостоверная.\n\n• Конструирование нарратива — факты подаются как история, что делает их более\nубедительными.\n\n• Упрощение и стереотипизация — сложные явления сводятся к простым и\nустойчивым образам.\n\n• Спираль молчания — люди скрывают мнение, если считают его непопулярным,\nусиливая доминирующую позицию.\nСпира́ль молча́ния — концепция в социологии, политологии и массовых коммуникациях,\nпредложенная немецким социологом Элизабет Ноэль-Нойман. Утверждает, что человек с\nменьшей вероятностью выскажет своё мнение на ту или иную тему, если чувствует, что\nнаходится в меньшинстве, так как боится возмездия или изоляции.\n\n«Спираль молчания» — это концепция, согласно которой человек с большей\nвероятностью не будет публично выражать свое мнение, если он убежден, что оно в\nменьшинстве. И наоборот — если мы верим, что какая-то идея популярна, то, скорее\nвсего, мы будем открыто эту ее поддерживать.\n\nЭли́забет Но́эль-Но́йман (изредка Ноэль-Нейман, нем. Elisabeth Noelle-Neumann; 19\nдекабря 1916, Берлин — 25 марта 2010, Алленсбах) — немецкий социолог и\nполитолог, основательница Института демоскопии в Алленсбахе\n\nnenie/viewer\n\nmnenie.pdf\n\nnt_educational.pdf","hint":"Общественное мнение — это состояние массового сознания, в котором выражается отношение (скрытое или явное) различных совокупностей людей, именуемых общественностью, к явлениям, событиям и фактам социальной действительности, затрагивающим их потребности и интересы.","category":"Медиа и теория"},{"num":5,"title":"Технологии манипуляции общественным мнением: навязывание повестки дня, фрейминг, прайминг, мейнстриминг.","answer":"Манипуляция общественным мнением — это сложный процесс психологического и\nсоциального воздействия, целью которого является изменение восприятия реальности\nбольшими группами людей. В современной политологии и социологии выделяют\nчетыре ключевых механизма, которые позволяют СМИ и элитам управлять тем, как\nобщество видит мир.\n\n1. Навязывание повестки дня\nСуть: Средства массовой информации не говорят людям, что именно они должны\nдумать, но они диктуют им, о чем они должны думать.\n\nМеханизм: Редакции СМИ, владельцы медиахолдингов и алгоритмы соцсетей\nотбирают из тысяч событий дня лишь 5–10 «главных». Частота упоминания темы, её\nместо в выпуске новостей (первая полоса или короткая заметка в конце) и\nэмоциональный накал создают у аудитории ощущение важности именно этой\nпроблемы.\n\nРезультат: Если СМИ каждый день говорят о курсе валют, общество считает это\nглавной проблемой, даже если в стране в это время происходит экологическая\nкатастрофа, о которой молчат. Проблемы, не попавшие в повестку, для общества «не\nсуществуют».\n\nПример: Искусственное раздувание темы «угрозы извне» перед выборами, чтобы\nотвлечь внимание от внутренних экономических провалов.\n\n2. Фрейминг\nСуть: Это создание «рамки» интерпретации. Одно и то же событие можно подать под\nразными углами, что полностью изменит его восприятие.\n\nМеханизм: Фрейминг работает через отбор определенных аспектов реальности и\nпридание им большей значимости. Это способ смысловой упаковки информации.\nФрейм определяет: в чем проблема, кто виноват и какое решение является\nправильным.\n\nРезультат: Факты остаются прежними, но их оценка меняется на противоположную.\n\nПример:\nФрейм «Борцы за свободу»: акцент на героизме, идеалах и праве на протест.\nФрейм «Массовые беспорядки»: акцент на погромах, нарушении закона, хаосе и\nугрозе обычным гражданам.\nСобытие одно и то же, но реакция аудитории будет диаметрально разной.\n\n3. Прайминг\nСуть: Это «предварительная настройка» или подготовка аудитории к восприятию\nпоследующей информации.\n\nМеханизм: Прайминг активирует в памяти человека определенные ассоциации или\nстандарты оценки непосредственно перед тем, как он должен вынести суждение о\nчем-либо. СМИ создают контекст, который становится фильтром для восприятия\nследующей новости.\n\nРезультат: Если в течение недели СМИ показывают сюжеты о коррупции в медицине\n(прайминг), а в воскресенье выходит новость о назначении нового министра\nздравоохранения, люди автоматически будут оценивать его через призму «будет ли он\nворовать?», а не через его профессиональные навыки.\n\nПример: Перед выступлением политика показывают документальный фильм о великих\nпобедах прошлого. Это настраивает зрителя на патриотический лад и заставляет\nвоспринимать речь политика как продолжение этой славной истории.\n\n4. Мейнстриминг\nСуть: Процесс «сглаживания» различий в мнениях разных социальных групп и\nприведение их к единому, доминирующему стандарту (мейнстриму).\n\nМеханизм: Эта технология тесно связана с теорией культивации Джорджа Гербнера.\nЛюди, которые потребляют много однотипного медиаконтента (например, смотрят\nтолько государственное ТВ), со временем начинают одинаково смотреть на мир,\nнезависимо от своего образования, дохода или места жительства.\n\nРезультат: Разнообразие взглядов в обществе исчезает. Группы, которые раньше\nимели полярные мнения, начинают разделять общие страхи, ценности и стереотипы,\nнавязанные экраном. Это создает иллюзию «всеобщего согласия» или «народного\nединства».\n\nПример: Формирование единого образа «врага» или «героя», который принимается и\nрабочим на заводе, и профессором университета, потому что этот образ\nтранслируется из каждого утюга как единственно верный.","hint":"Манипуляция общественным мнением — это сложный процесс психологического и социального воздействия, целью которого является изменение восприятия реальности большими группами людей.","category":"Общественное мнение"},{"num":6,"title":"Что подразумевается под «высшей формой информации» в информационном обществе?","answer":"В информационном обществе под «высшей формой информации» чаще всего\nпонимаются знания, особенно приобретенные в процессе научной деятельности.\nЭтот тезис является ключевым в понимании того, как информация становится главной\nпроизводственной силой и что именно считается ее наиболее ценной формой.\nКлючевое различие между информацией и знанием лежит в глубине и\nосмысленности.\n\nИнформация (сырые данные) — это факты, сведения, данные, объект хранения\nи передачи. Она измеряется и фиксируется. Её распространение и создание —\nважная, но не главная задача. Знание же — это осмысленная, структурированная и\nпроверенная информация, интегрированная с опытом и пониманием. Получение\nзнания требует активной познавательной деятельности субъекта, рефлексии и\nкритического мышления. В экономике, где большинство занято в сфере производства\nи применения знаний, именно знание становится главным, ключевым ресурсом,\nопределяющим экономические и социальные процессы. Знание — это движущая сила\nпрогресса, позволяющая принимать эффективные решения и генерировать инновации,\nв отличие от информации, которая ценна лишь как ресурс для реализации.\nВ рамках информационного общества именно научное знание часто\nрассматривается как самая ценная его форма.\nСогласно исследованию Бондаренко, Коваленко и Гурина (КиберЛенинка),\nнаучное знание представляет собой «высшую форму объективной информации в\nиерархии ценностей сетевого общества». Это подчеркивает его отличие от\nсубъективных мнений или симулякров, которые также могут распространяться в\nсетевой среде.\nКроме того, знание, и в первую очередь научное, становится не просто\nэкономической категорией, но и социально-психологической установкой — «культом\nзнаний». Это означает, что в общественной морали тяга к самосовершенствованию\nчерез познание начинает цениться выше простого материального благополучия.\nПереход от «сырой» информации к знанию — это не автоматический процесс.\nЭто результат активной мыслительной деятельности человека.\nЧеловек не просто получает данные, но и анализирует их, сравнивает с\nимеющимся опытом, подвергает сомнению и структурирует. Это требует\nпознавательной активности. Информация превращается в знание только через\nрефлексию — процесс размышления, который позволяет создать осознанность, смысл\nи понимание. Знания не существуют ради накопления; они должны активно\nпреобразовываться и применяться на практике для решения реальных задач и\nсоздания нового.\n\nисточники:\n\netevogo-obschestva/viewer\n\ne/27385","hint":"В информационном обществе под «высшей формой информации» чаще всего понимаются знания, особенно приобретенные в процессе научной деятельности.","category":"Прочее"},{"num":7,"title":"Кто считается автором определения «медиа – это сообщение»?","answer":"Формула Маршалла Маклюэна (1911-1980) «The medium is the message» («Медиа\n— это сообщение», «Средство передачи сообщения само является сообщением»).\nФраза, введённая канадским теоретиком коммуникации также является и названием\nпервой главы его книги «Понимание медиа: Внешние расширения человека»,\nопубликованной в 1964 году.\nМаклюэн утверждает, что само средство коммуникации (медиум), а не сообщения,\nкоторые оно несёт, должно быть основным объектом изучения. Эта концепция\nприменялась другими авторами при обсуждении технологий от телевидения до\nИнтернета.\nСуть концепции в том, что форма передачи информации (медиа) сама по себе несёт\nопределённый смысл и влияет на восприятие сообщения, иногда даже больше, чем\n\nсамо содержание. Маклюэн подчёркивал, что коммуникация возникает на стыке\nформы и содержания — это целостное впечатление, которое получает адресат.\nПримеры, иллюстрирующие идею:\n* Граффити. Сам выбор этого формата может создавать впечатление, что автор —\nбунтарь и представитель контркультуры, независимо от того, что именно изображено\nна стене.\n* Научная статья в академическом журнале. Сам выбор такого носителя может\nсоздавать впечатление, что автор признан и уважаем научным сообществом,\nнезависимо от конкретного содержания текста.\n* Книга. Маклюэн считал книгу высшей формой медиа, так как сам факт её создания\nможет демонстрировать опыт и экспертность автора.\n* Блог или онлайн-курс. Эти форматы могут транслировать разные смыслы: блог часто\nвоспринимается как мысль в процессе развития, а онлайн-курс — как способ\nмонетизации информации.\n\nСредство коммуникации есть сообщение — Википедия","hint":"Формула Маршалла Маклюэна (1911-1980) «The medium is the message» («Медиа — это сообщение», «Средство передачи сообщения само является сообщением»).","category":"Медиа и теория"},{"num":8,"title":"Какие функции медиа не относятся к способствующим развитию культурного обмена?","answer":"К функциям медиа, которые не способствуют развитию культурного обмена, можно\nотнести те, которые не направлены на взаимодействие между культурами, их диалог\nили интеграцию. Например:\n• Идеологическая (нормативная) функция. Нацелена на продвижение\nопределённойсистемы ценностей, которая может противоречить другим культурам.\n• Рекреативная (развлекательная) функция. Ориентирована на отдых и\nразвлечениеаудитории, а не на глубокое знакомство сдругими культурами.\n•Коммерческая. Фокусируется на продвижении товаров и услуг, а не на культурных\nценностях.\n•Управленческая (манипулятивная). Используется для контроля общественного\nмнения, а не для межкультурного взаимодействия.\n• Сегрегационная (разделяющая). Создаёт информационные «пузыри» — аудитории\nполучают контент только своей культурной группы.\n•Сенсационная/шокирующая. Делает акцент на экстремальных или негативных\nаспектах других культур, формируя искажённое представление.Источники:\n\n-informacionnogo-obshestva-6468279.html","hint":"К функциям медиа, которые не способствуют развитию культурного обмена, можно отнести те, которые не направлены на взаимодействие между культурами, их диалог или интеграцию.","category":"Медиа и теория"},{"num":9,"title":"Согласно теории Уолтера Липпмана существует расхождение между…","answer":"Теория Уолтера Липпмана, изложенная в его книге «Общественное мнение» (1922),\nутверждает, что люди реагируют не на реальную действительность, а на упрощенные\nобразы в своей голове — «псевдосреду». Из-за сложности мира люди используют\n\nстереотипы, формируя общественное мнение на основе медиа-образов, а не фактов,\nчто делает демократию трудноосуществимой.\n\nОсновные положения теории:\n\n● «Псевдосреда» и реальный мир: Люди живут в реальном мире, но действуют в\n«псевдосреде» — ментальной картинке, созданной новостями, слухами и\nстереотипами. Общественное мнение формируется на основе этой картины.\n● Стереотипы: Это фиксированные, упрощенные представления, которые\nпомогают человеку быстро упорядочить сложный мир, но часто ведут к\nискаженному восприятию реальности.\n● Роль СМИ и пропаганда: Липпман указывал на то, что СМИ формируют\nповестку дня, выделяя одни события и замалчивая другие, тем самым\nконструируя «псевдосреду» для аудитории.\n● «Демократический реализм»: Липпман критиковал идеал «просвещенного\nгражданина», считая, что обычный человек не имеет ни времени, ни\nвозможности глубоко разбираться в политике. Он выступал за участие\nэкспертов в управлении государством.","hint":"Теория Уолтера Липпмана, изложенная в его книге «Общественное мнение» (1922), утверждает, что люди реагируют не на реальную действительность, а на упрощенные образы в своей голове — «псевдосреду».","category":"Медиа и теория"},{"num":10,"title":"Согласно теории ограниченных эффектов, влияние СМИ не зависит от…","answer":"Согласно теории ограниченных эффектов (которая активно развивалась в 1940–1960-х\nгодах, особенно в работах Пола Лазарсфельда и его коллег), влияние СМИ не зависит\nот самого содержания медиа как такового в изоляции от социальных факторов. Более\nточно: влияние СМИ не является прямым, всесильным и независимым от\nмежличностных отношений, лидеров мнения, социального статуса и уже\nсформированных установок аудитории. Иными словами, СМИ не обладают\nнезависимым эффектом вне социального контекста, в который включена аудитория.\n\nИсточник:\n\nmetodologiya-analiza-deyatelnosti-sredstv-massovoy-kommunikatsii","hint":"Согласно теории ограниченных эффектов (которая активно развивалась в 1940–1960-х годах, особенно в работах Пола Лазарсфельда и его коллег), влияние СМИ не зависит от самого содержания медиа как такового в изоляции от социальных факторов.","category":"Прочее"},{"num":11,"title":"Какую роль играют медиа согласно теории инноваций Эверетта Роджерса?","answer":"Теория инноваций Эверетта Роджерса играет роли в медиа как:\n\n1)Источник первичной информации (Осведомленность): Медиа наиболее эффективны\nна ранних стадиях, когда людям нужно узнать о существовании новой идеи, технологии\nили продукта. Они позволяют охватить большую аудиторию за короткое время.\n\n2)Создание \"повестки дня\" (Agenda-setting): Медиа подсвечивают важность инновации,\nделая ее темой для обсуждения, что помогает перевести ее из разрядов \"странного\" в\nразряд \"нового и перспективного\".\n\n3)Влияние на ранних последователей: СМИ особенно важны для ранних\nпоследователей (early adopters), которые активно ищут информацию из внешних\nисточников, а не только полагаются на мнение соседей.\n\nИсточник:\n\nnnovations.pdf","hint":"Теория инноваций Эверетта Роджерса играет роли в медиа как: 1)Источник первичной информации (Осведомленность): Медиа наиболее эффективны на ранних стадиях, когда людям нужно узнать о существовании новой идеи, технологии или продукта.","category":"Медиа и теория"},{"num":12,"title":"Что НЕ характерно для либертарианской модели прессы?","answer":"Для либертарианской модели прессы НЕ характерны государственный контроль,\nцензура, лицензирование прессы, подчинение СМИ интересам власти или партии.\nДля либертарианской модели, наоборот, характерно:\n1. свобода слова и печати;\n2. минимальное вмешательство государства в деятельность СМИ;\n3. частная собственность на СМИ;\n4. свободная конкуренция мнений на “рынке идей”;\n5. право критиковать власть;\n6. убеждение, что истина выявляется через открытое столкновение разных точек\nзрения.\n\nЛибертарианская модель прессы исходит из идеи, что человек способен рационально\nискать истину, сравнивать разные мнения и самостоятельно делать выводы. Поэтому\nпресса должна быть свободной площадкой для выражения мнений, критики власти и\nконкуренции идей. В классической теории Сиберта, Питерсона и Шрамма\nлибертарианская модель противопоставляется авторитарной: пресса не должна быть\nинструментом государства, а должна быть свободна от государственного контроля и\nвлияния.\n\nИсточники: Голуб, Тихонова «Теория коммуникации», 2016;\nБогомолова «Социальная психология массовой коммуникации», 2010; дополнительно:\nSiebert, Peterson, Schramm “Four Theories of the Press”.","hint":"Для либертарианской модели прессы НЕ характерны государственный контроль, цензура, лицензирование прессы, подчинение СМИ интересам власти или партии.","category":"Медиа и теория"},{"num":13,"title":"Медиарилейшнз как одно из направлений пиар-деятельности.","answer":"Медиарилейшнз (media relations) — это направление PR, связанное с выстраиванием\nи поддержанием отношений со средствами массовой информации (СМИ). Его\nосновная цель — формирование положительного информационного поля вокруг\nорганизации, бренда или персоны через публикации в медиа.\n\nКлючевые задачи медиарилейшнз:\n\n● установление контактов с журналистами и редакциями;\n● подготовка и распространение пресс-релизов, комментариев, интервью;\n● организация инфоповодов (пресс-конференции, события);\n● контроль и анализ публикаций в СМИ;\n● управление репутацией в медиапространстве.\n\nТаким образом, медиарилейшнз — это инструмент влияния на общественное мнение\nчерез медиа, который помогает формировать доверие и узнаваемость.\n\nИли\n\nМедиарилейшнз (Media Relations, MR, взаимодействие со СМИ) — это область PR,\nкоторая отвечает за выстраивание связей с журналистами и взаимодействие со СМИ.\n\nИногда термины Media Relations и Public Relations используют как синонимы. Однако\nMR предполагает работу только с журналистами и медиа. PR же включает в себя\nвзаимодействие и с другими аудиториями. Например, мероприятия для инвесторов и\nклиентов.\n\nМедиарилейшенз предполагают как платное распространение информации, так и\nполучение бесплатных упоминаний с помощью паблисити\n\nФункции MR:\n\nПовышать узнаваемость. Чем чаще компанию и ее продукты упоминают в медиа,\nтем больше влияния на рынке она имеет. По статистике, 60% покупателей выбирают\nна полке товар бренда, о котором они уже что-то слышали.\n\nУлучшать репутацию. Компании выражают в СМИ свое мнение на популярные у\nаудитории темы. Благодаря этому они получают уважение потенциальных клиентов,\nкоторые разделяют ту же точку зрения. Например, пишут о важности безопасного для\nприроды производства и улучшают этим репутацию среди эко-активистов.\n\nПривлекать клиентов. Упоминания в СМИ косвенно помогают увеличить продажи.\nКрупные предприятия расширяют клиентскую базу за счёт федеральных изданий.\nМалый и средний бизнес чаще выстраивает взаимовыгодные отношения с\nпрофильными и локальными СМИ.\n\nИсточник:","hint":"Медиарилейшнз (media relations) — это направление PR, связанное с выстраиванием и поддержанием отношений со средствами массовой информации (СМИ).","category":"Медиа и теория"},{"num":14,"title":"Основные стратегии в пиар-деятельности.","answer":"Стратегия — это план действий, которого придерживается пиар-служба. В идеале\nстратегия должна строиться на базе бизнес-целей компании.\nНиже представлены разные сегментации стратегий.\nФундаментальные стратегии PR: ключ к аудитории\nПервая стратегия — сегментация аудитории. Метод предполагает разделение общей\nмассы потенциальных клиентов на группы по демографическим, психографическим и\nповеденческим признакам. Это позволяет адаптировать сообщения под конкретные\nпотребности каждого сегмента.\nВторая стратегия — позиционирование бренда. Здесь ключевая задача — выстроить\nв сознании аудитории четкое представление о том, что представляет собой компания,\nчем она отличается от конкурентов и какие ценности транслирует. Сильное\nпозиционирование становится основой для всех коммуникационных активностей.\n\nТретья стратегия — создание нарратива бренда. Это последовательное\nповествование о компании, которое объединяет все коммуникации в единую историю,\nрезонирующую с ценностями целевой аудитории. Сильный нарратив делает бренд\nзапоминающимся и формирует эмоциональную связь с потребителями.\nЧетвертая стратегия — интегрированные коммуникации. Этот подход обеспечивает\nсогласованность всех сообщений бренда независимо от канала распространения, что\nусиливает общее впечатление и избегает размывания ключевых идей.\n\nИсточник:15 эффективных PR-стратегий: как преобразить бизнес и покорить рынок\n\n______\n\n____\n\nВ зависимости от цели продвижения различают несколько значимых направлений PR\nдеятельности:\n\nАнтикризисный пиар. Выявление репутационных рисков и разработка\nкоммуникаций для защиты имиджа бренда.\nВнутрикорпоративный пиар. Выстраивание позитивных отношений между\nорганизацией и сотрудниками.\nСоциальный пиар. Создание образа социально ответственного бренда.\nПродуктовый пиар. Продвижение отдельных продуктов или услуг компании.\nGR-коммуникации (government relations). Формирование отношений между\nгосударственными и частными организациями.\nИсточник: Что такое PR-стратегия, зачем она нужна и как ее разработать |\nUnisender\n\n________\n\n1. Стратегия управления репутацией (Репутационная)\nЭто базовая стратегия для удержания позиций. Работает на опережение: создание и\nподдержание положительного образа компании, первого лица или бренда.\nИнструменты:Публикация успешных кейсов, премии, рейтинги (например, «Лучший\nработодатель»), экспертные колонки.\nЦель: Выстроить доверие и «подушку безопасности» на случай кризиса.\n2. Стратегия лидерства мнений (Thought Leadership)\nПродвижение конкретных людей как топ-экспертов в отрасли. Компания ассоциируется\nс интеллектуальной силой своих сотрудников.\nИнструменты: Выступления на профильных конференциях, публикация аналитических\nотчетов и книг, комментарии для деловых СМИ.\nЦель: Уход от прямой рекламы; продажи через формирование спроса и уважение к\nзнаниям команды.\n3. Кризисная стратегия (Антикризисный PR)\nРеактивная стратегия, используемая при угрозах (отзыв продукции, скандал, негатив в\nсоцсетях). Делится на подвиды:\nАктивная защита: Быстрое опровержение фейков, суды за клевету, встречные\nрасследования.\nПассивная защита («Страус»): Игнорирование проблем. Используется редко (только\nкогда негатив исходит от неавторитетного источника).\nКлассическое управление: Признание ошибки, публичные извинения, план\nисправления.\n4. Стратегия продвижения (Промо-стратегия)\nФокусируется на конкретном продукте или акции в моменте.\nТрадиционная: Пресс-релизы о новинках, обзоры у блогеров, партнерский материал в\nСМИ.\nВирусная (Buzz PR): Создание мемов, неоднозначных роликов, челленджей для\n«сарафанного радио».\nЦель: Быстрый рост упоминаний и трафика на сайт, анонс распродажи или релиза.\n\n5. Информационная (Media Relations) стратегия\nРабота по принципу «шума в трубе» — постоянное потоковое информирование\nжурналистов без ярких поводов.\nПодходы: Формирование пула лояльных журналистов, рассылка дайджестов,\nорганизация инфоповодов под ключевые издания.\nЦель: Добиться, чтобы СМИ писали о компании сами, даже когда «ничего не\nслучилось».\n6. Стратегия влияния (Influencer Relations)\nЗамена прямой рекламы на мнение лидеров. Делится на:\nМакро-инфлюенсеры (миллионники): Охват + имидж. Часто работает плохо из-за\nпотери доверия.\nМикро-инфлюенсеры (5-50 тыс.): Глубокая лояльность, узкая ниша.\nЦель: Передать доверие аудитории к личности на доверие к бренду.\n7. Социально ориентированная (ESG-стратегия)\nСмещение фокуса «прибыль» на «ценность для общества и экологии».\nМеханизм: Отказ от пластика, благотворительность, защита сотрудников.\nЦель: Апелляция к «миллениалам» и «зумерам», улучшение отношения власти,\nпопадание в этичные рейтинги.\n8. Внутренняя PR-стратегия\nРабота направлена не наружу, а внутрь компании (на персонал).\nИнструменты: Антикризисные письма CEO, корпоративные соцсети (Slack, Workplace),\nгеймификация KPI.\nЦель: Чтобы сотрудники стали бренд-амбассадорами и не сливали негатив (или\nсопротивлялись кризису изнутри).\nИсточники: ГПНТБ России - Полное описание , Роль современных PR-стратегий в\nпостроении имиджей и брэндов – тема научной статьи по СМИ (медиа) и массовым\nкоммуникациям читайте бесплатно текст научно-исследовательской работы в\nэлектронной библиотеке КиберЛенинка , Паблик рилейшнз: системные модели,\nтехнологии - книга | ИСТИНА – Интеллектуальная Система Тематического\nИсследования НАукометрических данных\n_____\nИмиджевая стратегия (создание и поддержание репутации)\nСама суть PR определяется как «управление коммуникациями... для формирования\nпозитивного образа и репутации». Ключевое отличие от маркетинга в том, что «PR же\nработает на долгосрочную репутацию и доверие». В основе этой стратегии лежит\nпостроение прочных, долгосрочных отношений с обществом, а не сиюминутная\nвыгода. Результат такой работы — «рост узнаваемости, лояльности и укрепление\nимиджа в глазах людей».\nСтратегия лидерства мнений (экспертная стратегия)\nЭта стратегия нацелена на формирование экспертного статуса компании или ее\nпервых лиц. В статье отмечается, что «PR через независимые СМИ — это продвигает\nи экспертизу компании». Когда в стратегии ставят «цель – стать экспертом отрасли,\n\nставка делается на публикации в отраслевых СМИ, создание экспертного блога,\nвыступления на конференциях».\nКризисная стратегия\nКризисный PR является одной из ключевых функций: одна из целей пиара —\n«помогать бизнесу выдерживать кризисы». Также отмечается комплексный характер\nэтой работы: «PR-кампания ориентирована на всю общественность... инвесторов,\nСМИ, регулирующие органы». Работа с кризисом также включает «работу с\nкомментариями» и обратную связь, что подчеркивает диалоговый характер PR в\nпротивовес односторонней рекламе.\nПромо-стратегия (продвижение новых продуктов)\nЭта стратегия фокусируется на создании информационных поводов для привлечения\nвнимания к конкретному продукту или событию. «запуск нового продукта могут\nсопровождать пресс-релиз, мероприятие-презентация и волна постов в соцсетях\nодновременно». Сюда же относится и создание необычных инфоповодов для\nпривлечения внимания СМИ, например, когда «ресторан может устроить бесплатный\nужин на высоте 50 метров при помощи крана – чисто ради PR, чтобы все об этом\nговорили».\nИнформационная стратегия (Media Relations)\nЭто стратегия систематической работы со средствами массовой информации. В\nзадачи PR-специалиста входит «писать пресс-релизы, общаться со СМИ», а также\n«выстраивать доверительные отношения с ключевыми журналистами: помогать с\nинформацией, эксклюзивами – чтобы при любом инфоповоде они были на вашей\nстороне».\nСтратегия работы с лидерами мнений (Influencer Relations)\nВ современном PR работа с блогерами и лидерами мнений становится важным\nканалом коммуникации. В статье это упоминается в контексте выбора инструментов\nдля разных аудиторий: если стоит «цель – привлечь молодежную аудиторию к новому\nприложению, фокус на соцсети, блогеров, вирусные механики».\nСоциально-ориентированная стратегия (ESG)\nЭта стратегия строится на формировании образа социально ответственной компании.\nОна реализуется через публичные заявления и инфоповоды, демонстрирующие\nприверженность важным общественным ценностям. В тексте приводится пример\nключевого сообщения для такой стратегии: «Наша компания – инновационный\nтехнологический лидер, который заботится об экологии».\nВнутренняя PR-стратегия\nХотя эта стратегия не вынесена в отдельный блок, о ее важности говорит тот факт, что\nцелевой аудиторией PR-кампании автор называет в том числе «сотрудников». Это\nподразумевает, что часть коммуникаций направлена внутрь компании для\nформирования корпоративной культуры и лояльности персонала.\n\nСтратегический подход\nВажно понимать, что успешная PR-стратегия — это всегда «продуманный план...\nкомплексная, реалистичная и творческая» работа. Она требует глубокого анализа\nаудитории, четкой постановки измеримых целей (например, «повысить узнаваемость\nна X%») и выбора правильных каналов коммуникации.\n\nИсточник:PR-продвижение: что это, виды, инструменты, стратегии, этапы работ -\nНовости агентства PR Partner","hint":"Стратегия — это план действий, которого придерживается пиар-служба.","category":"PR-деятельность"},{"num":15,"title":"Понятие целевой аудитории и контактной группы в пиар.","answer":"Связи с общественностью (PR) как часть Коммуникационные науки и Маркетинг\nпредставляют собой системную деятельность по управлению коммуникациями между\nорганизацией и её общественностью. Центральное место в этой деятельности\nзанимают понятия целевой аудитории и контактных групп (publics), поскольку именно\nчерез них определяется направление и содержание PR-коммуникаций.\n\n1. Понятие целевой аудитории (ЦА) в PR\nЦелевая аудитория - это конкретная, четко очерченная группа людей или организаций,\nна которую направлено основное коммуникационное воздействие PR-кампании.\nИменно от реакции и действий этой группы напрямую зависит достижение\nпоставленных целей (улучшение имиджа, рост лояльности, преодоление кризиса,\nпобеда на выборах).\n\nB PR целевая аудитория определяет саму суть коммуникации: что будет сказано, как,\nгде и от чьего имени. Сообщение конструируется исключительно под её запросы и\nкартину мира.\n\nОсновные критерии сегментации целевой аудитории:\n● Социально-демографические: пол, возраст, уровень дохода, образование,\nпрофессия.\n● Географические: регион проживания, плотность населения.\n● Психографические: ценности, убеждения, образ жизни, интересы, страхи.\n● Поведенческие: мотивы принятия решений, готовность к взаимодействию,\nстепеньлояльности.\n\nПример: Для запуска нового экологически чистого косметического бренда целевой\nаудиторией будут женщины 20-35 лет, со средним или высоким доходом, активно\nинтересующиеся темой экологии и осознанного потребления.\n\n2. Понятие контактной группы (контактной аудитории)\nКонтактная группа (аудитория) - это любая группа людей, организаций или институтов,\nкоторая проявляет реальный или потенциальный интерес к деятельности\nкомпании и может оказать влияние на ее способность достигать своих целей.\n\nЕсли целевая аудитория - это те, кому вы хотите донести сообщение, то контактная\nаудитория — это те, с кем вам приходится или необходимо взаимодействовать в\nпроцессе работы. Контактные аудитории формируют микросреду организации.\n\nКлассик маркетинга и PR Филипп Котлер выделяет три типа контактных аудиторий по\nхарактеру их отношения к компании:\n● Благотворные (лояльные) аудитории: группы, чье отношение к компании\nизначально позитивно (например, постоянные партнеры, спонсоры, лояльные\nамбассадоры бренда).\n● Искомые аудитории: группы, чьего внимания и поддержки компания активно\nищет, но не всегда легко получает (классический пример - авторитетные СМИ,\nлидеры мнений, крупные инвесторы).\n● Нежелательные аудитории: группы, внимания которых компания старается\n\nизбежать, но вынуждена с ними считаться в случае их активизации (например,\nрадикальные группы эко-активистов, потребители, организующие бойкот, налоговые\nпроверки).\n\nОсновные виды контактных групп:\n● Финансовые круги: банки, инвесторы, брокеры, акционеры. Влияют на\nдоступность капитала. Средства массовой информации (СМИ): журналисты,\nредакторы, блогеры. Формируют общественное мнение.\n● Государственные учреждения (GR): регулирующие органы, чиновники,\nзаконодатели. Влияют на правовое поле работы компании.\n● Гражданские группы действий: профсоюзы, общественные фонды, активисты.\n● Местные контактные аудитории: жители районов, где располагаются офисы или\nпроизводства компании (community relations).\n● Широкая публика: общество в целом, чье базовое отношение формирует общий\nимидж компании.\n\n3. Главные отличия\n\nДля наглядного понимания\nразницы лучше всего\nиспользовать\nсравнительный анализ:\n\nКритерий Целевая аудитория (ЦА) Контактная группа\n(аудитория)\n\nРоль в PR-кампании Главный объект и Окружающая среда и\nконечный адресат стейкхолдеры, в рамках\nинформационного которой идет кампания.\nвоздействия.\n\nЦель коммуникации Побудить к конкретному Выстроить долгосрочные\nдействию, изменить отношения, предотвратить\nмодель поведения или конфликты, заручиться\nмнение. поддержкой.\n\nХарактер взаимодействия Проактивный. Часто реактивный.\nИнициатором всегда Компания отвечает на\nвыступает сама компания. запросы СМИ,\nрегуляторов или\nнедовольство местных\nжителей.\n\nКоммерческий интерес Чаще всего являются Могут вообще ничего не\nпрямыми или покупать у компании, но\nпотенциальными имеют власть разрушить\nпотребителями (в ее репутацию или бизнес.\nкоммерческом PR).\n\nПример на практике (для Крупные застройщики, Местная администрация,\nзавода по производству оптовые покупатели, экологический надзор,\nстройматериалов) прорабы. жители соседних домов,\n\nотраслевые журналисты.\n\n4. Роль в PR-деятельности\nОпределение этих категорий необходимо для:\n● разработки PR-стратегии;\n● сегментации общественности;\n● выбора каналов коммуникации;\n● формирования ключевых сообщений;\n● управления репутацией;\n● антикризисного PR.\n\nВ кризисных ситуациях:\nособое значение приобретают активные контактные группы (СМИ, общественные\nорганизации), так как они могут усилить или ослабить кризис.\n\nТаким образом, контактные группы формируют всю систему взаимодействия\nорганизации с общественностью, а целевая аудитория представляет собой\nстратегически выбранную часть этих групп. Их правильное определение является\nосновой эффективной PR-деятельности и управления репутацией.\n\nСсылки:\nИсточник (электронная версия): Гуманитарный портал, классификация контактных\nаудиторий:","hint":"Связи с общественностью (PR) как часть Коммуникационные науки и Маркетинг представляют собой системную деятельность по управлению коммуникациями между организацией и её общественностью.","category":"PR-деятельность"},{"num":16,"title":"С чего начинается работа по подготовке мероприятия?","answer":"Работа по подготовке любого мероприятия (корпоратива, конференции, праздника)\nначинается не с поиска площадки или подрядчиков, а с определения\nфундаментальных основ.\n\nВот пошаговое начало работы:\n1. Определение цели и задач (зачем?)\nЭто самый первый и важный шаг. Нужно ответить на вопрос: «Что мы хотим\nполучить в итоге?». Цель может быть: сплочение команды, презентация нового\nпродукта, обучение, подведение итогов или развлечение. От цели зависит\nформат и весь бюджет.\n2. Анализ целевой аудитории (для кого?)\nНужно понимать потребности, интересы и количество участников. Для\nвнутренних мероприятий (корпоративов) стоит провести опрос сотрудников,\nчтобы понять их предпочтения.\n3. Определение формата и концепции (что?)\nИсходя из цели и аудитории, выбирается форма: семинар, тимбилдинг, банкет,\nонлайн-трансляция и т.д. На этом этапе создается «скелет» программы и\nглавная идея (тематика).\n4. Установление предварительного бюджета (сколько?)\nОпределение верхнего предела расходов. Без понимания бюджета невозможно\nвыбирать площадку и подрядчиков.\n5. Назначение даты и формирование команды\nОпределение рабочей группы, распределение ролей (кто отвечает за контент,\nкто за техническую часть) и фиксация даты.\n\nИтог первого этапа: У вас должен быть сформирован бриф или концепция\nмероприятия, где четко прописано «Цель — Аудитория — Формат — Бюджет — Дата».\nТолько после этого начинается поиск площадки и проработка сценария.\n\nИсточники:","hint":"Работа по подготовке любого мероприятия (корпоратива, конференции, праздника) начинается не с поиска площадки или подрядчиков, а с определения фундаментальных основ.","category":"Прочее"},{"num":17,"title":"Процесс планирования и реализации коммуникационных стратегий для достижения целей связей с общественностью – это…","answer":"Процесс планирования и реализации коммуникационных стратегий для достижения\nцелей связей с общественностью — это PR-деятельность (или паблик рилейшнз, PR).\n\nЧто это такое ?\n\nЭто управление коммуникациями между организацией и её целевой аудиторией,\nнаправленное на формирование и поддержание положительного имиджа, репутации и\nдоверия.\n\nОтличительные функции:\n\n1. Коммуникативная функция\nОбеспечивает двустороннюю связь между организацией и аудиторией (не просто\nговорить, а ещё и слушать и учитывать обратную связь).\n\n2. Имиджевая функция\nФормирование и поддержание положительного образа компании, бренда или\nличности.\n\n3. Репутационная функция\nРабота с доверием: укрепление репутации и управление ею в долгосрочной\nперспективе.\n\n4. Информационная функция\nДонесение значимой и достоверной информации до общественности (через СМИ,\nсоцсети, мероприятия и т.д.).\n\n5. Аналитическая функция\nИзучение общественного мнения, анализ аудитории, мониторинг реакции на действия\nкомпании.\n\n6. Прогностическая функция\nПредсказание возможных реакций общества и предотвращение кризисов.\n\n7. Управленческая функция\nУчастие в принятии решений внутри организации с учётом общественного мнения.\n\n8. Кризисная (антикризисная) функция\nРабота с негативом: минимизация репутационных потерь в сложных ситуациях.\n\nИсточник :","hint":"Процесс планирования и реализации коммуникационных стратегий для достижения целей связей с общественностью — это PR-деятельность (или паблик рилейшнз, PR).","category":"Коммуникации и тексты"},{"num":18,"title":"Короткая фраза, раскрывающее суть компании, продукта, персоны – это…","answer":"Слоган\nСлоган — это короткая фраза, в которой отражено главное сообщение бренда. Это\nдевиз, с помощью которого бренд привлекает покупателей. Он выделяет бренд в\nлинейке конкурентов.\nУдачный слоган продвигает компанию или продукт. Он повышает узнаваемость и легко\nзапоминается. Человек может не помнить, где видел слоган, но запомнить саму фразу\nи ассоциировать его с продуктом. Разберем, как создавать рекламные слоганы,\nкоторые запомнят покупатели.\nТипы слоганов\nРекламные фразы классифицируют по нескольким признакам:\n● по целям: имиджевые и товарные;\n● по формулировке: утверждение, вопрос, призыв;\n● по сроку действия: стратегические и тактические;\n● по воздействию на аудиторию: эмоциональные и рациональные;\n● по приемам: метафоры, юмор, гиперболы и т. д.\nОсновные характеристики слогана\n● краткость,\n● выразительность,\n● точность,\n● оригинальность,\n● соответствие стратегии позиционирования.\nФункции слогана\n● информационная — сообщает суть предложения.\n● имиджевая — формирует образ бренда.\n● мнемоническая — облегчает запоминание.\n● коммуникативная — связывает бренд с аудиторией.\nПримеры:\n● «Just Do It» — Nike\n● «Think Different» — Apple","hint":"Слоган — это короткая фраза, в которой отражено главное сообщение бренда.","category":"Прочее"},{"num":19,"title":"Что включает в себя цикл управления пиар-кампаниями RACE?","answer":"Цикл PR-кампании RACE (Research, Action planning, Communication, Evaluation)\nвключает четыре последовательных этапа:\n\n1. Research (Исследование)\nПроводится комплексное маркетинговое исследование для сбора и анализа\nинформации, необходимой для планирования. Включает:\n\n● анализ внешней и внутренней среды, SWOT-анализ, обзор текущих\nмаркетинговых коммуникаций;\n● исследование внутренней среды: анализ по комплексу 4P (7P) (Продукт, Цена,\nМесто, Продвижение + Люди, Процесс, Внешнее оформление) и\nбизнес-процессов;\n● анализ макросреды: STEP-анализ (социальные, технологические,\nэкономические, политико-правовые факторы) с экспертной балльной оценкой и\nпостроением матрицы факторов по степени влияния;\n● анализ микросреды: изучение стейкхолдеров, сегментирование целевой\nаудитории (классическое, теория поколений, VALS, Khramatrix, 5W, лестница Б.\nХанта), стратегический конкурентный анализ (сравнительный анализ, модель\nпяти сил М. Портера), анализ основных экономических показателей.\n\n2. Action planning (Планирование действий)\nРазработка стратегии и тактики кампании на основе данных исследования:\n\n● постановка целей и задач с помощью методик «Дерево целей» (иерархическая\nструктура) и SMART (конкретность, измеримость, достижимость, значимость,\nограниченность во времени);\n● определение целевых аудиторий, построение карты эмпатии, карты пути\nклиента, анализ клиентского опыта;\n● подбор PR-инструментов и мероприятий;\n● составление дорожной карты (задачи, сроки), бюджета, матрицы\nответственности;\n● анализ рисков (диаграмма Исикавы).\n\n3. Communication (Выполнение)\nНепосредственная реализация PR-кампании в строгом соответствии с разработанным\nпланом. На этом этапе ведётся постоянный мониторинг хода выполнения.\n\n4. Evaluation (Оценка)\nОценка эффективности PR-кампании с применением различных методов: опросы\nцелевой аудитории, анализ продаж, мониторинг упоминаний в СМИ, измерение\nиндекса лояльности потребителей, динамика конверсии и другие показатели.\n\nИсточник:\n\nanizatsii","hint":"Цикл PR-кампании RACE (Research, Action planning, Communication, Evaluation) включает четыре последовательных этапа: 1.","category":"PR-деятельность"},{"num":20,"title":"Антикризисный пиар — это вид деятельности, направленный на…","answer":"Антикризисный PR — это вид деятельности, направленный на минимизацию\nнегативных последствий кризисной ситуации для репутации компании, бренда\nили организации, а также на сохранение доверия клиентов, партнёров и\n\nобщественности. Его цель — быстро и эффективно реагировать на негативные\nсобытия, предотвратить утрату доверия и восстановить репутацию бренда.\nКлючевые аспекты антикризисного PR:\n\n● Прогнозирование и профилактика. Включает анализ рисков, выявление\nпотенциальных угроз, разработку стратегий по предотвращению кризисов и\nподготовку к возможным неблагоприятным ситуациям.\n● Оперативное реагирование. Быстрое реагирование на кризисные события,\nофициальное информирование аудитории, работа со СМИ, социальными\nсетями, интернет-сообществами и пресс-службами.\n● Минимизация у
